le just don't care.","text":"Thì cũng… Mọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà.\nnhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.\\n뭐 그냥...사람들은 다 좋은데...청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요\\nIt's just...they are all good people,\njust not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","koRange":{"start":846.3,"end":859.214116},"viRange":{"start":804.142404,"end":818.338229},"start":804.142404,"end":859.214116,"koSentenceMarks":[851.629,854.937,858.165,859.214],"koShadowSegments":[{"index":0,"start":846.3,"end":851.629,"text":"뭐 그냥...사람들은 다 좋은데...청소를 좀...","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":1,"start":851.629,"end":854.937,"text":"하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":2,"start":854.937,"end":858.165,"text":"난 열심히 하는데... 대충하는 사람 보면","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":3,"start":858.165,"end":859.214,"text":"진짜 짜증 나요","speed":1,"cueUid":"merged-mrp0tfmc-74"}],"hasShadow":true,"segments":[{"index":0,"start":846.3,"end":851.629,"text":"뭐 그냥...사람들은 다 좋은데...청소를 좀...","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":1,"start":851.629,"end":854.937,"text":"하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":2,"start":854.937,"end":858.165,"text":"난 열심히 하는데... 대충하는 사람 보면","speed":1,"cueUid":"merged-mrp0tfmc-74"},{"index":3,"start":858.165,"end":859.214,"text":"진짜 짜증 나요","speed":1,"cueUid":"merged-mrp0tfmc-74"}]},{"id":58,"cueNo":59,"displayNo":59,"sourceUid":"merged-mt3xxvxa-2","uid":"merged-mt3xxvxa-2","originalCueNo":59,"vi":"Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà.\nChính xác. Chỗ tôi sống trước đây,\nhọ chỉ dọn vệ sinh đúng một lần một tuần thôi.","ko":"맞아요 화장실, 거실... 이런 데는...\n깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요. 전에 o?","ko":"네...맨날 나만 보면 놀리고 괴롭히고\n못난이라 그러고\n그러니까, 그 선배는 조심해야 돼요\n그런 거냐?","en":"Yes. He always teases me and bothers me... calls me ugly. I need to watch out. Is that so?","text":"Vâng. Anh ấy cứ nhìn thấy em là trêu chọc, kêu là con bé xấu xí. Nên em phải cẩn thận tiền bối ấy. Là vậy sao?\\n네...맨날 나만 보면 놀리고 괴롭히고\n못난이라 그러고\n그러니까, 그 선배는 조심해야 돼요\n그런 거냐?\\nYes. He always teases me and bothers me... calls me ugly. I need to watch out. Is that so?","koRange":{"start":1067.482721,"end":1088.272681},"viRange":{"start":1105,"end":1113.412426},"start":1067.482721,"end":1113.412426,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":79,"cueNo":80,"displayNo":80,"sourceUid":"ko-mrob2li8-781","uid":"ko-mrob2li8-781","originalCueNo":80,"vi":"[Nhạc nền sôi động bắt đầu]","ko":"[경쾌한 배경 음악 시작]","en":"[Upbeat background music starts]","text":"[Nhạc nền sôi động bắt đầu]\\n[경쾌한 배경 음악 시작]\\n[Upbeat background music starts]","koRange":null,"viRange":null,"start":0.5870000000000004,"end":0.5880000000000004,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":80,"cueNo":81,"displayNo":81,"sourceUid":"merged-mrpqutqf-35","uid":"merged-mrpqutqf-35","originalCueNo":81,"vi":"Nếu không phải cậu ta thì là ai?\nTrời ạ… Để đôi tay mảnh khảnh kia phải bưng bê thì hổ thẹn cho đấng mày râu quá.","ko":"그 남자 아니면 누구야?\n(남학생) 이런, 이런...\n그 가녀린 팔로 짐을 들다니\n이거 우리 남자들의 수치인걸...","en":"If it's not him, who is it then?\nCome on...\ncarrying so much in such slender arms...\nthat's a disgrace for men.","text":"Nếu không phải cậu ta thì là ai?\nTrời ạ… Để đôi tay mảnh khảnh kia phải bưng bê thì hổ thẹn cho đấng mày râu quá.\\n그 남자 아니면 누구야?\n(남학생) 이런, 이런...\n그 가녀린 팔로 짐을 들다니\n이거 우리 남자들의 수치인걸...\\nIf it's not him, who is it then?\nCome on...\ncarrying so much in such slender arms...\nthat's a disgrace for men.","koRange":{"start":1078.010184,"end":1106.332},"viRange":{"start":1113.412426,"end":1129.541389},"start":1078.010184,"end":1129.541389,"koSentenceMarks  để mua quà cho bạn trai? Tớ thế bao giờ? \nTớ thật sự không phải người như thế.","ko":"(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜","en":"Do you have so much money? \nIt wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","text":"Chắc cậu giàu lắm hả? \nSuốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? \nTớ thật sự không phải người như thế.\\n(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜\\nDo you have so much money? \nIt wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","koRange":{"start":1475.058213,"end":1482.96137},"viRange":{"start":1501.417263,"end":1508.070382},"start":1475.058213,"end":1508.070382,"koSentenceMarks":[1477.802,1480.212,1481.456,1482.839],"koShadowSegments":[{"index":0,"start":1475.058213,"end":1477.802,"text":"(송지원) 돈이 차고 넘치니","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":1,"start":1477.802,"end":1480.212,"text":"남친 선물한다고 맨날 빌붙어놓고","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":2,"start":1480.212,"end":1481.456,"text":"(정예은) 내가 또 언제 그랬다고!","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":3,"start":1481.456,"end":1482.839,"text":"나 그런 사람 아니다, 진짜","speed":1,"cueUid":"merged-mrp4u1hi-184"}],"hasShadow":true,"segments":[{"index":0,"start":1475.058213,"end":1477.802,"text":"(송지원) 돈이 차고 넘치니","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":1,"start":1477.802,"end":1480.212,"text":"남친 선물한다고 맨날 빌붙어놓고","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":2,"start":1480.212,"end":1481.456,"text":"(정예은) 내가 또 언제 그랬다고!","speed":1,"cueUid":"merged-mrp4u1hi-184"},{"index":3,"start":1481.456,"end":1482.839,"text":"나 그런 사람 아니다, 진짜","speed":1,"cueUid":"merged-mrp4u1hi-184"}]},{"id":101,"cueNo":102,"displayNo":102,"sourceUid":"merged-mrp4v4wj-186","uid":"merged-mrp4v4wj-186","originalCueNo":102,"vi":"Không phải cái khỉ gió. Thế hôm nay cậu đãi thịt đi. \nHôm nay em cứ mua đồ em cần thôi, lúc sau tính quỹ chung rồi mua.","ko":"(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴! \n(윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사","en":"Says who? Then you pay for dinner today.\nYou buy what you need for now,\nthen we can discuss the rest later.","text":"Không phải cái khỉ gió. Thế hôm nay cậu đãi thịt đi. \nHôm nay em cứ mua đồ em cần thôi, lúc sau tính quỹ chung rồi mua.\\n(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴! \n(윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사\\nSays who? Then you pay for dinner today.\nYou buy what you need for now,\nthen we can discuss the rest later.","koRange":{"start":1482.96137,"end":1489.700961},"viRange":{"start":1508.070382,"end":1516.432468},"start":1482.96137,"end":1516.432468,"koSentenceMarks":[1485.941,1489.472],"koShadowSegments":[{"index":0,"start":1482.96137,"end":1485.941,"text":"(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴!","speed":1,"cueUid":"merged-mrp4v4wj-186"},{"index":1,"start":1485.941,"end":1489.472,"text":"(윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사","speed":1,"cueUid":"merged-mrp4v4wj-186"}],"hasShadow":true,"segments":[{"index":0,"start":1482.96137,"end":1485.941,"text":"(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴!","speed":1,"cueUid":"merged-mrp4v4wj-186"},{"index":1,"start":1485.941,"end":1489.472,"text":"(윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사","speed":1,"cueUid":"merged-mrp4v4wj-186"}]},{"id":102,"cueNo":103,"displayNo":103,"sourceUid":"merged-mrp4wkl9-190","uid":"merged-mrp4wkl9-190","originalCueNo":103,"vi":"[Bíp bíp bíp tiếng cửa] [Tiếng đóng cửa]","ko":"[삑삑삑 문소리] [문 닫는 소리]","en":"[Beep beep beep sound of door]\n[Sound of door closing]","text":"[Bíp bíp bíp tiếng cửa] [Tiếng đóng cửa]\\n[삑삑삑 문소리] [문 닫는 소리]\\n[Beep beep beep sound of door]\n[Sound of door closing]","koRange":{"start":1489.700961,"end":1525.379782},"viRange":{"start":1516.432468,"end":1550.152063},"start":1489.700961,"end":1550.152063,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":103,"cueNo":104,"displayNo":104,"sourceUid":"merged-mrp4vzyr-188","uid":"merged-mrp4vzyr-188","originalCueNo":104,"vi":"Khi em nói em là sinh viên,\ntôi còn tưởng em ra vẻ nữa.\nNghĩ lại cũng đều do tôi tự ti\nvì chỉ tốt nghiệp cấp ba.\nTôi vẫn chưa hoàn thiện bản thân.","ko":"그때는... 진명 씨가 대학생이라고 해서 \n괜히 유세 떠는 줄 알았어요 그러고 보면... \n내가 고졸인 거에 되게... \n자격지심이 있었던 거죠 아직 완성이 덜 되었어요 내가...","en":"When you said you were a college student... I thought you were conceited. When I think about it, I was not confident about myself not going to college. I still need to grow.","text":"Khi em nói em là sinh viên,\ntôi còn tưởng em ra vẻ nữa.\nNghĩ lại cũng đều do tôi tự ti\nvì chỉ tốt nghiệp cấp ba.\nTôi vẫn chưa hoàn thiện bản thân.\\n그때는... 진명 씨가 대학생이라고 해서 \n괜히 유세 떠는 줄 알았어요 그러고 보면... \n내가 고졸인 거에 되게... \n자격지심이 있었던 거죠 아직 완성이 덜 되었어요 내가...\\nWhen you said you were a college student... I thought you were conceited. When I think about it, I was not confident about myself not going to college. I still need to grow.","koRange":{"start":1525.379782,"end":1542.852785},"viRange":{"start":1550.152063,"end":1565.60429},"start":1525.379782,"end":1565.60429,"koSentenceMarks":[1528.529,1531.913,1534.093,1540.173],"koShadowSegments":[{"index":0,"start":1525.38,"end":1528.529,"text":"그때는... 진명 씨가 대학생이라고 해서","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":1,"start":1528.529,"end":1531.913,"text":"괜히 유세 떠는 줄 알았어요 그러고 보면...","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":2,"start":1531.913,"end":1534.093,"text":"내가 고졸인 거에 되게...","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":3,"start":1534.093,"end":1540.173,"text":"자격지심이 있었던 거죠. 아직 완성이 덜 되었어요 내가...","speed":1,"cueUid":"merged-mrp4vzyr-188"}],"hasShadow":true,"segments":[{"index":0,"start":1525.38,"end":1528.529,"text":"그때는... 진명 씨가 대학생이라고 해서","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":1,"start":1528.529,"end":1531.913,"text":"괜히 유세 떠는 줄 알았어요 그러고 보면...","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":2,"start":1531.913,"end":1534.093,"text":"내가 고졸인 거에 되게...","speed":1,"cueUid":"merged-mrp4vzyr-188"},{"index":3,"start":1534.093,"end":1540.173,"text":"자격지심이 있었던 거죠. 아직 완성이 덜 되었어요 내가...","speed":1,"cueUid":"merged-mrp4vzyr-188"}]},{"id":104,"cueNo":105,"displayNo":105,"sourceUid":"merged-mrp4xo64-192","uid":"merged-mrp4xo64-192","originalCueNo":105,"vi":"Em đưa tay đây. Sao không?\nEm coi nó là dây buộc thôi sao?\nCái này là nhẫn đó. Đưa tay đây nào.","ko":"손 줘 봐요 아, 왜요... 이게 지금 빵 끈으로 보여요? \n이거 절대반집니다 손 줘봐요 어서요","en":"Let me see your hand.\nWhy? Does this look like a bread tie?\nThis is absolutely a ring,\ngive me your hand.","text":"Em đưa tay đây. Sao không?\nEm coi nó là dây buộc thôi sao?\nCái này là nhẫn đó. Đưa tay đây nào.\\n손 줘 봐요 아, 왜요... 이게 지금 빵 끈으로 보여요? \n이거 절대반집니다 손 줘봐요 어서요\\nLet me see your hand.\nWhy? Does this look like a bread tie?\nThis is absolutely a ring,\ngive me your hand.","koRange":{"start":1542.852785,"end":1560.541568},"viRange":{"start":1565.60429,"end":1587.05082},"start":1542.852785,"end":1587.05082,"koSentenceMarks":[1551.044,1560.542],"koShadowSegments":[{"index":0,"start":1542.853,"end":1551.044,"text":"손 줘 봐요. 아, 왜요... 이게 지금 빵 끈으로 보여요?","speed":1,"cueUid":"merged-mrp4xo64-192"},{"index":1,"start":1551.044,"end":1560.541568,"text":"이거 절대반집니다. 손 줘봐요. 어서요","speed":1,"cueUid":"merged-mrp4xo64-192"}],"hasShadow":true,"segments":[{"index":0,"start":1542.853,"end":1551.044,"text":"손 줘 봐요. 아, 왜요... 이게 지금 빵 끈으로 보여요?","speed":1,"cueUid":"merged-mrp4xo64-192"},{"index":1,"start":1551.044,"end":1560.541568,"text":"이거 절대반집니다. 손 줘봐요. 어서요","speed":1,"cueUid":"merged-mrp4xo64-192"}]},{"id":105,"cueNo":106,"displayNo":106,"sourceUid":"merged-mrp4xuj8-193","uid":"merged-mrp4xuj8-193","originalCueNo":106,"vi":"Từ giờ em sẽ thành Gollum.","ko":"이제 진명 씨는 골룸이 될 거예요","en":"Now, Jin-Myung Yoon will become Gollum.","text":"Từ giờ em sẽ thành Gollum.\\n이제 진명 씨는 골룸이 될 거예요\\nNow, Jin-Myung Yoon will become Gollum.","koRange":{"start":1560.541568,"end":1577.242532},"viRange":{"start":1587.05082,"end":1602.062521},"start":1560.541568,"end":1602.062521,"koSentenceMarks":[1576.935],"koShadowSegments":[{"index":0,"start":1574,"end":1576.935,"text":"이제 . - Ai làm vậy? Cậu làm hả? - Chào mọi người. - Em đến rồi sao?\nNgồi đi. Tôi ăn xong rồi ạ.\nChưa gì đã xong rồi? Vâng.\nTôi đang giảm cân.\\n안녕하세요 (조현희) 일찍 왔네? \n잘 먹었습니다! \n벌써 다 먹었어? 네...\\nWow, it's really tasty.\nThank you! Who made this? Did you?\nHi. You are early! There is a seat. Thank you.\nAre you already done? Yes.\nI am on a diet.","koRange":{"start":1980.444194,"end":2009.152491},"viRange":{"start":1988.772242,"end":2043.752844},"start":1980.444194,"end":2043.752844,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":125,"cueNo":126,"displayNo":126,"sourceUid":"merged-mrppw2td-21","uid":"merged-mrppw2td-21","originalCueNo":126,"vi":"Chị yêu đương thế nào? Bộ tốt đẹp lắm sao?\nĐồ ngốc, em với chị giống nhau sao?","ko":"야 이, 병신아! 너 지금 그 꼴을 당하고도 야, 이 바보야. 너랑 나랑 같아?","en":"What about your relationship? Are they that great? You idiot, we are not the same.","text":"Chị yêu đương thế nào? Bộ tốt đẹp lắm sao?\nĐồ ngốc, em với chị giống nhau sao?\\n야 이, 병신아! 너 지금 그 꼴을 당하고도 야, 이 바보야. 너랑 나랑 같아?\\nWhat about your relationship? Are they that great? You idiot, we are not the same.","koRange":{"start":1930.294512,"end":1932.222948},"viRange":{"start":1953.543236,"end":1958.181421},"start":1930.294512,"end":1958.181421,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":126,"cueNo":127,"displayNo":127,"sourceUid":"ko-mrob2li8-969","uid":"ko-mrob2li8-969","originalCueNo":127,"vi":"[Tiếng đóng cửa]","ko":"[문 닫는 소리]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\\n[문 닫는 소리]\\n[Sound of door closing]","koRange":null,"viRange":{"start":2043.752844,"end":2050.67493},"start":2043.752844,"end":2050.67493,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":127,"cueNo":128,"displayNo":128,"sourceUid":"merged-mrppxtsi-23","uid":"merged-mrppxtsi-23","originalCueNo":128,"vi":"Sao chị lại đến? Sao chị lại đến làm ầm lên? Đây là nhà bọn em, về nhà chị đi!\nĐi ngay đây! Đừng có đến nữa! eNo":142,"vi":"Để tôi hướng dẫn anh thanh toán. Tạm biệt quý khách. Quý khách đi thong thả. Để tôi giúp quý khách thanh toán. Tổng là 125.800 won ạ.","ko":"계산 도와드리겠습니다. 안녕히 가십시오\n계산 도와 드리겠습니다 125,800원 나왔습니다","en":"You can take care of your bill over there. Thank you.\nHope you had a good time.\nThank you, I will help you.\n125,800 won please.","text":"Để tôi hướng dẫn anh thanh toán. Tạm biệt quý khách. Quý khách đi thong thả. Để tôi giúp quý khách thanh toán. Tổng là 125.800 won ạ.\\n계산 도와드리겠습니다. 안녕히 가십시오\n계산 도와 드리겠습니다 125,800원 나왔습니다\\nYou can take care of your bill over there. Thank you.\nHope you had a good time.\nThank you, I will help you.\n125,800 won please.","koRange":{"start":2378.290423,"end":2395.908194},"viRange":{"start":2416.178083,"end":2438.445204},"start":2378.290423,"end":2438.445204,"koSentenceMarks":[2395.522],"koShadowSegments":[{"index":0,"start":2389,"end":2395.522,"text":"계산 도와 드리겠습니다 125,800원 나왔습니다","speed":1,"cueUid":"merged-mrpx36tb-78"}],"hasShadow":true,"segments":[{"index":0,"start":2389,"end":2395.522,"text":"계산 도와 드리겠습니다 125,800원 나왔습니다","speed":1,"cueUid":"merged-mrpx36tb-78"}]},{"id":142,"cueNo":143,"displayNo":143,"sourceUid":"merged-mrpxd363-94","uid":"merged-mrpxd363-94","originalCueNo":143,"vi":"Có nhanh lên không? Vâng, đến ngay đây ạ. \nHôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. \nKêu anh ấy đến nhà… vì tôi cô đơn.","ko":"빨리 안 가지고 와! \n아 네, 지금 갑니다 \n어젯밤엔 진짜 위험했어요 \n하마터면 애인한테 전화할 뻔했다니까요... \n좀 와달라고...나 외롭다고...","en":"Won't you hurry up? It's coming now. \nIt was really dangerous last night... \nI almost called my lover. \nTo ask him to come... that I am lonely.","text":"Có nhanh lên không? Vâng, đến ngay đây ạ. \nHôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. \nKêu anh ấy đến nhà… vì tôi cô đơn.\\n빨리 안 가지고 와! \n아 네, 지금 갑니다 \n어젯밤엔 진짜 위험했어요 \n하마터면 애인한테 전화할 뻔했다니까요... \n좀 와달라고...나 외롭다고...\\nWon't you hurry up? It's coming now. \nIt was really dangerous last night... \nI almost called my lover. \nTo ask him to come... that I am lonely.","koRange":{"start":2424.81609,"end":2445.967564},"viRange":{"start":2468.920626,"end":2488.020049},"start":2424.81609,"end":2488.020049,"koSentenceMarks":[2427.416,2429.155,2437.262,2440.591,2445.908],"koShadowSegments":[{"index":0,"start":2424.81609,"end":2427.416,"text":"빨리 안 가지고 와!","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":1,"start":2427.416,"end":2429.155,"text":"아 네, 지금 갑니다","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":2,"start":2435,"end":2437.262,"text":"어젯밤엔 진짜 위험했어요","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":3,"start":2437.262,"end":2440.591,"text":"하마터면 애인한테 전화할 뻔했다니까요...","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":4,"start":2440.591,"end":2445.908,"text":"좀 와달라고...나 외롭다고...","speed":1,"cueUid":"merged-mrpxd363-94"}],"hasShadow":true,"segments":[{"index":0,"start":2424.81609,"end":2427.416,"text":"빨리 안 가지고 와!","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":1,"start":2427.416,"end":2429.155,"text":"아 네, 지금 갑니다","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":2,"start":2435,"end":2437.262,"text":"어젯밤엔 진짜 위험했어요","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":3,"start":2437.262,"end":2440.591,"text":"하마터면 애인한테 전화할 뻔했다니까요...","speed":1,"cueUid":"merged-mrpxd363-94"},{"index":4,"start":2440.591,"end":2445.908,"text":"좀 와달라고...나 외롭다고...","speed":1,"cueUid":"merged-mrpxd363-94"}]},{"id":143,"cueNo":144,"displayNo":144,"sourceUid":"merged-mt4iowi3-9","uid":"merged-mt4iowi3-9","originalCueNo":144,"vi":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]\n[Nhạc nền cổ điển kết thúc]","ko":"[테마 음악 끝] [클래식 배경 음악 시작]\n[클래식 배경 음악 끝]","en":"[Theme music ends] [Classic background music starts]\n[Classic background music ends]","text":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]\n[Nhạc nền cổ điển kết thúc]\\n[테마 음악 끝] [클래식 배경 음악 시작]\n[클래식 배경 음악 끝]\\n[Theme music ends] [Classic background music starts]\n[Classic background music ends]","koRange":null,"viRange":null,"start":1.2159999999999769,"end":1.21 her right away,\ntelling her to get out.\nHow come next day she is at the till?","text":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.\\n(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...\\nIt is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","koRange":{"start":2395.908194,"end":2408.37535},"viRange":{"start":2438.445204,"end":2452.464267},"start":2395.908194,"end":2452.464267,"koSentenceMarks":[2400.048,2401.546,2402.814,2405.084,2406.114,2408.314],"koShadowSegments":[{"index":0,"start":2395.908194,"end":2400.048,"text":"(조현희) 아니... 이상하잖아...","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":1,"start":2400.048,"end":2401.546,"text":"아니, 어젯밤만 해도 막","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":2,"start":2401.546,"end":2402.814,"text":"당장에라도 자를 것처럼","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":3,"start":2402.814,"end":2405.084,"text":"‘너 나가!’ 어? 어... ‘맛이 있겠냐?’","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":4,"start":2405.084,"end":2406.114,"text":"이래 놓고는","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":5,"start":2406.114,"end":2408.314,"text":"아이, 어떻게 하루 만에 카운터냐고...","speed":1,"cueUid":"merged-mrpx7cem-91"}],"hasShadow":true,"segments":[{"index":0,"start":2395.908194,"end":2400.048,"text":"(조현희) 아니... 이상하잖아...","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":1,"start":2400.048,"end":2401.546,"text":"아니, 어젯밤만 해도 막","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":2,"start":2401.546,"end":2402.814,"text":"당장에라도 자를 것처럼","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":3,"start":2402.814,"end":2405.084,"text":"‘너 나가!’ 어? 어... ‘맛이 있겠냐?’","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":4,"start":2405.084,"end":2406.114,"text":"이래 놓고는","speed":1,"cueUid":"merged-mrpx7cem-91"},{"index":5,"start":2406.114,"end":2408.314,"text":"아이, 어떻게 하루 만에 카운터냐고...","speed":1,"cueUid":"merged-mrpx7cem-91"}]},{"id":146,"cueNo":147,"displayNo":147,"sourceUid":"merged-mrpxddi4-95","uid":"merged-mrpxddi4-95","originalCueNo":147,"vi":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.","ko":"걔는 가만히 서 가지고 \n계산 띡띡하고 7천 500원이면... \n아이! 근데 네가 왜 화를 내냐고? \n새로 온 애가 버벅대니까 나만 힘들잖아... \n아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다","en":"She gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","text":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.\\n걔는 가만히 서 가지고 \n계산 띡띡하고 7천 500원이면... \n아이! 근데 네가 왜 화를 내냐고? \n새로 온 애가 버벅대니까 나만 힘들잖아... \n아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다\\nShe gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","koRange":{"start":2408.37535,"end":2424.81609},"viRange":{"start":2452.464267,"end":2468.920626},"start":2408.37535,"end":2468.920626,"koSentenceMarks":[2411.786,2413.832,2417.353,2421.291],"koShadowSegments":[{"index":0,"start":2408.37535,"end":2411.786,"text":"걔는 가만히 서 가지고","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":1,"start":2411.786,"end":2413.832,"text":"계산 띡띡하고 7천 500원이면...","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":2,"start":2413.832,"end":2417.353,"text":"아이! 근데 네가 왜 화를 내냐고?","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":3,"start":2417.353,"end":2421.291,"text":"새로 온 애가 버벅대니까 나만 힘들잖아...","speed":1,"cueUid":"merged-mrpxddi4-95"}],"hasShadow":true,"segments":[{"index":0,"start":2408.37535,"end":2411.786,"text":"걔는 가만히 서 가지고","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":1,"start":2411.786,"end":2413.832,"text":"계산 띡띡하고 7천 500원이면...","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":2,"start":2413.832,"end":2417.353,"text":"아이! 근데 네가 왜 화를 내냐고?","speed":1,"cueUid":"merged-mrpxddi4-95"},{"index":3,"start":2417.353,"end":2421.291,"text":"새로 온 애가 버벅대니까 나만 힘들잖아...","speed":1,"cueUid":"merged-mrpxddi4-95"}]},{"id":147,"cueNo":148,"displayNo":148,"sourceUid":"merged-mrpxrclp-112","uid":"merged-mrpxrclp-112","originalCueNo":148,"vi":"Là thế này. Tôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước.\nGiống mắt người, nhưng cũng giống mắt thú… Đôi mắt ấy xa dần…\nnhưng vẫn nhìn theo tôi cho đến cùng.","ko":"그게요...내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고...\n짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서...\n끝까지 날 쳐다보는데...","en":"That is... I fell into water...\nIt's completely dark.\nSomebody is looking at me in the water.\nIt looks like human eyes, or maybe an animal's...\nThose eyes are going away slowly...\nbut they keep staring at me.","text":"Là thế này. Tôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước.\nGiống mắt người, nhưng cũng giống mắt thú… Đôi mắt ấy xa dần…\nnhưng vẫn nhìn theo tôi cho đến cùng.\\n그게요...내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고...\n짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서...\n끝까지 날 쳐다보는데...\\nThat is... I fell into water...\nIt's completely dark.\nSomebody is looking at me in the water.\nIt looks like human eyes, or maybe an animal's...\nThose eyes are going away slowly...\nbut they keep staring at me.","koRange":{"start":2485.051017,"end":2518.441312},"viRange":null,"start":2485.051017,"end":2518.441312,"koSentenceMarks":[2492.888,2497.61,2503.438,2506.815,2509.838,2514.076,2518.334],"koShadowSegments":[{"index":0,"start":2485.051017,"end":2492.888,"text":"그게요...내가 물에 빠졌어요","speed":1,"cueUid":"merged-mrpxrclp-112"},{"index":1,"start":2492.888,"end":2497.61,"text":"온통 검은 물인데","speed":1,"cueUid":"merged-mrpxrclp-112"},{"index":2,"start":2497.61,"end":2503.438,"t 는...아저씨, 우리 집 갈래요?\n아, 그건 안 되겠다\n애인 집인데 딴 남자 데려가면 상도덕이 아니지...\n그 정도 예의는 있어요, 나도","en":"I... You want to come to my place? Well, I shouldn't... I shouldn't be bringing a guy to the house my lover got me. I still have some etiquette.","text":"Tôi…Chú có muốn đến nhà tôi không?\nMà cũng không được.\nNhà người yêu mà đưa đàn ông khác đến thì không phải lắm.\nTôi cũng có phép lịch sự tối thiểu mà.\\n나는...아저씨, 우리 집 갈래요?\n아, 그건 안 되겠다\n애인 집인데 딴 남자 데려가면 상도덕이 아니지...\n그 정도 예의는 있어요, 나도\\nI... You want to come to my place? Well, I shouldn't... I shouldn't be bringing a guy to the house my lover got me. I still have some etiquette.","koRange":{"start":2518.441312,"end":2546.041131},"viRange":{"start":2529.412919,"end":2564.859597},"start":2518.441312,"end":2564.859597,"koSentenceMarks":[2534.132,2537.731,2542.45,2545.632],"koShadowSegments":[{"index":0,"start":2518.441312,"end":2534.132,"text":"나는...아저씨, 우리 집 갈래요?","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":1,"start":2534.132,"end":2537.731,"text":"아, 그건 안 되겠다","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":2,"start":2537.731,"end":2542.45,"text":"애인 집인데 딴 남자 데려가면 상도덕이 아니지...","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":3,"start":2542.45,"end":2545.632,"text":"그 정도 예의는 있어요, 나도","speed":1,"cueUid":"merged-mrpxuf8d-115"}],"hasShadow":true,"segments":[{"index":0,"start":2518.441312,"end":2534.132,"text":"나는...아저씨, 우리 집 갈래요?","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":1,"start":2534.132,"end":2537.731,"text":"아, 그건 안 되겠다","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":2,"start":2537.731,"end":2542.45,"text":"애인 집인데 딴 남자 데려가면 상도덕이 아니지...","speed":1,"cueUid":"merged-mrpxuf8d-115"},{"index":3,"start":2542.45,"end":2545.632,"text":"그 정도 예의는 있어요, 나도","speed":1,"cueUid":"merged-mrpxuf8d-115"}]},{"id":150,"cueNo":151,"displayNo":151,"sourceUid":"merged-mrpxj2yb-109","uid":"merged-mrpxj2yb-109","originalCueNo":151,"vi":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.","ko":"전화하면 안 되는 건가? \n바보 당연히 안 되죠. 남녀관계라는 건요... \n시소 같은 거예요. 내가 올라가면 상대방은 내려가게 돼 있어요","en":"Can you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","text":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.\\n전화하면 안 되는 건가? \n바보 당연히 안 되죠. 남녀관계라는 건요... \n시소 같은 거예요. 내가 올라가면 상대방은 내려가게 돼 있어요\\nCan you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","koRange":{"start":2445.967564,"end":2463.074866},"viRange":{"start":2488.020049,"end":2505.017636},"start":2445.967564,"end":2505.017636,"koSentenceMarks":[2448.068,2455.161,2462.762],"koShadowSegments":[{"index":0,"start":2445.968,"end":2448.068,"text":"전화하면 안 되는 건가?","speed":1,"cueUid":"merged-mrpxj2yb-109"},{"index":1,"start":2448.068,"end":2455.161,"text":"바보 당연히 안 되죠. 남녀관계라는 건요...","speed":1,"cueUid":"merged-mrpxj2yb-109"},{"index":2,"start":2455.161,"end":2462.762,"text":"시소 같은 거예요. 내가 올라가면 상대방은 내려가게 돼 있어요","speed":1,"cueUid":"merged-mrpxj2yb-109"}],"hasShadow":true,"segments":[{"index":0,"start":2445.968,"end":2448.068,"text":"전화하면 안 되는 건가?","speed":1,"cueUid":"merged-mrpxj2yb-109"},{"index":1,"start":2448.068,"end":2455.161,"text":"바보 당연히 안 되죠. 남녀관계라는 건요...","speed":1,"cueUid":"merged-mrpxj2yb-109"},{"index":2,"start":2455.161,"end":2462.762,"text":"시소 같은 거예요. 내가 올라가면 상대방은 내려가게 돼 있어요","speed":1,"cueUid":"merged-mrpxj2yb-109"}]},{"id":151,"cueNo":152,"displayNo":152,"sourceUid":"merged-mrpxwsrx-117","uid":"merged-mrpxwsrx-117","originalCueNo":152,"vi":"Để tôi đi vệ sinh.","ko":"나 잠깐 화장실 좀...","en":"I need to go to the toilet.","text":"Để tôi đi vệ sinh.\\n나 잠깐 화장실 좀...\\nI need to go to the toilet.","koRange":{"start":2546.041131,"end":2547.852287},"viRange":{"start":2564.859597,"end":2590.427621},"start":2546.041131,"end":2590. 5e1-147"}]},{"id":164,"cueNo":165,"displayNo":165,"sourceUid":"merged-mrpyt6r8-144","uid":"merged-mrpyt6r8-144","originalCueNo":165,"vi":"Con ma kia đi mất rồi đúng không?\nDạo này hết thấy rồi nhỉ? Chắc không thấy đâu.\nVì nó đã đi theo chị mà. Dạo này nó rất bận vì xuất hiện trong giấc mơ của chị. Này, coi chừng.","ko":"저기 귀신 없어졌지? 어? 요즘 안 보이지?\n안 보일 거야. 나 따라왔으니까\n요즘에 내 꿈에 나오느라 겁나 바쁘거든\n어머... 야 야! 어...아! - 아! 아...아!","en":"That ghost is gone, right? Not here any more. Probably not. It followed me.\nIt's in my dreams lately.\nWatch out.","text":"Con ma kia đi mất rồi đúng không?\nDạo này hết thấy rồi nhỉ? Chắc không thấy đâu.\nVì nó đã đi theo chị mà. Dạo này nó rất bận vì xuất hiện trong giấc mơ của chị. Này, coi chừng.\\n저기 귀신 없어졌지? 어? 요즘 안 보이지?\n안 보일 거야. 나 따라왔으니까\n요즘에 내 꿈에 나오느라 겁나 바쁘거든\n어머... 야 야! 어...아! - 아! 아...아!\\nThat ghost is gone, right? Not here any more. Probably not. It followed me.\nIt's in my dreams lately.\nWatch out.","koRange":{"start":2789.49012,"end":2816.26855},"viRange":{"start":2831.864442,"end":2857.806936},"start":2789.49012,"end":2857.806936,"koSentenceMarks":[2796.299,2800.65,2805.449,2816.269],"koShadowSegments":[{"index":0,"start":2789.49012,"end":2796.299,"text":"저기 귀신 없어졌지? 어? 요즘 안 보이지?","speed":1,"cueUid":"merged-mrpyt6r8-144"},{"index":1,"start":2796.299,"end":2800.65,"text":"안 보일 거야. 나 따라왔으니까","speed":1,"cueUid":"merged-mrpyt6r8-144"},{"index":2,"start":2800.65,"end":2805.449,"text":"요즘에 내 꿈에 나오느라 겁나 바쁘거든","speed":1,"cueUid":"merged-mrpyt6r8-144"},{"index":3,"start":2805.449,"end":2816.26855,"text":"어머... 야 야! 어...아! - 아! 아...아!","speed":1,"cueUid":"merged-mrpyt6r8-144"}],"hasShadow":true,"segments":[{"index":0,"start":2789.49012,"end":2796.299,"text":"저기 귀신 없어졌지? 어? 요즘 안 보이지?","speed":1,"cueUid":"merged-mrpyt6r8-144"},{"index":1,"start":2796.299,"end":2800.65,"text":"안 보일 거야. 나 따라왔으니까","speed":1,"cueUid":"merged-mrpyt6r8-144"},{"index":2,"start":2800.65,"end":2805.449,"text":"요즘에 내 꿈에 나오느라 겁나 바쁘거든","speed":1,"cueUid":"merged-mrpyt d-mrpz6e0j-153","uid":"merged-mrpz6e0j-153","originalCueNo":168,"vi":"Ngốc quá đi mất. Gì đây?\nSao lại say ở nhà người khác?","ko":"아이고, 바보야 진짜...뭐야...\n남의 집에서 술주정은...","en":"How foolish... What now... falling asleep here?","text":"Ngốc quá đi mất. Gì đây?\nSao lại say ở nhà người khác?\\n아이고, 바보야 진짜...뭐야...\n남의 집에서 술주정은...\\nHow foolish... What now... falling asleep here?","koRange":null,"viRange":{"start":2892.127468,"end":2906.416462},"start":2892.127468,"end":2906.416462,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":168,"cueNo":169,"displayNo":169,"sourceUid":"merged-mrpz7xh3-157","uid":"merged-mrpz7xh3-157","originalCueNo":169,"vi":"Em biết mọi người bàn tán không?\nHãy nói chuyện đó không đúng đi.\nTôi không thể nói.\nCô ra quầy thanh toán đứng cho đến khi khỏi tay đi.","ko":"(박재완) 사람들이 수군대는 거 알아요? \n그런 거 아니라고 말해줘요 \n(윤진명) 말할 수 없어... \n손톱 다 나을 때까지 카운터에서 일해","en":"Do you know people are talking about you?\nTell me that's not true. I can't.\nUntil you recover, stay at the desk.","text":"Em biết mọi người bàn tán không?\nHãy nói chuyện đó không đúng đi.\nTôi không thể nói.\nCô ra quầy thanh toán đứng cho đến khi khỏi tay đi.\\n(박재완) 사람들이 수군대는 거 알아요? \n그런 거 아니라고 말해줘요 \n(윤진명) 말할 수 없어... \n손톱 다 나을 때까지 카운터에서 일해\\nDo you know people are talking about you?\nTell me that's not true. I can't.\nUntil you recover, stay at the desk.","koRange":{"start":2909.687831,"end":2931.508784},"viRange":{"start":2951.888772,"end":2970.606958},"start":2909.687831,"end":2970.606958,"koSentenceMarks":[2912.14,2914.686,2916.587,2926.508],"koShadowSegments":[{"index":0,"start":2909.688,"end":2912.14,"text":"(박재완) 사람들이 수군대는 거 알아요?","speed":1,"cueUid":"merged-mrpz7xh3-157"},{"index":1,"start":2912.14,"end":2914.686,"text":"그런 거 아니라고 말해줘요","speed":1,"cueUid":"merged-mrpz7xh3-157"},{"index":2,"start":2914.686,"end":2916.587,"text":"(윤진명) 말할 수 없어...","speed":1,"cueUid":"merged-mrpz7xh3-157"},{"index":3,"start":2916.587,"end":2926.508,"text":"손톱 다 나을 때까지 카운터에  말 했어? 기억 안 나?\n어쨌든 그 귀신은 계속 여기 있었어\n강 언니 따라간 거 아니야\n그래? 그럼, 그건 뭐지?","en":"Yesterday, you said it followed you.\nDid I say that? Don't you remember?\nAnyway, the ghost has been here, it didn't follow you.\nOkay. Then what is that?","text":"Hôm qua chị bảo nó đi theo chị mà.\nChị đã nói vậy sao?\nChị không nhớ hả?\nNói tóm lại nó vẫn luôn ở đây, không có đi theo chị.\nĐược rồi. Vậy thứ đó là gì chứ?\\n그 귀신이 강 언니 따라온 것 같다고 \n내가 그런 말 했어? 기억 안 나?\n어쨌든 그 귀신은 계속 여기 있었어\n강 언니 따라간 거 아니야\n그래? 그럼, 그건 뭐지?\\nYesterday, you said it followed you.\nDid I say that? Don't you remember?\nAnyway, the ghost has been here, it didn't follow you.\nOkay. Then what is that?","koRange":{"start":3058.178486,"end":3077.167337},"viRange":{"start":3102.921244,"end":3119.924433},"start":3058.178486,"end":3119.924433,"koSentenceMarks":[3060.379,3064.539,3068.982,3070.564,3076.9],"koShadowSegments":[{"index":0,"start":3058.178486,"end":3060.379,"text":"그 귀신이 강 언니 따라온 것 같다고","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":1,"start":3060.379,"end":3064.539,"text":"내가 그런 말 했어? 기억 안 나?","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":2,"start":3064.539,"end":3068.982,"text":"어쨌든 그 귀신은 계속 여기 있었어","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":3,"start":3068.982,"end":3070.564,"text":"강 언니 따라간 거 아니야","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":4,"start":3070.564,"end":3076.9,"text":"그래? 그럼, 그건 뭐지?","speed":1,"cueUid":"merged-mrpzuw9m-175"}],"hasShadow":true,"segments":[{"index":0,"start":3058.178486,"end":3060.379,"text":"그 귀신이 강 언니 따라온 것 같다고","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":1,"start":3060.379,"end":3064.539,"text":"내가 그런 말 했어? 기억 안 나?","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":2,"start":3064.539,"end":3068.982,"text":"어쨌든 그 귀신은 계속 여기 있었어","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":3,"start":3068.982,"end":3070.564,"text":"강 언니 따라간 거 아니야","speed":1,"cueUid":"merged-mrpzuw9m-175"},{"index":4,"start":3070.564,"end":3076.9,"text":"그래? 그럼, 그건 뭐지?","speed": :{"start":3176.739199,"end":3199.266582},"start":3135.53852,"end":3199.266582,"koSentenceMarks":[3149.769,3156.66],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":179,"cueNo":180,"displayNo":180,"sourceUid":"merged-mrqh3uqw-2","uid":"merged-mrqh3uqw-2","originalCueNo":180,"vi":"Em thấy không ưng lắm. Ở đâu?\nChỉ là đơn giản cảm thấy thế thôi. Em cũng thế.\nCòn tiền bối Yoon? Chị thì cũng không phải ưng lắm.\nĐúng không? Em cũng không ưng gì cả.\nQuá bình thường.","ko":"난 쫌 별로인데. 어디가?\n그냥 뭐... 전체적으로다가 느낌적인 느낌이...저도 좀 그래요. 윤 선배는요?\n나도 뭐, 딱히 마음에 드는 건 아닌데...\n그치 나도 별로야...너무 평범해. 그치이? 너어어무 평범해","en":"I'm not so sure. About what?\nMy feeling's all over the place... Me too. You?\nI am not so sure either.\nRight? I didn't like her much.\nToo ordinary.","text":"Em thấy không ưng lắm. Ở đâu?\nChỉ là đơn giản cảm thấy thế thôi. Em cũng thế.\nCòn tiền bối Yoon? Chị thì cũng không phải ưng lắm.\nĐúng không? Em cũng không ưng gì cả.\nQuá bình thường.\\n난 쫌 별로인데. 어디가?\n그냥 뭐... 전체적으로다가 느낌적인 느낌이...저도 좀 그래요. 윤 선배는요?\n나도 뭐, 딱히 마음에 드는 건 아닌데...\n그치 나도 별로야...너무 평범해. 그치이? 너어어무 평범해\\nI'm not so sure. About what?\nMy feeling's all over the place... Me too. You?\nI am not so sure either.\nRight? I didn't like her much.\nToo ordinary.","koRange":{"start":3160.358095,"end":3187.402721},"viRange":{"start":3199.266582,"end":3227.393196},"start":3160.358095,"end":3227.393196,"koSentenceMarks":[3163.385,3170.457,3173.649,3187.403],"koShadowSegments":[{"index":0,"start":3160.358095,"end":3163.385,"text":"난 쫌 별로인데. 어디가?","speed":1,"cueUid":"merged-mrqh3uqw-2"},{"index":1,"start":3163.385,"end":3170.457,"text":"그냥 뭐... 전체적으로다가 느낌적인 느낌이...저도 좀 그래요. 윤 선배는요?","speed":1,"cueUid":"merged-mrqh3uqw-2"},{"index":2,"start":3170.457,"end":3173.649,"text":"나도 뭐, 딱히 마음에 드는 건 아닌데...","speed":1,"cueUid":"merged-mrqh3uqw-2"},{"index":3,"start":3179,"end":3187.402721,"text":"그치 나도 별로야...너무 평범해. 그치이? 너어어무 평범해","speed":1,"cueUid":"merged-mrqh3uqw-2"}],"hasShadow":true,"segments":[{"index":0,"start":3160.3 ars...\nI thought he actually died this time.\nI've been hoping for that.","koRange":{"start":3372,"end":3412.582847},"viRange":{"start":3414,"end":3457.780337},"start":3372,"end":3457.780337,"koSentenceMarks":[3392.062,3404.598,3411.509],"koShadowSegments":[{"index":0,"start":3372,"end":3392.062,"text":"무슨 일 있었어요? 내 동생이 안 죽었어요","speed":1,"cueUid":"merged-mrqho9qf-19"},{"index":1,"start":3392.062,"end":3404.598,"text":"년 동안이나 안 죽고...이번에는 진짜 죽을 줄 알았는데...","speed":1,"cueUid":"merged-mrqho9qf-19"},{"index":2,"start":3404.598,"end":3411.509,"text":"그렇게 죽기를 바랬는데...","speed":1,"cueUid":"merged-mrqho9qf-19"}],"hasShadow":true,"segments":[{"index":0,"start":3372,"end":3392.062,"text":"무슨 일 있었어요? 내 동생이 안 죽었어요","speed":1,"cueUid":"merged-mrqho9qf-19"},{"index":1,"start":3392.062,"end":3404.598,"text":"년 동안이나 안 죽고...이번에는 진짜 죽을 줄 알았는데...","speed":1,"cueUid":"merged-mrqho9qf-19"},{"index":2,"start":3404.598,"end":3411.509,"text":"그렇게 죽기를 바랬는데...","speed":1,"cueUid":"merged-mrqho9qf-19"}]},{"id":188,"cueNo":189,"displayNo":189,"sourceUid":"merged-mrqhmfmc-15","uid":"merged-mrqhmfmc-15","originalCueNo":189,"vi":"[Nhạc nền kết thúc]\n[Nhân viên nói chuyện]\n[Bật tạp dề]","ko":"[배경 음악 끝] [종업원들 얘기한다] [앞치마 턴다]","en":"[Background music ends]\n[Employees talking]\n[Turns on apron]","text":"[Nhạc nền kết thúc]\n[Nhân viên nói chuyện]\n[Bật tạp dề]\\n[배경 음악 끝] [종업원들 얘기한다] [앞치마 턴다]\\n[Background music ends]\n[Employees talking]\n[Turns on apron]","koRange":null,"viRange":null,"start":1.6539999999999286,"end":1.6549999999999285,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":189,"cueNo":190,"displayNo":190,"sourceUid":"merged-mrqhucuw-21","uid":"merged-mrqhucuw-21","originalCueNo":190,"vi":"Anh thích tôi à?","ko":"나 좋아해요?","en":"Do you like me?","text":"Anh thích tôi à?\\n나 좋아해요?\\nDo you like me?","koRange":{"start":3428,"end":3430.101979},"viRange":{"start":3470,"end":3474.614966},"start":3428,"end":3474.614966,"koSentenceMarks":[3430.102],"koShadowSegmen function playRange(kind,start,end,label,done,rate){const a=audios[kind];if(!a.src)return alert('Chưa có '+kind.toUpperCase()+' audio. Hãy chọn file hoặc kiểm tra folder audio.');try{a.playbackRate=rate||1}catch(e){}token++;const tk=token;clearTimeout(timer);stopAt[kind]=Number(end);try{audios[kind==='vi'?'ko':'vi'].pause()}catch(e){}a.currentTime=Number(start);setStatus(label+' · '+fmt(start)+' → '+fmt(end));a.play().catch(function(e){alert('Không phát được audio: '+(e&&e.message?e.message:e))});const check=function(){if(tk!==token)return;if(a.currentTime>=Number(end)-.025){a.pause();stopAt[kind]=null;if(done)done();return}timer=setTimeout(check,45)};check()}
function playCue(kind){const it=items[cur];if(!it)return;const rg=rangeFor(it,kind);if(!rangeOk(rg))return alert('Cue này chưa có '+kind.toUpperCase()+' range.');playRange(kind,Number(rg.start),Number(rg.end),(kind==='vi'?'VI Dub':'KO Live')+' cue #'+(cur+1))}
function playSegment(i,mode){const it=items[cur]||{}, seg=(it.segments||[])[i];if(!seg)return alert('Cue này chưa có câu shadow.');activeSeg=i;render();const total=mode==='once'?1:Math.max(1,Number($('repeat').value)||3);let n=0;const rate=segSpeed(seg), dur=Math.max(.05,Number(seg.end)-Number(seg.start)), gap=mode==='shadow'?Math.max(1,Math.min(5,dur/rate+.5)):.35;const run=function(){if(n>=total){setStatus('Xong câu '+(i+1));return}n++;playRange('ko',seg.start,seg.end,(mode==='shadow'?'Shadow':'Repeat')+' câu '+(i+1)+' · '+rate+'x · lượt '+n+'/'+total,function(){timer=setTimeout(run,gap*1000)},rate)};run()}
function playActiveSeg(mode){playSegment(activeSeg,mode||'repeat')}
function prevCue(){cur=Math.max(0,cur-1);activeSeg=0;render();scrollToActive()}function nextCue(){cur=Math.min(items.length-1,cur+1);activeSeg=0;render();scrollToActive()}
function hideHeaderNow(){const t=document.querySelector('.top');if(t)t.classList.add('hide')}
function showHeaderNow(){const t=document.querySelector('.top');if(t)t.classList.remove('hide')}
function initAutoHeader(){
  const t=document.querySelector('.top');if(!t)return;
  let last=window.scrollY||0,lock=0;
  window.addEventListener('scroll',function(){
    const y=window.scrollY||0,now=Date.now();
    if(y<24){t.classList.remove('hide');last=y;return}
    if(now-lock<180){last=y;return}
    if(y>last+10)t.classList.add('hide');
    else if(y<last-18)t.classList.remove('hide');
    last=y;
  },{passive:true});
  document.addEventListener('focusin',function(e){if(e.target&&/input|textarea|select/i.test(e.target.tagName)){t.classList.add('hide');lock=Date.now();}});
}
function toggleFloatPanel(e){if(e)e.stopPropagation();const el=$('floatCtl');if(!el)return;if(el.dataset.moved==='1'){el.dataset.moved='0';return}el.classList.toggle('open')}
function initFloatDrag(){const el=$('floatCtl'),h=$('floatMain');if(!el||!h)return;let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;h.addEventListener('pointerdown',function(e){if(window.innerWidth>760)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{h.setPointerCapture(e.pointerId)}catch(_){}});h.addEventListener('pointermove',function(e){if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const maxX=window.innerWidth-el.offsetWidth-8,maxY=window.innerHeight-el.offsetHeight-8;el.style.left=Math.max(8,Math.min(maxX,ox+dx))+'px';el.style.top=Math.max(8,Math.min(maxY,oy+dy))+'px';el.style.right='auto';el.style.bottom='auto'});function end(){if(!drag)return;drag=false;if(moved){el.dataset.moved='1';try{localStorage.setItem('shadowFloatPos',JSON.stringify({left:el.style.left,top:el.style.top}))}catch(_){}}}h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);try{const p=JSON.parse(localStorage.getItem('shadowFloatPos')||'null');if(p&&p.left&&p.top&&window.innerWidth<=760){el.style.left=p.left;el.style.top=p.top;el.style.right='auto';el.style.bottom='auto'}}catch(_){}}
function toggleSettings(){const s=$('settings');s.classList.toggle('hidden')}
audios.vi.ontimeupdate=function(){if(stopAt.vi!=null&&audios.vi.currentTime>=stopAt.vi){audios.vi.pause();stopAt.vi=null}}
audios.ko.ontimeupdate=function(){if(stopAt.ko!=null&&audios.ko.currentTime>=stopAt.ko){audios.ko.pause();stopAt.ko=null}}
$('q').oninput=renderList;$('viVol').oninput=function(){setVol('vi')};$('koVol').oninput=function(){setVol('ko')};$('viFile').onchange=function(e){const f=e.target.files[0];if(f){audios.vi.src=URL.createObjectURL(f);$('viAudioStatus').textContent='Đã nạp VI từ máy: '+f.name}};$('koFile').onchange=function(e){const f=e.target.files[0];if(f){audios.ko.src=URL.createObjectURL(f);$('koAudioStatus').textContent='Đã nạp KO từ máy: '+f.name}};
document.addEventListener('keydown',function(e){if(/input|textarea|select/i.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(audios.ko.paused)playCue('ko');else pauseAll()}if(e.key==='ArrowRight')nextCue();if(e.key==='ArrowLeft')prevCue();if(e.key==='v'||e.key==='V')playCue('vi');if(e.key==='k'||e.key==='K')playCue('ko')});
initFloatDrag();initAutoHeader();setVol('vi');setVol('ko');tryAutoAudio('vi');tryAutoAudio('ko');render();
</script>
