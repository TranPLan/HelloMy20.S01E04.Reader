illing time.\nGive me yellow.","start":487.812527,"end":493.113939,"viStart":445.714785,"viEnd":450.573561,"koStart":487.812527,"koEnd":493.113939,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":445.714785,"end":450.573561},"koRange":{"start":487.812527,"end":493.113939}},{"id":32,"sourceUid":"merged-mrowzteq-37","sourceNo":32,"originalSourceNo":63,"displayNo":32,"vi":"Mà sao chị ấy làm ca đêm ở cửa hàng tiện lợi?\nGiờ đấy nguy hiểm mà.","ko":"근데요, 편의점 알바는 왜 새벽에 해요?\n새벽은 위험하잖아요 사람도 없고...","en":"Why does she work overnight at a convenience store?\nIsn't it dangerous?","start":493.113939,"end":497.597817,"viStart":450.573561,"viEnd":455.255284,"koStart":493.113939,"koEnd":497.597817,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":450.573561,"end":455.255284},"koRange":{"start":493.113939,"end":497.597817}},{"id":33,"sourceUid":"merged-mrox1p2i-41","sourceNo":33,"originalSourceNo":65,"displayNo":33,"vi":"Còn không có khách. À, hay lương cao hơn ạ? Tiền lương vẫn vậy.\nChị ấy muốn học nên mới làm, vì tầm ấy không có khách.","ko":"아... 시급을 더 줘요? 시급은 똑같아\n공부하려고 새벽에 하는 거야 그 시간에 손님이 없으니까","en":"Not many customers. Does it pay you more?\nIt's the same rate. She is trying to study there because there aren't many customers.","start":497.597817,"end":506.749382,"viStart":455.255284,"viEnd":465.567846,"koStart":497.597817,"koEnd":506.749382,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":455.255284,"end":465.567846},"koRange":{"start":497.597817,"end":506.749382}},{"id":34,"sourceUid":"merged-mroyiz8v-42","sourceNo":34,"originalSourceNo":68,"displayNo":34,"vi":"Một tháng chị ấy kiếm được bao nhiêu nhỉ?","ko":"윤 선배 한 달 수입이 얼마나 될까?","en":"How much would she make a month?","start":506.749382,"end":510.989926,"viStart":465.567846,"viEnd":468.647392,"koStart":506.749382,"koEnd":510.989926,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":465.567846,"end":468.647392},"koRange":{"start":506.749382,"end":510.989926}},{"id":35,"sourceUid":"merged-mroyjox4-43","s , 아무것도...\n아! 아... 어떡해... 괜찮아요? 어, 괜찮아...","en":"Hi. You are back.\nWhat is it? Nothing.\nAre you okay? I'm fine.","start":754.863997,"end":808.122042,"viStart":712.095455,"viEnd":768.856644,"koStart":754.863997,"koEnd":808.122042,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":712.095455,"end":768.856644},"koRange":{"start":754.863997,"end":808.122042}},{"id":55,"sourceUid":"merged-mrp0m4cu-68","sourceNo":55,"originalSourceNo":159,"displayNo":55,"vi":"Không biết…\nbạn có thể cho bọn tôi xem thẻ sinh viên hay chứng minh thư không?","ko":"그...\n학생증이나 재학증명서나...\n뭐 신분확인 할 수 있는 것 좀 볼 수 있을까요?","en":"Well...\ndo you have any ID we can see, like a student ID?","start":816,"end":823.780527,"viStart":774,"viEnd":779.865006,"koStart":816,"koEnd":823.780527,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":774,"end":779.865006},"koRange":{"start":816,"end":823.780527}},{"id":56,"sourceUid":"merged-mrp0o703-69","sourceNo":56,"originalSourceNo":122,"displayNo":56,"vi":"Vì trước đây có người nói dối là sinh viên.\nRõ ràng cũng tốt mà.\nCảm ơn nhé.","ko":"아...\n전에 대학생이라고 거짓말한 사람이 있어서...\n정확한 게 좋죠\n감사합니다","en":"We had someone lying about being a student.\nIt's good to be clear.\nThank you.","start":823.780527,"end":833.969343,"viStart":779.865006,"viEnd":791.052155,"koStart":823.780527,"koEnd":833.969343,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":779.865006,"end":791.052155},"koRange":{"start":823.780527,"end":833.969343}},{"id":57,"sourceUid":"merged-mrp0phrt-70","sourceNo":57,"originalSourceNo":123,"displayNo":57,"vi":"Nghe nói giờ bạn cũng đang ở nhà chung,\nkhông biết tại sao bạn lại dọn ra?","ko":"지금도 셰어하우스를 하고 계시다고 들었는데...\n거기서는 왜 나오시려는 거예요?","en":"You said you are living in a shared house now,\nwhy are you leaving that place?","start":841,"end":846.3,"viStart":798,"viEnd":804.142404,"koStart":841,"koEnd":846.3,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":798,"end":804.142404},"koRange":{"start":841,"end":846.3}},{"id":58,"sourceUid":"merged-mrp0tfmc-74","sourceNo":58,"originalSourceNo":128,"displayNo":58,"vi":"Thì cũng… Mọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà.\nnhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.","ko":"뭐 그냥...사람들은 다 좋은데...청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요","en":"It's just...they are all good people,\njust not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","start":846.3,"end":859.214116,"viStart":804.142404,"viEnd":818.338229,"koStart":846.3,"koEnd":859.214116,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":804.142404,"end":818.338229},"koRange":{"start":846.3,"end":859.214116}},{"id":59,"sourceUid":"merged-mt3xxvxa-2","sourceNo":59,"originalSourceNo":177,"displayNo":59,"vi":"Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà.\nChính xác. Chỗ tôi sống trước đây,\nhọ chỉ dọn vệ sinh đúng một lần một tuần thôi.","ko":"맞아요 화장실, 거실... 이런 데는...\n깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요. 전에 살던 데는요...\n화장실 청소를 일주일에 한 번밖에 안 해요. 네?","en":"It's really irritating. -You are right.\nPlaces like bathroom and living room\nshould be looked after properly because these are common spaces.\nThat's what I mean.\nIn my previous shared house,\nthey clean the bathroom only once a week.","start":859.214116,"end":872,"viStart":818.338229,"viEnd":828.595644,"koStart":859.214116,"koEnd":872,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":818.338229,"end":828.595644},"koRange":{"start":859.214116,"end":872}},{"id":60,"sourceUid":"merged-mrp0wqos-79","sourceNo":60,"originalSourceNo":180,"displayNo":60,"vi":"Đã thế lại còn làm có 30 phút. Đấy là dội nước chứ vệ sinh gì đâu.","ko":"그것도 삼십 분밖에 안 해요\n그게 청소하는 거예요? 물 한 번 찍 뿌리고 마는 거지","en":"For 30 minutes, is it cleaning? It's just splashing water around.","start":872,"end":876.97449,"viStart":828.595644,"viEnd":833.993271,"koStart":872,"koEnd":876.97449,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":828.595644,"end":833.993271},"koRange":{"start":872,"end":876.97449}},{"id":61,"sourceUid":"merged-mrp0y3jh-81","sourceNo":61,"originalSourceNo":137,"displayNo":61,"vi":"Cũng phải, trông chờ gì ở những người giặt đồ lót chung với đồ thường chứ.","ko":"하긴...겉옷이랑 속옷이랑 같이 빠는 사람들한테 제가 뭘 바라겠어요...","en":"Of course, what can I expect from people who wash their outers and undies together.","start":876.97449,"end":881.435624,"viStart":833.993271,"viEnd":840.204609,"koStart":876.97449,"koEnd":881.435624,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":833.993271,"end":840.204609},"koRange":{"start":876.97449,"end":881.435624}},{"id":62,"sourceUid":"merged-mrp0z94d-83","sourceNo":62,"originalSourceNo":190,"displayNo":62,"vi":"[Tiếng giày] [Tiếng cửa cọt kẹt] [Tiếng đóng cửa] Mmm, mmm, mmm! Ừm... ừm!\n[Tiếng cửa kêu cót két] [Tiếng đóng cửa]","ko":"[신발 소리] [삑삑삑 문소리] [문 닫는 소리] 음, 음, 음! 음... 음!\n[삑삑삑 문소리] [문 닫는 소리]","en":"[Sound of shoes] [Sound of door squeaking] [Sound of door closing] Mmm, mmm, mmm! Um... um! [Sound of door squeaking] [Sound of door closing]","start":0.43600000000000033,"end":0.43700000000000033,"viStart":0.43600000000000033,"viEnd":0.43700000000000033,"koStart":0.43600000000000033,"koEnd":0.43700000000000033,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":63,"sourceUid":"merged-mrp1028c-84","sourceNo":63,"originalSourceNo":195,"displayNo":63,"vi":"Bật nó lên đi! [Hát] ♪ Quyến rũ, anh là người đàn ông của em ♪ ♪ Đẹp trai, anh là người đàn ông của em ♪ ♪ Ngay cả khi ngày tận thế này đến ♪\n♪ Anh muốn chìm vào ảo tưởng mãi mãi ♪ [Nhạc chủ đề bắt đầu] ♪ Anh chỉ yêu em cho đến khi anh chết ♪ ♪ Tại sao em không thể để anh đi ♪ ♪ Cho đến khi anh chết ♪ ♪ Anh yêu em ♪","ko":"켜져라 얍! [노래 부른다] ♪ 섹시한 당신은 나의 남자 ♪ ♪ 잘 생긴 당신은 나의 남자 ♪ ♪ 이 세상 마지막이 온대도 ♪\n♪ 영원히 환상에 젖을래 ♪ [테마 음악 시작] ♪ 죽도록 너만을 사랑하는데 ♪ ♪ 왜 날 놓지 못하니 ♪ ♪ 나는 죽을 때까지 ♪ ♪ 사랑해 ♪","en":"Turn it on ,"originalSourceNo":323,"displayNo":97,"vi":"Tôi tới năm chỗ rồi đấy. Sao cơ? Đưa cho tôi. \nKhông. Không, không sao. Em đi đi. Vứt ở đây là được hả? \nVâng. Anh đến đây tìm tôi hả? Tại sao? À thì… Chờ tôi một lát.","ko":"여기가 벌써 다섯 번째예요! 네? 아, 이거 줘요 \n아니요, 아니... 아니요, 줘요 가세요 이거 여기 버리면 되죠 네... \n나 찾아왔어요? 왜요? \n어... 아! 잠깐만요","en":"This was my fifth try. What?\nGive it here. No. -It's okay.\nYou go first. Can I throw this here?\nDid you come here to find me? Why? Well...give me a minute.","start":1350,"end":1377.980045,"viStart":1376.610414,"viEnd":1403.130505,"koStart":1350,"koEnd":1377.980045,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1376.610414,"end":1403.130505},"koRange":{"start":1350,"end":1377.980045}},{"id":99,"sourceUid":"merged-mrp4pp4t-173","sourceNo":99,"originalSourceNo":328,"displayNo":99,"vi":"Đêm rồi nên chắc cà phê không được.\nCủa anh 2.300 won. Vâng.\nMột trong hai, em uống cái nào?","ko":"아... 밤에 커피는 좀 그러니까 ,300원입니다 \n넵 둘 중에... 뭐 마실래요?","en":"It's too late to drink coffee.\n2,300 won please. \nOkay. Which one do you want?","start":1377.980045,"end":1406.642177,"viStart":1403.130505,"viEnd":1431.911639,"koStart":1377.980045,"koEnd":1406.642177,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1403.130505,"end":1431.911639},"koRange":{"start":1377.980045,"end":1406.642177}},{"id":100,"sourceUid":"merged-mrp4rg3p-177","sourceNo":100,"originalSourceNo":335,"displayNo":100,"vi":"Nay em sẽ đi chợ. Có ai muốn đi không ạ? Em đi một mình đi… Mua hộ chị băng vệ sinh được không? Có ai cần thêm gì không ạ? Cái tủ lạnh trống trơn đấy…","ko":"(정예은) 오늘 장 보러 갈 건데\n같이 가실 분 있어요?\n(송지원) 너 혼자 가...\n(정예은) 나는 생리대 소형 사다 줄래?\n(정예은) 예은 언니 말고 다른 거 필요한 분 있어요?\n(강이나) 냉장고 텅 비었더라...","en":"I'm going to the market today. Anybody wants to join? Go by yourself... Can you buy me a pad? Anyone else needs something? The fridge is empty...","start":1462.937383,"end":1475.058213,"viStart":1487.817511,"viEnd":1501.417263,"koStart":1462.937383,"koEnd":1475.058213,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1487.817511,"end":1501.417263},"koRange":{"start":1462.937383,"end":1475.058213}},{"id":101,"sourceUid":"merged-mrp4u1hi-184","sourceNo":101,"originalSourceNo":339,"displayNo":101,"vi":"Chắc cậu giàu lắm hả? \nSuốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? \nTớ thật sự không phải người như thế.","ko":"(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜","en":"Do you have so much money? \nIt wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","start":1475.058213,"end":1482.96137,"viStart":1501.417263,"viEnd":1508.070382,"koStart":1475.058213,"koEnd":1482.96137,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1501.417263,"end":1508.070382},"koRange":{"start":1475.058213,"end":1482.96137}},{"id":102,"sourceUid":"merged-mrp4v4wj-186","sourceNo":102,"originalSourceNo":343,"displayNo":102,"vi":"Không phải cái khỉ gió. Thế hôm nay cậu đãi thịt đi. \nHôm nay em cứ mua đồ em cần thôi, lúc sau tính quỹ chung rồi mua.","ko":"(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴! \n(윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사","en":"Says who? Then you pay for dinner today.\nYou buy what you need for now,\nthen we can discuss the rest later.","start":1482.96137,"end":1489.700961,"viStart":1508.070382,"viEnd":1516.432468,"koStart":1482.96137,"koEnd":1489.700961,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1508.070382,"end":1516.432468},"koRange":{"start":1482.96137,"end":1489.700961}},{"id":103,"sourceUid":"merged-mrp4wkl9-190","sourceNo":103,"originalSourceNo":345,"displayNo":103,"vi":"[Bíp bíp bíp tiếng cửa] [Tiếng đóng cửa]","ko":"[삑삑삑 문소리] [문 닫는 소리]","en":"[Beep beep beep sound of door]\n[Sound of door closing]","start":1489.700961,"end":1525.379782,"viStart":1516.432468,"viEnd":1550.152063,"koStart":1489.700961,"koEnd":1525.379782,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1516.432468,"end":1550.152063},"koRange":{"start":1489.700961,"end":1525.379782}},{"id":104,"sourceUid":"merged-mrp4vzyr-188","sourceNo":104,"originalSourceNo":351,"displayNo":104,"vi":"Khi em nói em là sinh viên,\ntôi còn tưởng em ra vẻ nữa.\nNghĩ lại cũng đều do tôi tự ti\nvì chỉ tốt nghiệp cấp ba.\nTôi vẫn chưa hoàn thiện bản thân.","ko":"그때는... 진명 씨가 대학생이라고 해서 \n괜히 유세 떠는 줄 알았어요 그러고 보면... \n내가 고졸인 거에 되게... \n자격지심이 있었던 거죠 아직 완성이 덜 되었어요 내가...","en":"When you said you were a college student... I thought you were conceited. When I think about it, I was not confident about myself not going to college. I still need to grow.","start":1525.379782,"end":1542.852785,"viStart":1550.152063,"viEnd":1565.60429,"koStart":1525.379782,"koEnd":1542.852785,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1550.152063,"end":1565.60429},"koRange":{"start":1525.379782,"end":1542.852785}},{"id":105,"sourceUid":"merged-mrp4xo64-192","sourceNo":105,"originalSourceNo":359,"displayNo":105,"vi":"Em đưa tay đây. Sao không?\nEm coi nó là dây buộc thôi sao?\nCái này là nhẫn đó. Đưa tay đây nào.","ko":"손 줘 봐요 아, 왜요... 이게 지금 빵 끈으로 보여요? \n이거 절대반집니다 손 줘봐요 어서요","en":"Let me see your hand.\nWhy? Does this look like a bread tie?\nThis is absolutely a ring,\ngive me your hand.","start":1542.852785,"end":1560.541568,"viStart":1565.60429,"viEnd":1587.05082,"koStart":1542.852785,"koEnd":1560.541568,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1565.60429,"end":1587.05082},"koRange":{"start":1542.852785,"end":1560.541568}},{"id":106,"sourceUid":"merged-mrp4xuj8-193","sourceNo":106,"originalSourceNo":360,"displayNo":106,"vi":"Từ giờ em sẽ thành Gollum.","ko":"이제 진명 씨는 골룸이 될 거예요","en":"Now, Jin-Myung Yoon will become Gollum.","start":1560.541568,"end":1577.242532,"viStart":1587.05082,"viEnd":1602.062521,"koStart":1560.541568,"koEnd":1577.242532,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1587.05082,"end":1602.062521},"koRange":{"start":1560.541568,"end":1577.242532}},{"id":107,"sourceUid":"merged-mrp4y478-194","sourceNo":107,"originalSourceNo":363,"displayNo":107,"vi":"[Tiếng đóng cửa] [Tắt đèn]","ko":"[문 닫는 소리] [불 끈다]","en":"[Sound of door closing] [Turns off lights]","start":1577.242532,"end":1666.085436,"viStart":1602.062521,"viEnd":1692.271091,"koStart":1577.242532,"koEnd":1666.085436,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1602.062521,"end":1692.271091},"koRange":{"start":1577.242532,"end":1666.085436}},{"id":108,"sourceUid":"merged-mrp518jb-201","sourceNo":108,"originalSourceNo":247,"displayNo":108,"vi":"Tên bạn là… Gì cơ? Lee Soo… \nQuê bạn ở đâu? Gyung… Gyunggi… Tạm biệt. Tạm biệt ạ. \nSo với bạn ấy thì tính ra em còn tăng động.","ko":"(송지원) 이름이...네?이... 수...\n고향이 어디예요?\n경기... 평... 택...가세요...\n가세요. 으야...쟤에 비하면 넌 ADHD다","en":"Your name is...What?\nLee Soo...Lee Soo…\nWhere are you from? Gyung… Gyunggi… Gyung... Gyung-gi...\nBye. Bye.\nCompared to her, you have ADHD.","start":1666.085436,"end":1706.586814,"viStart":1692.271091,"viEnd":1731.298984,"koStart":1666.085436,"koEnd":1706.586814,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1692.271091,"end":1731.298984},"koRange":{"start":1666.085436,"end":1706.586814}},{"id":109,"sourceUid":"merged-mrpuswe9-36","sourceNo":109,"originalSourceNo":254,"displayNo":109,"vi":"Sao tìm người ở cùng lại khó thế này? Do bọn mình khó tính?\nCũng đâu phải. Bọn mình chỉ cần sạch sẽ phổ thông, lịch sự phổ thông, hòa đồng phổ thông thôi mà.\nCó mỗi thế thôi mà.\nHay là do con ma làm gì đó?","ko":"이렇게 하메 구하기가 힘드냐? 우리가 까다롭나?\n그건 아니지. 우린 그저 보통의 깔끔함에 보통의 예의...\n보통의 사교성, 응...그거면 되는데... 귀신이 역사를 하나?","en":"It's so hard to find a house mate. Are we being picky?\nThat can't be. We just want average hygiene, average etiquette, average sociability.\nYes, only that much. Maybe it's that ghost.","start":1706.586814,"end":1725.156986,"viStart":1731.298984,"viEnd":1750.765696,"koStart":1706.586814,"koEnd":1725.156986,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1731.298984,"end":1750.765696},"koRange":{"start":1706.586814,"end":1725.156986}},{"id":110,"sourceUid":"merged-mrpuu2zg-37","sourceNo":110,"originalSourceNo":386,"displayNo":110,"vi":"[Nhạc chủ đề lạc quan kết thúc]\n[Nói không rõ]\n[âm thanh kỳ lạ]\n[Nhạc nền sôi động bắt đầu]\n[Tình nguyện viên hỗ trợ chữ ký hét lên]","ko":"[경쾌한 테마 음악 끝]\n[안 들리게 말한다]\n[음산한 소리]\n[경쾌한 배경 음악 시작]\n[서명 지지 봉사원들 외친다]","en":"[Upbeat theme music ends] [Speaks inaudibly] [eerie sound] [Upbeat background music starts] [Signature support volunteers shout]","start":1725.157,"end":1750,"viStart":1750.765696,"viEnd":1775.319109,"koStart":1725.157,"koEnd":1750,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1750.765696,"end":1775.319109},"koRange":{"start":1725.157,"end":1750}},{"id":111,"sourceUid":"merged-mrp56cae-212","sourceNo":111,"originalSourceNo":388,"displayNo":111,"vi":"Bọn mình ký cái này đi.\nXin mọi người ký tên ủng hộ việc thay đổi luật bảo vệ động vật!\nXin hãy đến và ký tên.\nCó phim lúc 3:20, mình xin phim đó đi anh.","ko":"어! 오빠 저거 서명하러 가자 동물 보호법 개정을 요구합니다 \n서명 한번만 해주고 가세요! \n아... 어! 3시 20분 영화 있다","en":"Let's sign that petition. Please come and support us for the new animal protection legislation. Please come and sign our petition. There is one at 3:20, let's watch that one.","start":1750,"end":1769.847528,"viStart":1775.319109,"viEnd":1797.512216,"koStart":1750,"koEnd":1769.847528,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1775.319109,"end":1797.512216},"koRange":{"start":1750,"end":1769.847528}},{"id":112,"sourceUid":"merged-mt4huigr-7","sourceNo":112,"originalSourceNo":397,"displayNo":112,"vi":"[Các tình nguyện viên hỗ trợ chữ ký tiếp tục hét lên]\n[Nhạc nền sôi động kết thúc]","ko":"[서명 지지 봉사원들 계속 외친다]\n[경쾌한 배경 음악 끝]","en":"[Signature support volunteers continue to shout]\n[Upbeat background music ends]","start":0.9230000000000007,"end":0.9240000000000007,"viStart":0.9230000000000007,"viEnd":0.9240000000000007,"koStart":0.9230000000000007,"koEnd":0.9240000000000007,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":113,"sourceUid":"merged-mrp588ot-214","sourceNo":113,"originalSourceNo":398,"displayNo":113,"vi":"Xem phim rồi ăn tối là vừa đẹp nhỉ? Anh sao vậy?\nNay anh không có hứng xem phim.","ko":"저거 보자, 오빠. 영화 보고 저녁 먹으면 딱 맞겠는데...\n왜 그래, 오빠? 오늘은 영화 볼 기분이 아니다","en":"We can watch the movie and go for dinner. What did I do wrong?\nI don't feel like watching a movie today.","start":1769.847528,"end":1785.047891,"viStart":1797.512216,"viEnd":1810.913032,"koStart":1769.847528,"koEnd":1785.047891,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1797.512216,"end":1810.913032},"koRange":{"start":1769.847528,"end":1785.047891}},{"id":114,"sourceUid":"merged-mrp5c4au-221","sourceNo":114,"originalSourceNo":278,"displayNo":114,"vi":"Mày là thằng nào?\nThằng này là ai mà dám làm vậy với em?","ko":"아! 너 뭐야? 뭐야 이 새끼. 뭔데 너한테 이래?","en":"Who are you? Who is this jerk? Why is he treating you like this?","start":1848.363944,"end":1852.315699,"viStart":1873,"viEnd":1878.523553,"koStart":1848.363944,"koEnd":1852.315699,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1873,"end":1878.523553},"koRange":{"start":1848.363944,"end":1852.315699}},{"id":115,"sourceUid":"ko-mrob2li8-924","sourceNo":115,"originalSourceNo":400,"displayNo":115,"vi":"[Tiếng xe dừng lại]","ko":"[자동차 급 정거 소리]","en":"[Sound of car stopping]","start":0.9310000000000007,"end":0.9320000000000007,"viStart":0.9310000000000007,"viEnd":0.9320000000000007,"koStart":0.9310000000000007,"koEnd":0.9320000000000007,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":116,"sourceUid":"merged-mrp5906e-215","sourceNo":116,"originalSourceNo":402,"displayNo":116,"vi":"Kìa anh! Xuống xe. Anh…","ko":"오빠? 오빠아! 내려! 오빠!","en":"Doo-Young! Get off. Anh… Doo-Young...","start":1785.047891,"end":1804.398821,"viStart":1810.913032,"viEnd":1834.725095,"koStart":1785.047891,"koEnd":1804.398821,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1810.913032,"end":1834.725095},"koRange":{"start":1785.047891,"end":1804.398821}},{"id":117,"sourceUid":"merged-mrpv5o0k-38","sourceNo":117,"originalSourceNo":411,"displayNo":117,"vi":"Em đã sai gì sao? Em còn không biết? Vâng…\nEm thật sự không biết. Vậy nên em mới là con bé xấu xa đó.\nKhi ký tên, sao em lại ghi cả trường đại học?","ko":"내가 뭘 잘못했는데. 몰라서 물어? 어...\n나 진짜 모르겠어\n그래서 네가 나쁘다는 거야 싸가지 없고...\n너 아까 서명할 때 대학은 왜 썼냐?","en":"What did I do wrong?\nDon't you know? Yes...\nI'm really not sure. That's why you are horrible.\nWhy did you write your college name on the petition?","start":1804.398821,"end":1824.443691,"viStart":1834.725095,"viEnd":1850.48836,"koStart":1804.398821,"koEnd":1824.443691,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1834.725095,"end":1850.48836},"koRange":{"start":1804.398821,"end":1824.443691}},{"id":118,"sourceUid":"merged-mrp5b9mc-219","sourceNo":118,"originalSourceNo":416,"displayNo":118,"vi":"Không phải em ra vẻ vì học trường tốt hơn anh à?\nKhông phải.\nVì có ô ghi nghề nghiệp, nên…\nThế thì ghi \"sinh viên\" là được rồi!","ko":"어? 나보다 좋은 대학 다닌다고 유세 떤 거 아니야! \n아니... 그건... 직업란이 있으니까 \n그냥 대학생이라고만 써도 됐잖아!","en":"You were trying to show off your school is better than mine. No. That's because there was a field-- You could've just written \"College student.\"","start":1824.443691,"end":1834.10585,"viStart":1850.48836,"viEnd":1860.800923,"koStart":1824.443691,"koEnd":1834.10585,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1850.48836,"end":1860.800923},"koRange":{"start":1824.443691,"end":1834.10585}},{"id":119,"sourceUid":"merged-mrp5co11-223","sourceNo":119,"originalSourceNo":417,"displayNo":119,"vi":"[Tiếng tháo dây an toàn] [Tiếng đóng cửa xe] [Tiếng mở cửa xe] [Thở dài]","ko":"[안전 벨트를 푸는 소리] [차문 닫는 소리] [차문 여는 소리] [한숨 쉰다]","en":"[Sound of unfastening seat belt] [Sound of car door closing] [Sound of car door opening] [Sighs]","start":0.9520000000000007,"end":0.9530000000000007,"viStart":0.9520000000000007,"viEnd":0.9530000000000007,"koStart":0.9520000000000007,"koEnd":0.9530000000000007,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRa  Mọi người tan làm đi.","ko":"윤진명! 손 내밀어 봐. 흑!\n너 같으면 이런 손으로 서빙된 음식 먹고 싶겠어?\n손님이 컴플레인 걸면 어쩔 뻔했어?\n다른 사람들 다 퇴근해요","en":"Yoon Jin Myung. Jin-Myung Yoon.\nLet me see your hands.\nWould you want to be served with hands like this?\nWhat if the customers complain?\nEveryone else can leave.","start":2111.654836,"end":2144.435607,"viStart":2153.767451,"viEnd":2186.797008,"koStart":2111.654836,"koEnd":2144.435607,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2153.767451,"end":2186.797008},"koRange":{"start":2111.654836,"end":2144.435607}},{"id":137,"sourceUid":"merged-mrpwuegr-73","sourceNo":137,"originalSourceNo":327,"displayNo":137,"vi":"Tôi cũng đã tự mình xoay xở tốt nghiệp đại học.","ko":"나도... 나 혼자서 대학 졸업했다","en":"I made it out of college myself as well.","start":2245.504972,"end":2251.831236,"viStart":2288.448187,"viEnd":2293.363428,"koStart":2245.504972,"koEnd":2251.831236,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2288.448187,"end":2293.363428},"koRange":{"start":2245.504972,"end":2251.831236}},{"id":138,"sourceUid":"merged-mrpwo0n9-70","sourceNo":138,"originalSourceNo":493,"displayNo":138,"vi":"[Bật đèn] [Tiếng đóng cửa]","ko":"[불을 켠다] [문 닫는 소리]","en":"[Turn on the light] [Sound of door closing]","start":2287.105264,"end":2378.290423,"viStart":2329.538672,"viEnd":2416.178083,"koStart":2287.105264,"koEnd":2378.290423,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2329.538672,"end":2416.178083},"koRange":{"start":2287.105264,"end":2378.290423}},{"id":139,"sourceUid":"merged-mrpww0do-74","sourceNo":139,"originalSourceNo":499,"displayNo":139,"vi":"Sống ở nhà chú rồi dạy kèm em họ. \nChuyện ăn ở coi như được giải quyết, nhưng vẫn luôn phải lo tiền học, tiền sách vở, đi lại.","ko":"삼촌네서 사촌 동생 과외 시키면서\n숙식은 그렇게 해결됐는데\n등록금에 책값, 교통비\n매일 매일이 돈 걱정이었어","en":"I stayed with my uncle, teaching my cousin.\nThat's where I lived,\nbut still had to make tuition and living costs, always worried about money.","start":2251.831236,"end":2263.775014,"viStart":2 không? Vâng, đến ngay đây ạ. \nHôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. \nKêu anh ấy đến nhà… vì tôi cô đơn.","ko":"빨리 안 가지고 와! \n아 네, 지금 갑니다 \n어젯밤엔 진짜 위험했어요 \n하마터면 애인한테 전화할 뻔했다니까요... \n좀 와달라고...나 외롭다고...","en":"Won't you hurry up? It's coming now. \nIt was really dangerous last night... \nI almost called my lover. \nTo ask him to come... that I am lonely.","start":2424.81609,"end":2445.967564,"viStart":2468.920626,"viEnd":2488.020049,"koStart":2424.81609,"koEnd":2445.967564,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2468.920626,"end":2488.020049},"koRange":{"start":2424.81609,"end":2445.967564}},{"id":144,"sourceUid":"merged-mt4iowi3-9","sourceNo":144,"originalSourceNo":513,"displayNo":144,"vi":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]\n[Nhạc nền cổ điển kết thúc]","ko":"[테마 음악 끝] [클래식 배경 음악 시작]\n[클래식 배경 음악 끝]","en":"[Theme music ends] [Classic background music starts]\n[Classic background music ends]","start":1.2159999999999769,"end":1.2169999999999768,"viStart":1.2159999999999769,"viEnd":1.2169999999999768,"koStart":1.2159999999999769,"koEnd":1.2169999999999768,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":145,"sourceUid":"merged-mrpxp8sy-111","sourceNo":145,"originalSourceNo":369,"displayNo":145,"vi":"Chết mất thôi. Tôi cứ liên tục như vậy từ khi dọn ra. Giấc mơ thế nào?","ko":"아주 죽겠어요\n이사 가고 나서 부터 계속 꾸는데...\n어떤 꿈인데?","en":"It's really killing me,\nit's been every day since I moved.\nWhat kind of dream is it?","start":2477.353585,"end":2485.051017,"viStart":2519.739122,"viEnd":2529.412919,"koStart":2477.353585,"koEnd":2485.051017,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2519.739122,"end":2529.412919},"koRange":{"start":2477.353585,"end":2485.051017}},{"id":146,"sourceUid":"merged-mrpx7cem-91","sourceNo":146,"originalSourceNo":519,"displayNo":146,"vi":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.","ko":"(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...","en":"It is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","start":2395.908194,"end":2408.37535,"viStart":2438.445204,"viEnd":2452.464267,"koStart":2395.908194,"koEnd":2408.37535,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2438.445204,"end":2452.464267},"koRange":{"start":2395.908194,"end":2408.37535}},{"id":147,"sourceUid":"merged-mrpxddi4-95","sourceNo":147,"originalSourceNo":523,"displayNo":147,"vi":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.","ko":"걔는 가만히 서 가지고 \n계산 띡띡하고 7천 500원이면... \n아이! 근데 네가 왜 화를 내냐고? \n새로 온 애가 버벅대니까 나만 힘들잖아... \n아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다","en":"She gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","start":2408.37535,"end":2424.81609,"viStart":2452.464267,"viEnd":2468.920626,"koStart":2408.37535,"koEnd":2424.81609,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2452.464267,"end":2468.920626},"koRange":{"start":2408.37535,"end":2424.81609}},{"id":148,"sourceUid":"merged-mrpxrclp-112","sourceNo":148,"originalSourceNo":375,"displayNo":148,"vi":"Là thế này. Tôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước.\nGiống mắt người, nhưng cũng giống mắt thú… Đôi mắt ấy xa dần…\nnhưng vẫn nhìn theo tôi cho đến cùng.","ko":"그게요...내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고...\n짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서...\n끝까지 날 쳐다보는데...","en":"That is... I fell into water...\nIt's completely dark.\nSomebody is looking at me in the water.\nIt looks like human eyes, or maybe an animal's...\nThose eyes are going away slowly...\nbut they keep staring at me.","start":2485.051017,"end":2518.441312,"viStart":2485.051017,"viEnd":2518.441312,"koStart":2485.051017,"koEnd":2518.441312,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":2485.051017,"end":2518.441312}},{"id":149,"sourceUid":"ko-mrob2li9-1052","sourceNo":149,"originalSourceNo":528,"displayNo":149,"vi":"[nhạc jazz bắt đầu]","ko":"[재즈 음악 시작]","en":"[jazz music starts]","start":1.2529999999999728,"end":1.2539999999999727,"viStart":1.2529999999999728,"viEnd":1.2539999999999727,"koStart":1.2529999999999728,"koEnd":1.2539999999999727,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":150,"sourceUid":"merged-mrpxuf8d-115","sourceNo":150,"originalSourceNo":377,"displayNo":150,"vi":"Tôi…Chú có muốn đến nhà tôi không?\nMà cũng không được.\nNhà người yêu mà đưa đàn ông khác đến thì không phải lắm.\nTôi cũng có phép lịch sự tối thiểu mà.","ko":"나는...아저씨, 우리 집 갈래요?\n아, 그건 안 되겠다\n애인 집인데 딴 남자 데려가면 상도덕이 아니지...\n그 정도 예의는 있어요, 나도","en":"I... You want to come to my place? Well, I shouldn't... I shouldn't be bringing a guy to the house my lover got me. I still have some etiquette.","start":2518.441312,"end":2546.041131,"viStart":2529.412919,"viEnd":2564.859597,"koStart":2518.441312,"koEnd":2546.041131,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2529.412919,"end":2564.859597},"koRange":{"start":2518.441312,"end":2546.041131}},{"id":151,"sourceUid":"merged-mrpxj2yb-109","sourceNo":151,"originalSourceNo":539,"displayNo":151,"vi":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.","ko":"전화하면 안 되는 건가? \n바보 당연히 안 되죠. 남녀관계라는 건요... \n시소 같은 거예요. 내가 올라가면 상대방은 내려가게 돼 있어요","en":"Can you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","start":2445.967564,"end":2463.074866,"viStart":2488.020049,"viEnd":2505.017636,"koStart":2445.967564,"koEn 02,"viStart":2590.427621,"viEnd":2664.934723,"koStart":2547.852287,"koEnd":2625.769802,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2590.427621,"end":2664.934723},"koRange":{"start":2547.852287,"end":2625.769802}},{"id":156,"sourceUid":"merged-mrpxzu7k-121","sourceNo":156,"originalSourceNo":386,"displayNo":156,"vi":"Hôm qua tôi đã chờ em ở cổng sau. Quản lý đã đưa tôi về. Em biết mọi người bàn tán không?","ko":"어제도 뒷문에서 기다렸어요\n매니저님이 데려다 줬어요\n사람들이 수군대는 거 알아요?","en":"I waited for you at the back door last night. Manager gave me a ride. You know, people are talking about you.","start":2625.769802,"end":2639.019689,"viStart":2664.934723,"viEnd":2681.637551,"koStart":2625.769802,"koEnd":2639.019689,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2664.934723,"end":2681.637551},"koRange":{"start":2625.769802,"end":2639.019689}},{"id":157,"sourceUid":"merged-mrpxxac1-119","sourceNo":157,"originalSourceNo":568,"displayNo":157,"vi":"[Nhạc Jazz kết thúc] [Tiếng rửa mặt]","ko":"[재즈 음악 끝] [세수하는 소리]","en":"[Jazz music ends] [Sound of washing face]","start":1.3109999999999664,"end":1.3119999999999663,"viStart":1.3109999999999664,"viEnd":1.3119999999999663,"koStart":1.3109999999999664,"koEnd":1.3119999999999663,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":158,"sourceUid":"ko-mrob2li9-1093","sourceNo":158,"originalSourceNo":569,"displayNo":158,"vi":"[Nhạc chủ đề bắt đầu]","ko":"[테마 음악 시작]","en":"[Theme music starts]","start":2663.631102,"end":2730.849716,"viStart":2705.993132,"viEnd":2772.195648,"koStart":2663.631102,"koEnd":2730.849716,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2705.993132,"end":2772.195648},"koRange":{"start":2663.631102,"end":2730.849716}},{"id":159,"sourceUid":"merged-mrpy0fyz-122","sourceNo":159,"originalSourceNo":576,"displayNo":159,"vi":"Hãy nói chuyện đó không đúng đi. Chuyện đó là chuyện gì?\nTôi nói thì anh sẽ tin chứ? Tin.","ko":"그런 거 아니라고 말해줘요. 그런 거 어떤 거요?\n말하면 믿을 거예요? 네","en":"Please tell me that's not true. What's not true?\nWill you believe me if I do? Yes.","start":2639.019689,"end":2663.631102,"viStart":2681.637551,"viEnd":2705.993132,"koStart":2639.019689,"koEnd":2663.631102,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2681.637551,"end":2705.993132},"koRange":{"start":2639.019689,"end":2663.631102}},{"id":160,"sourceUid":"merged-mrpy6eb3-125","sourceNo":160,"originalSourceNo":394,"displayNo":160,"vi":"- Có người. - Nhanh ra đi, cho chị đi. Chị sắp ra quần rồi, mau đi. Này, nhanh lên. Mắc quá! Chị xin lỗi.","ko":"있어...야, 나 싸... 야 나와 봐. 나 싸...\n야 싼다, 빨리 나와 봐...\n아, 야 빨리... 나 싸... 싸네...아... 미안","en":"-I'm here. -I'm about to let it go, come out. I'm almost there, come on. Come on, please. Sorry.","start":2730.849716,"end":2751.158743,"viStart":2772.195648,"viEnd":2793.087803,"koStart":2730.849716,"koEnd":2751.158743,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2772.195648,"end":2793.087803},"koRange":{"start":2730.849716,"end":2751.158743}},{"id":161,"sourceUid":"merged-mrpyd1sy-138","sourceNo":161,"originalSourceNo":398,"displayNo":161,"vi":"Chị Kang đến đấy.\nỪ, chị thấy trên đường về rồi. Xin lỗi.\nCảm ơn vì cho chị dùng nhà vệ sinh. Song. Dạ?","ko":"강 언니 왔어... 어... 오다 봤어 미안... \n화장실 잘 쓰고 갑니다 송! 예?","en":"Kang's here. I know, I saw her. Sorry. Thanks for letting me use the toilet. -Song. -Yeah?","start":2764.109757,"end":2789.49012,"viStart":2807.695533,"viEnd":2831.864442,"koStart":2764.109757,"koEnd":2789.49012,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2807.695533,"end":2831.864442},"koRange":{"start":2764.109757,"end":2789.49012}},{"id":162,"sourceUid":"merged-mt4jho2m-10","sourceNo":162,"originalSourceNo":585,"displayNo":162,"vi":"[Nhạc chủ đề kết thúc]\n[Tiếng gõ cửa] [Tiếng nước xối] [Tiếng đóng cửa]","ko":"[테마 음악 끝]\n[노크 소리] [물 내리는 소리] [문 닫는 소리]","en":"[Theme music ends]\n[Knocking sound] [Water flushing] [Door closing sound]","start":2816.26855,"end":2831.091588,"viStart":2872.786709,"viEnd":2879.546074,"koStart":2816.26855,"koEnd":2831.091588,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2872.786709,"end":2879.546074},"koRange":{"start":2816.26855,"end":2831.091588}},{"id":163,"sourceUid":"merged-mrpycfas-137","sourceNo":163,"originalSourceNo":590,"displayNo":163,"vi":"Gì vậy chứ? Hình như chị ấy say lắm.\nSay thì say nhưng sao chị ấy lại đến đây?\nĐúng như người xưa đã nói ấy.\n\"Ngựa quen đường cũ.\"","ko":"뭐야? 되게 취한 거 같아요 취한 건 취한 거고... 왜 왔냐고? \n김유신의 말 같은 거 아닐까요? 늘 가던 데로 가는 거","en":"What's this? -She seems very drunk.\nOkay, she's drunk, but what's she doing here?\nMaybe it's an instinct?\nHoming instinct.","start":2751.158743,"end":2764.109757,"viStart":2793.087803,"viEnd":2807.695533,"koStart":2751.158743,"koEnd":2764.109757,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2793.087803,"end":2807.695533},"koRange":{"start":2751.158743,"end":2764.109757}},{"id":164,"sourceUid":"merged-mrpyw5e1-147","sourceNo":164,"originalSourceNo":414,"displayNo":164,"vi":"Đúng là ngốc thật.\nEm không biết em tuyệt vời thế nào à?\nSao lại quen tên khốn nạn như thế?","ko":"아... 아! 아...바보야, 진짜...\n쟤는 지가 얼마나 괜찮은 앤지 모른다\n그것도 모르고 쌩양아치를 만나...","en":"You fool... she doesn't know how good she is. \nShe is wasting her time meeting that jerk.","start":2831.091588,"end":2848.790953,"viStart":2879.546074,"viEnd":2892.127468,"koStart":2831.091588,"koEnd":2848.790953,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2879.546074,"end":2892.127468},"koRange":{"start":2831.091588,"end":2848.790953}},{"id":165,"sourceUid":"merged-mrpyt6r8-144","sourceNo":165,"originalSourceNo":604,"displayNo":165,"vi":"Con ma kia đi mất rồi đúng không?\nDạo này hết thấy rồi nhỉ? Chắc không thấy đâu.\nVì nó đã đi theo chị mà. Dạo này nó rất bận vì xuất hiện trong giấc mơ của chị. Này, coi chừng.","ko":"저기 귀신 없어졌지? 어? 요즘 안 보이지?\n안 보일 거야. 나 따라왔으니까\n요즘에 내 꿈에 나오느라 겁나 바쁘거든\n어머... 야 야! 어...아! - 아! 아...아!","en":"That ghost is gone, right? Not here any more. Probably not. It followed me.\nIt's in my dreams lately.\nWatch out.","start":2789.49012,"end":2816.26855,"viStart":2831.864442,"viEnd":2857.806936,"koStart":2789.49012,"koEnd":2816.26855,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2831.864442,"end":2857.806936},"koRange":{"start":2789.49012,"end":2816.26855}},{"id":166,"sourceUid":"merged-mrpytmiu-146","sourceNo":166,"originalSourceNo":611,"displayNo":166,"vi":"Em đó… Đừng có quen tên đó nữa.\nChị sợ em sẽ bị tổn thương.\nChị lo cho em.","ko":"너... 그 남자 만나지 마\n네가 다칠까 봐 그래. 걱정돼서...","en":"You...don't see him any more.\nI think you might get hurt. I'm worried.","start":2816.26855,"end":2830.19807,"viStart":2857.806936,"viEnd":2872.786709,"koStart":2816.26855,"koEnd":2830.19807,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2857.806936,"end":2872.786709},"koRange":{"start":2816.26855,"end":2830.19807}},{"id":167,"sourceUid":"merged-mrpzf8eb-162","sourceNo":167,"originalSourceNo":616,"displayNo":167,"vi":"[Tiếng nước rơi] [Nhạc chủ đề bắt đầu]\n[ngáy]","ko":"[물 내리는 소리] [테마 음악 시작]\n[코를 골다]","en":"[Sound of water falling] [Theme music starts]\n[snoring]","start":2906.416462,"end":2951.888772,"viStart":2906.416462,"viEnd":2951.888772,"koStart":2906.416462,"koEnd":2951.888772,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":2906.416462,"end":2951.888772},"koRange":null},{"id":168,"sourceUid":"merged-mrpz6e0j-153","sourceNo":168,"originalSourceNo":620,"displayNo":168,"vi":"Ngốc quá đi mất. Gì đây?\nSao lại say ở nhà người khác?","ko":"아이고, 바보야 진짜...뭐야...\n남의 집에서 술주정은...","en":"How foolish... What now... falling asleep here?","start":2892.127468,"end":2906.416462,"viStart":2892.127468,"viEnd":2906.416462,"koStart":2892.127468,"koEnd":2906.416462,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":2892.127468,"end":2906.416462},"koRange":null},{"id":169,"sourceUid":"merged-mrpz7xh3-157","sourceNo":169,"originalSourceNo":626,"displayNo":169,"vi":"Em biết mọi người bàn tán không?\nHãy nói chuyện đó không đúng đi.\nTôi không thể nói.\nCô ra quầy thanh toán đứng cho đến khi khỏi tay đi.","ko":"(박재완) 사람들이 수군대는 거 알아요? \n그런 거 아니라고 말해줘요 \n(윤진명) 말할 수 없어... \n손톱 다 나을 때까지 카운터에서 일해","en":"Do you know people are talking about you?\nTell me that's not true. I can't.\nUntil you recover, stay at the desk.","start":2909.687831,"end":2931.508784,"viStart":2951.888772,"viEnd":2970.606958,"koStart":2909.687831,"koEnd":2931.508784,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2951.888772,"end":2970.606958},"koRange":{"start":2909.687831,"end":2931.508784}},{"id":170,"sourceUid":"merged-mrpz8x4g-160","sourceNo":170,"originalSourceNo":630,"displayNo":170,"vi":"Nếu sau này có chuyện gì, cứ việc nói với tôi. \nTôi không thể nói là không có chuyện gì.\n Anh ta biết chính xác bản thân đang làm gì.","ko":"앞으로 어려운 일 있으면...\n뭐 삼촌처럼... \n(윤진명) 아무 일 없었다고 말할 수 없다 \n그 행동이 어떤 의미인지... \n그는 알고 있었다","en":"Let me know if anything happens,\nlike talking to your uncle.\nI can't say nothing happened.\nHe knew exactly what he meant through his action.","start":2931.508784,"end":2943.645308,"viStart":2970.606958,"viEnd":2984.956577,"koStart":2931.508784,"koEnd":2943.645308,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2970.606958,"end":2984.956577},"koRange":{"start":2931.508784,"end":2943.645308}},{"id":171,"sourceUid":"merged-mrpz9aoj-161","sourceNo":171,"originalSourceNo":633,"displayNo":171,"vi":"Cảm ơn anh. Được rồi.\nTôi cũng biết… anh ta làm vậy là có ý gì.","ko":"고맙습니다 그래 \n(윤진명) 그 행동이 어떤 의미인지...\n나도 알고 있었다","en":"Thank you. Okay. I also knew... what his action meant.","start":2943.645308,"end":2954.486136,"viStart":2984.956577,"viEnd":2995.087762,"koStart":2943.645308,"koEnd":2954.486136,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2984.956577,"end":2995.087762},"koRange":{"start":2943.645308,"end":2954.486136}},{"id":172,"sourceUid":"merged-mrpzg5n4-165","sourceNo":172,"originalSourceNo":639,"displayNo":172,"vi":"Thời gian qua chị đã khinh miệt em. \nVì nghĩ rằng mình tốt đẹp hơn em. Nhưng không phải. \nChỉ là… chị không gặp nhiều cám dỗ như em thôi.","ko":"그동안 난 널 경멸했다\n내가 너보다 잘난 사람이라고 생각했어\n아니었어. 나에겐...\n그저 너만큼의 유혹이 없었던 것뿐이야","en":"I hated you before.\nI thought I was better than you, but I wasn't. It's just...\nI didn't have as much of a temptation.","start":2954.486136,"end":2973.006952,"viStart":2995.087762,"viEnd":3015.988636,"koStart":2954.486136,"koEnd":2973.006952,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2995.087762,"end":3015.988636},"koRange":{"start":2954.486136,"end":2973.006952}},{"id":173,"sourceUid":"merged-mrpzswvc-172","sourceNo":173,"originalSourceNo":440,"displayNo":173,"vi":"Thì ra hôm nay là Chủ Nhật.\nEm xin lỗi vì gây chuyện tối qua.\nCon ma ấy vẫn đang ở đây.","ko":"아... 일요일이구나...\n어제는 물의를 일으켜서 죄송합니다\n그 귀신...계속 여기 있었어\n어? 그 귀신이 강 언니 따라온 것 같다고\n어제 그랬잖아...","en":"It is Sunday. I'm really sorry about last night. That ghost, it was here the whole time.","start":3030,"end":3058.178486,"viStart":3072,"viEnd":3102.921244,"koStart":3030,"koEnd":3058.178486,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3072,"end":3102.921244},"koRange":{"start":3030,"end":3058.178486}},{"id":174,"sourceUid":"merged-mrpzuw9m-175","sourceNo":174,"originalSourceNo":445,"displayNo":174,"vi":"Hôm qua chị bảo nó đi theo chị mà.\nChị đã nói vậy sao?\nChị không nhớ hả?\nNói tóm lại nó vẫn luôn ở đây, không có đi theo chị.\nĐược rồi. Vậy thứ đó là gì chứ?","ko":"그 귀신이 강 언니 따라온 것 같다고 \n내가 그런 말 했어? 기억 안 나?\n어쨌든 그 귀신은 계속 여기 있었어\n강 언니 따라간 거 아니야\n그래? 그럼, 그건 뭐지?","en":"Yesterday, you said it followed you.\nDid I say that? Don't you remember?\nAnyway, the ghost has been here, it didn't follow you.\nOkay. Then what is that?","start":3058.178486,"end":3077.167337,"viStart":3102.921244,"viEnd":3119.924433,"koStart":3058.178486,"koEnd":3077.167337,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3102.921244,"end":3119.924433},"koRange":{"start":3058.178486,"end":3077.167337}},{"id":175,"sourceUid":"merged-mrpzyehy-178","sourceNo":175,"originalSourceNo":448,"displayNo":175,"vi":"Em sống ở đây không được sao? \nEm biết dọn đi rồi quay lại là ngu ngốc… rồi cả chuyện nói dối nữa.","ko":"나 그냥 여기서 살면 안 될까? \n나갔다 들어왔다 바보 같은 것도 알고 내가 거짓말한 것도 알고","en":"Can I not just live here?\nI know it looks stupid coming back after moving out,\nalso, I lied.","start":3077.167337,"end":3095.823756,"viStart":3119.924433,"viEnd":3139.659201,"koStart":3077.167337,"koEnd":3095.823756,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3119.924433,"end":3139.659201},"koRange":{"start":3077.167337,"end":3095.823756}},{"id":176,"sourceUid":"merged-mrpzjkpj-169","sourceNo":176,"originalSourceNo":641,"displayNo":176,"vi":"[Tiếng thức dậy và rên rỉ] [Nhạc chủ đề kết thúc]","ko":"[잠 깨며 끙끙대는 소리] [테마 음악 끝]","en":"[Sound of waking up and groaning] [Theme music ends]","start":1.5119999999999443,"end":1.5129999999999442,"viStart":1.5119999999999443,"viEnd":1.5129999999999442,"koStart":1.5119999999999443,"koEnd":1.5129999999999442,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":177,"sourceUid":"merged-mrpzk36o-170","sourceNo":177,"originalSourceNo":452,"displayNo":177,"vi":"Em biết… nhưng em không thể sống ở đây nữa ư?","ko":"아는데...나 그래도 여기서 살면 안 될까?","en":"I know, but... can't I just live here?","start":3095.823756,"end":3106.785355,"viStart":3139.659201,"viEnd":3149.608967,"koStart":3095.823756,"koEnd":3106.785355,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3139.659201,"end":3149.608967},"koRange":{"start":3095.823756,"end":3106.785355}},{"id":178,"sourceUid":"merged-mrq008s5-180","sourceNo":178,"originalSourceNo":657,"displayNo":178,"vi":"[Tiếng đóng cửa] [Nhạc nền bắt đầu]","ko":"[문 닫는 소리][배경 음악 시작]","en":"[Sound of door closing] [Background music starts]","start":3106.785355,"end":3135,"viStart":3149.608967,"viEnd":3176.739199,"koStart":3106.785355,"koEnd":3135,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3149.608967,"end":3176.739199},"koRange":{"start":3106.785355,"end":3135}},{"id":179,"sourceUid":"merged-mrq03k3b-187","sourceNo":179,"originalSourceNo":669,"displayNo":179,"vi":"Mời bạn. Tôi cảm ơn. Không hiểu sao tôi lại căng thẳng quá. Tạm biệt ạ. Bạn đi cẩn thận nhé.","ko":"드세요 고맙습니다 왠지 긴장되네요... \n가 보겠습니다 (모두) 안녕히 가세요...","en":"Please have tea. Thank you. For some reason, I'm nervous. Bye.","start":3135.53852,"end":3156.66,"viStart":3176.739199,"viEnd":3199.266582,"koStart":3135.53852,"koEnd":3156.66,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3176.739199,"end":3199.266582},"koRange":{"start":3135.53852,"end":3156.66}},{"id":180,"sourceUid":"merged-mrqh3uqw-2","sourceNo":180,"originalSourceNo":678,"displayNo":180,"vi":"Em thấy không ưng lắm. Ở đâu?\nChỉ là đơn giản cảm thấy thế thôi. Em cũng thế.\nCòn tiền bối Yoon? Chị thì cũng không phải ưng lắm.\nĐúng không? Em cũng không ưng gì cả.\nQuá bình thường.","ko":"난 쫌 별로인데. 어디가?\n그냥 뭐... 전체적으로다가 느낌적인 느낌이...저도 좀 그래요. 윤 선배는요?\n나도 뭐, 딱히 마음에 드는 건 아닌데...\n그치 나도 별로야...너무 평범해. 그치이? 너어어무 평범해","en":"I'm not so sure. About what?\nMy feeling's all over the place... Me too. You?\nI am not so sure either.\nRight? I didn't like her much.\nToo ordinary.","start":3160.358095,"end":3187.402721,"viStart":3199.266582,"viEnd":3227.393196,"koStart":3160.358095,"koEnd":3187.402721,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3199.266582,"end":3227.393196},"koRange":{"start":3160.358095,"end":3187.402721}},{"id":181,"sourceUid":"merged-mrqhc9o8-4","sourceNo":181,"originalSourceNo":682,"displayNo":181,"vi":"Đúng rồi, quá là bình thường ấy, không mặn tẹo nào.\nCũng phải có lúc này lúc kia,\nthỉnh thoảng nói dối, rồi sống náo nhiệt lên tí.","ko":"재미가 없어...\n사람이 좀, 응? 들쑥날쑥하고, 응?\n거짓말도 좀 할 거 같고 인생이 좀... 말이야... 응?\n다이나믹하게...","en":"Yeah, too ordinary, no fun.\nSometimes, ups and downs\nand bits of lies make our life dynamic.","start":3187.402721,"end":3196.922773,"viStart":3227.393196,"viEnd":3239.472893,"koStart":3187.402721,"koEnd":3196.922773,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3227.393196,"end":3239.47289 urceUid":"merged-mrqhxeyo-23","sourceNo":193,"originalSourceNo":724,"displayNo":193,"vi":"Nếu giờ tôi yếu đuối… thì sẽ chấm hết.\nVậy nên… đừng thích tôi nữa.","ko":"여기서 약해지면... 진짜 끝장이에요 \n그러니까... 나 좋아하지 마요","en":"If I become weak now, it will be the end.\nSo... don't like me.","start":3456.398763,"end":3484.291157,"viStart":3497.95674,"viEnd":3525.733611,"koStart":3456.398763,"koEnd":3484.291157,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3497.95674,"end":3525.733611},"koRange":{"start":3456.398763,"end":3484.291157}},{"id":194,"sourceUid":"merged-mrqi4j1n-48","sourceNo":194,"originalSourceNo":508,"displayNo":194,"vi":"Tiền bối. Có chuyện gì sao? Chị đau quá. \nChị bị bật móng tay. Chị không ngờ nó đau đến mức này. \nĐau đến mức… tưởng như chết mất. Chị chết mất thôi.","ko":"(송지원) 윤 선배...무슨 일 있어?\n손톱이...빠졌는데...이렇게...\n아픈 줄 몰랐어...\n아파서...죽을 거 같아\n죽을 거 같아...","en":"Yoon. Are you okay? It hurts.\nMy nail came off.\nAnd I didn't know it would hurt so bad. It hurts...\nHurts like I'm dying.\nIt feels like I'm dying.","start":3560,"end":3695.855799,"viStart":3588,"viEnd":3727.935312,"koStart":3560,"koEnd":3695.855799,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3588,"end":3727.935312},"koRange":{"start":3560,"end":3695.855799}},{"id":195,"sourceUid":"merged-mt57b6cg-1","sourceNo":195,"originalSourceNo":733,"displayNo":195,"vi":"[Khóc][Khóc lớn]\n[Bài hát chủ đề bắt đầu]","ko":"[운다][크게 소리 내 운다]\n[테마 노래 시작]","en":"[Crying][Crying loudly]\n[Theme song starts]","start":1.7159999999999218,"end":1.7169999999999217,"viStart":1.7159999999999218,"viEnd":1.7169999999999217,"koStart":1.7159999999999218,"koEnd":1.7169999999999217,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":196,"sourceUid":"merged-mrqigdus-56","sourceNo":196,"originalSourceNo":744,"displayNo":196,"vi":"MÓNG TAY BẠN ĐÃ ĐỠ CHƯA?\nVâng, không sao. BẠN 28 TUỔI VẪN CHƯA TỐT NGHIỆP, LÝ DO LÀ GÌ? BIẾT THU NHẬP CỦA KANG YI NA CHỨ?\nTôi đã bảo lưu nhiều lần.\nTôi có biết qua function rowsFromAnyJson(p){

function audioEl(lang){return lang==='ko'?$('koAudio'):$('viAudio')}
function normFolderPath(folder){

function audioPath(lang){

function clampVol(v){v=Number(v);if(!Number.isFinite(v))v=100;return Math.max(0,Math.min(200,v))}
function loadVolSettings(){try{return JSON.parse(localStorage.getItem(VOL_KEY)||'{}')||{}}catch(e){return {}}}

  try{
    const a=audioEl(lang);

      volSources[lang]=volCtx.createMediaElementSource(a);

      volSources[lang].connect(volGains[lang]);
      volGains[lang].connect(volCtx.destination);

  }catch(e){return false}
}
function applyGameVolume(lang){
  if(lang!=='vi'&&lang!=='ko')return;

  const ok=ensureVolGain(lang);

function setGameVolume(lang,v,persist=true){

function initVolumeControls(){

    const val=clampVol(saved[lang]??100);

function validRange(s,e){s=Number(s);e=Number(e);return Number.isFinite(s)&&Number.isFinite(e)&&e>=s}
function audioRange(item,side){

  const hasKo=!!item.hasKoAudio&&validRange(item.koStart,item.koEnd);

function koTextForRead(s){return clean(String(s||'').replace(/[()\[\]{}<>]/g,' ').replace(/^[A-Za-z0-9_.\- ]+:\s*/gm,' ').replace(/\s{2,}/g,' '))}

function rowsByKo(){return state.rows.slice().sort((a,b)=>(a.koStart-b.koStart)||(a.viStart-b.viStart)||(a.id-b.id))}

function render(){renderList('left');renderList('right');$('leftCount').textContent=state.left.length;$('rightCount').textContent=state.right.length}
function renderList(side){

function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}

async function playRound(){if(!state.left.length)return;const side='left', items=state.left.map(x=>({...x,_rg:audioRange(x,side)})).sort((a,b)=>a._rg.start-b._rg.start);stopAudio();state.audioMode='roundseq';setStatus('Đang nghe/Read KO cả lượt: '+items.length+' câu.');for(const it of items){if(state.audioMode!=='roundseq')break;const rg=audioRange(it,side);setStatus((rg.lang==='readko'?'Read KO':'Nghe')+' cả lượt: '+(items.indexOf(it)+1)+'/'+items.length+' · '+rg.label);if(rg.lang==='readko'){await readKoPromise(it.ko)}else{await playAudioRangePromise(rg)}await new Promise(r=>setTimeout(r,180))}if(state.audioMode==='roundseq'){state.audioMode='free';setStatus('Đã nghe/Read KO xong cả lượt.')}}
