a who it is)...","text":"Song Ji-won: (làm mặt như không biết đó là ai)...\n송지원: (누군지 도저히 모르겠다는 얼굴을 한다)···.\nSong Ji-won: (makes a face like he has no idea who it is)...","sourceUid":"nar-mrr7hry4-omui8q","sourceNo":"N212","viRanges":[],"koRanges":[]},{"id":270,"readerNo":271,"displayNo":"128","n":"128","kind":"sub","type":"merged","vi":"Thì cũng… Mọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà. nhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.","ko":"뭐 그냥... 사람들은 다 좋은데... 청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요","en":"It's just... they are all good people, just not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","text":"Thì cũng… Mọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà. nhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.\n뭐 그냥... 사람들은 다 좋은데... 청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요\nIt's just... they are all good people, just not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","sourceUid":"merged-mrp0tfmc-74","sourceNo":128,"viRanges":[{"start":804.142404,"end":818.338229}],"koRanges":[{"start":846.3,"end":859.214116}]},{"id":271,"readerNo":272,"displayNo":"N213","n":"N213","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Nhìn Song Ji-won và gật đầu) Đó là những gì tôi đang nói.","ko":"정예은: (송지원 바라보며 고개까지 끄덕인다) 내 말이요.","en":"Jeong Ye-eun: (Looking at Song Ji-won and nodding) That's what I'm saying.","text":"Jeong Ye-eun: (Nhìn Song Ji-won và gật đầu) Đó là những gì tôi đang nói.\n정예은: (송지원 바라보며 고개까지 끄덕인다) 내 말이요.\nJeong Ye-eun: (Looking at Song Ji-won and nodding) That's what I'm saying.","sourceUid":"nar-mrr7i6yh-slfebr","sourceNo":"N213","viRanges":[],"koRanges":[]},{"id":272,"readerNo":273,"displayNo":"N214","n":"N214","kind":"narration","type":"dialogue","vi":"Song Ji-won: (Nhìn tôi với vẻ mặt như muốn hỏi: “Chắc chắn là tôi phải không?”)...","ko":"송지원: (설마 나? 하는 얼굴로 쳐다본다)···.","en":"Song Ji-won: (Looks at me with a face that asks, “Surely it’s me?”)...","text":"Song Ji-won: (Nhìn tôi với vẻ mặt như muốn hỏi: “Chắc chắn là tôi phải không?”)...\n송지원: (설마 나? 하는 얼굴로 쳐다본다)···.\nSong Ji-won: (Looks at me with a face that asks, “Surely it’s me?”)...","sourceUid":"nar-mrr7i7ls-yhw5r1","sourceNo":"N214","viRanges":[],"koRanges":[]},{"id":273,"readerNo":274,"displayNo":"177","n":"177","kind":"sub","type":"merged","vi":"- Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà. Chính xác.\nChỗ tôi sống trước đây, họ chỉ dọn vệ sinh đúng một lần một tuần thôi.","ko":"맞아요 화장실, 거실... 이런 데는... 깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요\n전에 살던 데는요...\n화장실 청소를 일주일에 한 번밖에 안 해요","en":"-It's really irritating. -You are right.\nPlaces like bathroom and living room\nshould be looked after properly because these are common spaces.\nThat's what I mean. In my previous shared house,\nthey clean the bathroom only once a week.","text":"- Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà. Chính xác.\nChỗ tôi sống trước đây, họ chỉ dọn vệ sinh đúng một lần một tuần thôi.\n맞아요 화장실, 거실... 이런 데는... 깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요\n전에 살던 데는요...\n화장실 청소를 일주일에 한 번밖에 안 해요\n-It's really irritating. -You are right.\nPlaces like bathroom and living room\nshould be looked after properly because these are common spaces.\nThat's what I mean. In my previous shared house,\nthey clean the bathroom only once a week.","sourceUid":"merged-mrp0vvnx-77","sourceNo":177,"viRanges":[{"start":818.338229,"end":828.595644}],"koRanges":[{"start":859.214116,"end":870.995352}]},{"id":274,"readerNo":275,"displayNo":178,"n":178,"kind":"sub","type":"merged","vi":"","ko":"네?","en":"","text":"네?","sourceUid":"ko-m 보인다.\nJinmyeong Yoon brushes his teeth. A gold ring can be seen on the ring finger of the right hand that is being washed.","sourceUid":"nar-mrru7k9f-seet10","sourceNo":"N425","viRanges":[],"koRanges":[]},{"id":529,"readerNo":530,"displayNo":335,"n":335,"kind":"sub","type":"merged","vi":"Nay em sẽ đi chợ. Có ai muốn đi không ạ? Em đi một mình đi… Mua hộ chị băng vệ sinh được không? Có ai cần thêm gì không ạ? Cái tủ lạnh trống trơn đấy…","ko":"(정예은) 오늘 장 보러 갈 건데\n같이 가실 분 있어요?\n(송지원) 너 혼자 가...\n(정예은) 나는 생리대 소형 사다 줄래?\n(정예은) 예은 언니 말고 다른 거 필요한 분 있어요?\n(강이나) 냉장고 텅 비었더라...","en":"I'm going to the market today. Anybody wants to join? Go by yourself... Can you buy me a pad? Anyone else needs something? The fridge is empty...","text":"Nay em sẽ đi chợ. Có ai muốn đi không ạ? Em đi một mình đi… Mua hộ chị băng vệ sinh được không? Có ai cần thêm gì không ạ? Cái tủ lạnh trống trơn đấy…\n(정예은) 오늘 장 보러 갈 건데\n같이 가실 분 있어요?\n(송지원) 너 혼자 가...\n(정예은) 나는 생리대 소형 사다 줄래?\n(정예은) 예은 언니 말고 다른 거 필요한 분 있어요?\n(강이나) 냉장고 텅 비었더라...\nI'm going to the market today. Anybody wants to join? Go by yourself... Can you buy me a pad? Anyone else needs something? The fridge is empty...","sourceUid":"merged-mrp4rg3p-177","sourceNo":335,"viRanges":[{"start":1487.817511,"end":1501.417263}],"koRanges":[{"start":1462.937383,"end":1475.058213}]},{"id":530,"readerNo":531,"displayNo":339,"n":339,"kind":"sub","type":"merged","vi":"Chắc cậu giàu lắm hả? Suốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? Tớ thật sự không phải người như thế.","ko":"(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜","en":"Do you have so much money? It wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","text":"Chắc cậu giàu lắm hả? Suốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? Tớ thật sự không phải người như thế.\n(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜\nDo you have so much money? It wasn't too long ago you were borrowing.\nWhen did I  a house mate. Are we being picky?\nThat can't be. We just want average hygiene, average etiquette, average sociability.\nYes, only that much. Maybe it's that ghost.","sourceUid":"merged-mrpuswe9-36","sourceNo":254,"viRanges":[{"start":1731.298984,"end":1750.765696}],"koRanges":[{"start":1706.586814,"end":1725.156986}]},{"id":634,"readerNo":635,"displayNo":"N502","n":"N502","kind":"narration","type":"narration","vi":". Phố Sinchon (ban ngày)","ko":". 신촌 거리(낮)","en":". Sinchon Street (daytime)","text":". Phố Sinchon (ban ngày)\n. 신촌 거리(낮)\n. Sinchon Street (daytime)","sourceUid":"nar-mrrui36v-xdaxgy","sourceNo":"N502","viRanges":[],"koRanges":[]},{"id":635,"readerNo":636,"displayNo":"N503","n":"N503","kind":"narration","type":"narration","vi":"Jeong Ye Eun và Go Doo Young đang hẹn hò. Có vẻ hạnh phúc.","ko":"정예은과 고두영이 데이트 중이다. 행복해 보인다.","en":"Jeong Ye-eun and Go Doo-young are dating. Looks happy.","text":"Jeong Ye Eun và Go Doo Young đang hẹn hò. Có vẻ hạnh phúc.\n정예은과 고두영이 데이트 중이다. 행복해 보인다.\nJeong Ye-eun and Go Doo-young are dating. Looks happy.","sourceUid":"nar-mrrui4wo-d5hvhp","sourceNo":"N503","viRanges":[],"koRanges":[]},{"id":636,"readerNo":637,"displayNo":"N504","n":"N504","kind":"narration","type":"narration","vi":"Họ mua thức ăn đường phố và cho nhau ăn, còn Go Doo-young đùa giỡn bằng cách véo vào sườn Jeong Ye-eun.","ko":"길거리 음식을 사서 서로 먹여주기도 하고 고두영이 정예은의 옆구리를 꼬집으며 장난을 친다.","en":"They buy street food and feed each other, and Go Doo-young jokes around by pinching Jeong Ye-eun's side.","text":"Họ mua thức ăn đường phố và cho nhau ăn, còn Go Doo-young đùa giỡn bằng cách véo vào sườn Jeong Ye-eun.\n길거리 음식을 사서 서로 먹여주기도 하고 고두영이 정예은의 옆구리를 꼬집으며 장난을 친다.\nThey buy street food and feed each other, and Go Doo-young jokes around by pinching Jeong Ye-eun's side.","sourceUid":"nar-mrrui61g-nfv0o2","sourceNo":"N504","viRanges":[],"koRanges":[]},{"id":637,"readerNo":638,"displayNo":"N505","n":"N505","kind":"narration","type":"narration","vi":"Có vẻ như họ đang chế giễu việc .나 외롭다고...","en":"Won't you hurry up? It's coming now. It was really dangerous last night... I almost called my lover. To ask him to come... that I am lonely.","text":"Có nhanh lên không? Vâng, đến ngay đây ạ. Hôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. Kêu anh ấy đến nhà… vì tôi cô đơn.\n빨리 안 가지고 와! 아 네, 지금 갑니다 어젯밤엔 진짜 위험했어요 하마터면 애인한테 전화할 뻔했다니까요... 좀 와달라고...나 외롭다고...\nWon't you hurry up? It's coming now. It was really dangerous last night... I almost called my lover. To ask him to come... that I am lonely.","sourceUid":"merged-mrpxd363-94","sourceNo":355,"viRanges":[{"start":2468.920626,"end":2488.020049}],"koRanges":[{"start":2424.81609,"end":2445.967564}]},{"id":794,"readerNo":795,"displayNo":508,"n":508,"kind":"sub","type":"merged","vi":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]","ko":"[테마 음악 끝] [클래식 배경 음악 시작]","en":"[Theme music ends] [Classic background music starts]","text":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]\n[테마 음악 끝] [클래식 배경 음악 시작]\n[Theme music ends] [Classic background music starts]","sourceUid":"merged-mrpx51kf-85","sourceNo":508,"viRanges":[],"koRanges":[]},{"id":795,"readerNo":796,"displayNo":513,"n":513,"kind":"sub","type":"merged","vi":"[Nhạc nền cổ điển kết thúc]","ko":"[클래식 배경 음악 끝]","en":"[Classic background music ends]","text":"[Nhạc nền cổ điển kết thúc]\n[클래식 배경 음악 끝]\n[Classic background music ends]","sourceUid":"ko-mrob2li9-1037","sourceNo":513,"viRanges":[],"koRanges":[]},{"id":796,"readerNo":797,"displayNo":369,"n":369,"kind":"sub","type":"merged","vi":"Chết mất thôi. Tôi cứ liên tục như vậy từ khi dọn ra. Giấc mơ thế nào?","ko":"아주 죽겠어요\n이사 가고 나서 부터 계속 꾸는데...\n어떤 꿈인데?","en":"It's really killing me,\nit's been every day since I moved.\nWhat kind of dream is it?","text":"Chết mất thôi. Tôi cứ liên tục như vậy từ khi dọn ra. Giấc mơ thế nào?\n아주 죽겠어요\n이사 가고 나서 부터 계속 꾸는데...\n어떤 꿈인데?\nIt's really killing me,\nit's been every day since I moved.\nWhat kind of dream is it?","sourceUid":"merged-mrpxp8sy-111"," koRanges":[]},{"id":806,"readerNo":807,"displayNo":"N654","n":"N654","kind":"narration","type":"narration","vi":"Mới đêm qua thôi, anh ấy còn nói ‘Em ở lại nhé!’ như thể sắp bóp chết nó ngay lập tức.","ko":"어젯밤만 해도 당장 짜를 것처럼 ‘너 남아!!’","en":"Just last night, he said, ‘You stay!!’ as if he was going to squeeze it right away.","text":"Mới đêm qua thôi, anh ấy còn nói ‘Em ở lại nhé!’ như thể sắp bóp chết nó ngay lập tức.\n어젯밤만 해도 당장 짜를 것처럼 ‘너 남아!!’\nJust last night, he said, ‘You stay!!’ as if he was going to squeeze it right away.","sourceUid":"nar-mrrxjw8q-rcpwy7","sourceNo":"N654","viRanges":[],"koRanges":[]},{"id":807,"readerNo":808,"displayNo":"N655","n":"N655","kind":"narration","type":"narration","vi":"(Lợi ích của Yoon Jin-myeong dường như là bất lợi của anh ấy)","ko":"(윤진명의 이익이 자기의 불이익인 것 같다)","en":"(Yoon Jin-myeong’s benefit seems to be his disadvantage)","text":"(Lợi ích của Yoon Jin-myeong dường như là bất lợi của anh ấy)\n(윤진명의 이익이 자기의 불이익인 것 같다)\n(Yoon Jin-myeong’s benefit seems to be his disadvantage)","sourceUid":"nar-mrrxygjl-k3okwq","sourceNo":"N655","viRanges":[],"koRanges":[]},{"id":808,"readerNo":809,"displayNo":519,"n":519,"kind":"sub","type":"merged","vi":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.","ko":"(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...","en":"It is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","text":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.\n(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...\nIt is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","sourceUid":"merged-mrpx7cem-91","sourceNo":519,"viRanges":[{"start":2438.445204,"end":2452.464267}],"koRanges":[{"start":2395.908194,"end":2408.37535}]},{"id":809,"readerNo":810,"displayNo":523,"n":523,"kind":"sub","type":"merged","vi":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.","ko":"걔는 가만히 서 가지고 계산 띡띡하고 7천 500원이면... 아이! 근데 네가 왜 화를 내냐고? 새로 온 애가 버벅대니까 나만 힘들잖아... 아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다","en":"She gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","text":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.\n걔는 가만히 서 가지고 계산 띡띡하고 7천 500원이면... 아이! 근데 네가 왜 화를 내냐고? 새로 온 애가 버벅대니까 나만 힘들잖아... 아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다\nShe gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","sourceUid":"merged-mrpxddi4-95","sourceNo":523,"viRanges":[{"start":2452.464267,"end":2468.920626},{"start":2452.464267,"end":2466.502504}],"koRanges":[{"start":2408.37535,"end":2424.81609}]},{"id":810,"readerNo":811,"displayNo":"N656","n":"N656","kind":"narration","type":"narration","vi":". Quán bar (đêm)","ko":". 바(밤)","en":". Bar (night)","text":". Quán bar (đêm)\n. 바(밤)\n. Bar (night)","sourceUid":"nar-mrrxz3u6-n3nr6c","sourceNo":"N656","viRanges":[],"koRanges":[]},{"id":811,"readerNo":812,"displayNo":"N657","n":"N657","kind":"narration","type":"narration","vi":"Kang Ina đang ngồi một mình ở quầy bar.","ko":"강이나가 혼자 바에 앉아 있다.","en":"Kang Ina is sitting alone at the bar.","text":"Kang Ina đang ngồi một mình ở quầy bar.\n강이나가 혼자 바에 앉아 있다.\nKang Ina is sitting alone at the bar. .\nKang Ina and Oh Jong-gyu sitting across from each other at the table.","sourceUid":"nar-mrry0im0-cyy68o","sourceNo":"N666","viRanges":[],"koRanges":[]},{"id":821,"readerNo":822,"displayNo":"N667","n":"N667","kind":"narration","type":"narration","vi":"Kang Ina say rượu.","ko":"강이나는 취했다.","en":"Kang Ina was drunk.","text":"Kang Ina say rượu.\n강이나는 취했다.\nKang Ina was drunk.","sourceUid":"nar-mrry0kss-px06v5","sourceNo":"N667","viRanges":[],"koRanges":[]},{"id":822,"readerNo":823,"displayNo":"N668","n":"N668","kind":"narration","type":"dialogue","vi":"Kang Ina: Đêm qua thực sự rất nguy hiểm.","ko":"강이나: 어젯밤엔 진짜 위험했어요.","en":"Kang Ina: It was really dangerous last night.","text":"Kang Ina: Đêm qua thực sự rất nguy hiểm.\n강이나: 어젯밤엔 진짜 위험했어요.\nKang Ina: It was really dangerous last night.","sourceUid":"nar-mrry0mes-s4unvl","sourceNo":"N668","viRanges":[],"koRanges":[]},{"id":823,"readerNo":824,"displayNo":"375","n":"375","kind":"sub","type":"merged","vi":"Là thế này. Tôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước. Giống mắt người,\nnhưng cũng giống mắt thú… Đôi mắt ấy xa dần… nhưng vẫn nhìn theo tôi cho đến cùng.","ko":"그게요... 내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고... 짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서... 끝까지 날 쳐다보는데...","en":"That is... I fell into water... It's completely dark.\nSomebody is looking at me in the water. It looks like human eyes, or maybe an animal's...\nThose eyes are going away slowly... but they keep staring at me.","text":"Là thế này. Tôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước. Giống mắt người,\nnhưng cũng giống mắt thú… Đôi mắt ấy xa dần… nhưng vẫn nhìn theo tôi cho đến cùng.\n그게요... 내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고... 짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서... 끝까지 날 쳐다보는데...\nThat is... I fell into water... It's completely dark.\nSomebody is looking at me in the water. It looks like human eyes, or maybe an animal's...\nThose eyes are going away slowly... but they keep staring at me.","sourceUid":"merged-mrpxrclp-112","sourceNo":375,"viRanges":[],"koRanges":[{"start":2485.051017,"end":2518.441312}]},{"id":824,"readerNo":825,"displayNo":528,"n":528,"kind":"sub","type":"merged","vi":"[nhạc jazz bắt đầu]","ko":"[재즈 음악 시작]","en":"[jazz music starts]","text":"[nhạc jazz bắt đầu]\n[재즈 음악 시작]\n[jazz music starts]","sourceUid":"ko-mrob2li9-1052","sourceNo":528,"viRanges":[],"koRanges":[]},{"id":825,"readerNo":826,"displayNo":"N669","n":"N669","kind":"narration","type":"dialogue","vi":"Oh Jong-gyu: (nhìn chằm chằm vào Kang Ina)...","ko":"오종규: (강이나를 노려본다)···.","en":"Oh Jong-gyu: (glaring at Kang Ina)...","text":"Oh Jong-gyu: (nhìn chằm chằm vào Kang Ina)...\n오종규: (강이나를 노려본다)···.\nOh Jong-gyu: (glaring at Kang Ina)...","sourceUid":"nar-mrry2kgq-u36u9x","sourceNo":"N669","viRanges":[],"koRanges":[]},{"id":826,"readerNo":827,"displayNo":"N670","n":"N670","kind":"narration","type":"dialogue","vi":"Kang Ina: (nhìn chằm chằm vào ly rượu)","ko":"강이나: (술잔을 응시한 채로)","en":"Kang Ina: (while staring at the glass of wine)","text":"Kang Ina: (nhìn chằm chằm vào ly rượu)\n강이나: (술잔을 응시한 채로)\nKang Ina: (while staring at the glass of wine)","sourceUid":"nar-mrry2m6l-3ogt8b","sourceNo":"N670","viRanges":[],"koRanges":[]},{"id":827,"readerNo":828,"displayNo":"N671","n":"N671","kind":"narration","type":"narration","vi":"(Đột nhiên ngẩng đầu lên và nhìn thấy Jong-gyu Oh)","ko":"(갑자기 고개를 들어 오종규를 본다)","en":"(Suddenly raises his head and sees Jong-gyu Oh)","text":"(Đột nhiên ngẩng đầu lên và nhìn thấy Jong-gyu Oh)\n(갑자기 고개를 들어 오종규를 본다)\n(Suddenly raises his head and sees Jong-gyu Oh)","sourceUid":"nar-mrry4kvp-eaku10","sourceNo":"N671","viRanges":[],"koRanges":[]},{"id":828,"readerNo":829,"displayNo":"N672","n":"N672","kind":"narration","type":"dialogue","vi":"Oh Jong-gyu: (Đột nhiên Kang Ina trở nên lo lắng, có lẽ vì cô ấy đang nhìn lại chính mình hoặc vì lời nói của Kang Ina)...","ko":"오종규: (갑자기 강이나가 자신을 봐서인지 아니면 강이나의 말 때문인 a seesaw. If I go up, my partner goes down.\nIf one begs,","text":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.\n전화하면 안 되는 건가? 바보 당연히 안 되죠 남녀관계라는 건요... 시소 같은 거예요 내가 올라가면 상대방은 내려가게 돼 있어요\nCan you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","sourceUid":"merged-mrpxj2yb-109","sourceNo":539,"viRanges":[{"start":2488.020049,"end":2505.017636}],"koRanges":[{"start":2445.967564,"end":2463.074866}]},{"id":831,"readerNo":832,"displayNo":383,"n":383,"kind":"sub","type":"merged","vi":"Để tôi đi vệ sinh.","ko":"나 잠깐 화장실 좀...","en":"I need to go to the toilet.","text":"Để tôi đi vệ sinh.\n나 잠깐 화장실 좀...\nI need to go to the toilet.","sourceUid":"merged-mrpxwsrx-117","sourceNo":383,"viRanges":[{"start":2564.859597,"end":2590.427621}],"koRanges":[{"start":2546.041131,"end":2547.852287}]},{"id":832,"readerNo":833,"displayNo":"N673","n":"N673","kind":"narration","type":"narration","vi":". Phòng tắm quầy bar (đêm)","ko":". 바 화장실(밤)","en":". Bar restroom (night)","text":". Phòng tắm quầy bar (đêm)\n. 바 화장실(밤)\n. Bar restroom (night)","sourceUid":"nar-mrry6g9p-4qqwf9","sourceNo":"N673","viRanges":[],"koRanges":[]},{"id":833,"readerNo":834,"displayNo":"N674","n":"N674","kind":"narration","type":"narration","vi":"Oh Jong-gyu rửa mặt. Hãy giết chết cảm xúc của bạn bằng vài hơi thở sâu.","ko":"오종규가 세수를 한다. 몇 번의 심호흡으로 감정을 죽인다.","en":"Oh Jong-gyu washes his face. Kill your emotions with a few deep breaths.","text":"Oh Jong-gyu rửa mặt. Hãy giết chết cảm xúc của bạn bằng vài hơi thở sâu.\n오종규가 세수를 한다. 몇 번의 심호흡으로 감정을 죽인다.\nOh Jong-gyu washes his face. Kill your emotions with a few deep breaths.","sourceUid":"nar-mrry6gy6-7tbsc1","sourceNo":"N674","viRanges":[],"koRanges":[]},{"id":834,"readerNo":835,"displayNo":"N675","n":"N675","kind":"narration","type":"narration","vi":". Quán bar (đêm)","ko":". 바(밤)","en":". Bar (nig ... 나도 별로야... 너무 평범해\n그치이? 너어어무 평범해\nI'm not so sure. About what? My feeling's all over the place...\nMe too. You? I am not so sure either. Right? I didn't like her much. Too ordinary.","sourceUid":"merged-mrqh3uqw-2","sourceNo":678,"viRanges":[{"start":3199.266582,"end":3227.393196}],"koRanges":[{"start":3160.358095,"end":3184.358821}]},{"id":950,"readerNo":951,"displayNo":"682","n":"682","kind":"sub","type":"merged","vi":"Đúng rồi, quá là bình thường ấy, không mặn tẹo nào.\nCũng phải có lúc này lúc kia,\nthỉnh thoảng nói dối, rồi sống náo nhiệt lên tí.","ko":"그치? 재미가 없어... 사람이 좀, 응? 들쑥날쑥하고, 응?\n거짓말도 좀 할 거 같고 인생이 좀... 말이야... 응? 다이나믹하게...","en":"Yeah, too ordinary, no fun.\nSometimes, ups and downs\nand bits of lies make our life dynamic.","text":"Đúng rồi, quá là bình thường ấy, không mặn tẹo nào.\nCũng phải có lúc này lúc kia,\nthỉnh thoảng nói dối, rồi sống náo nhiệt lên tí.\n그치? 재미가 없어... 사람이 좀, 응? 들쑥날쑥하고, 응?\n거짓말도 좀 할 거 같고 인생이 좀... 말이야... 응? 다이나믹하게...\nYeah, too ordinary, no fun.\nSometimes, ups and downs\nand bits of lies make our life dynamic.","sourceUid":"merged-mrqhc9o8-4","sourceNo":682,"viRanges":[{"start":3227.393196,"end":3239.472893}],"koRanges":[{"start":3184.358821,"end":3196.922773}]},{"id":951,"readerNo":952,"displayNo":"N761","n":"N761","kind":"narration","type":"dialogue","vi":"Jinmyeong Yoon: (Tôi đang cười và điện thoại của tôi đổ chuông. Là 'Mẹ.'","ko":"윤진명: (피식 웃는데 핸드폰이 울린다. ‘엄마’다.","en":"Jinmyeong Yoon: (I’m laughing and my phone rings. It’s ‘Mom.’","text":"Jinmyeong Yoon: (Tôi đang cười và điện thoại của tôi đổ chuông. Là 'Mẹ.'\n윤진명: (피식 웃는데 핸드폰이 울린다. ‘엄마’다.\nJinmyeong Yoon: (I’m laughing and my phone rings. It’s ‘Mom.’","sourceUid":"nar-mrryvivq-6r7zyt","sourceNo":"N761","viRanges":[],"koRanges":[]},{"id":952,"readerNo":953,"displayNo":"N762","n":"N762","kind":"narration","type":"narration","vi":"Mặt tôi cứng lại. Trả lời điện thoại) Xin chào.","ko":"얼굴이 굳는다. 전화 받는다) 여보세요.","en":"My face hardens. Answering the phone) Hello.","text":"Mặt t let idx=0,stop=false,viUrl='',koUrl='',unlocked=false,token=0;
const $=id=>document.getElementById(id);
const engine=()=>$('engine');
function toggleSettings(){const p=$('settingsPanel');if(p)p.classList.toggle('show')}
let audioCtx=null,gainNode=null,mediaSource=null,engineKind='vi';
const VOL_KEY='master_reader_volume_'+String(project.githubSlug||project.title||'reader').replace(/[^A-Za-z0-9._-]+/g,'_');

function esc2(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function fmt(t){t=Number(t||0);let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000);if(ms>=1000){s++;ms-=1000}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+String(ms).padStart(3,'0')}
function rangeLabel(arr){if(!arr||!arr.length)return '';let a=arr[0],b=arr[arr.length-1];return fmt(a.start)+' → '+fmt(b.end)+(arr.length>1?' x'+arr.length:'')}
function hasRange(k,b){let arr=k==='vi'?b.viRanges:b.koRanges;return !!(arr&&arr.length)}
function folderPath(){let f=String(project.audioFolder||'audio').trim();while(f.endsWith('/'))f=f.slice(0,-1);return f||'audio'}
function pathFor(k){let folder=folderPath();let file=k==='vi'?project.viAudioFile:project.koAudioFile;if(!file)return '';if(file.startsWith('http://')||file.startsWith('https://'))return file;if(folder==='.'||folder==='')return './'+file;if(folder.startsWith('../')||folder.startsWith('./'))return folder+'/'+file;return './'+folder+'/'+file}
function clampVol(v){v=Number(v);if(!Number.isFinite(v))v=100;return Math.max(0,Math.min(200,v))}
function loadVolSettings(){try{return JSON.parse(localStorage.getItem(VOL_KEY)||'{}')||{}}catch(e){return {}}}
function saveVolSettings(){try{localStorage.setItem(VOL_KEY,JSON.stringify({vi:clampVol($('viVol')?.value||100),ko:clampVol($('koVol')?.value||100)}))}catch(e){}}
function volValue(k){return clampVol($(k+'Vol')?.value||100)}
function ensureGain(){
  try{
    const a=engine();
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!mediaSource){
      mediaSource=audioCtx.createMediaElementSource(a);
      gainNode=audioCtx.createGain();
      mediaSource.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function applyVisibleVolume(k){
  const v=volValue(k), label=$(k+'VolLabel');
  if(label)label.textContent=Math.round(v)+'%';
}
function applyEngineVolume(k){
  engineKind=k||engineKind||'vi';
  const v=volValue(engineKind), a=engine();
  const ok=ensureGain();
  if(ok&&gainNode){a.volume=1;gainNode.gain.value=v/100}
  else a.volume=Math.min(1,v/100);
  applyVisibleVolume(engineKind);
}
function setReaderVolume(k,v,persist=true){
  const slider=$(k+'Vol');
  if(slider)slider.value=String(clampVol(v));
  applyVisibleVolume(k);
  if(engineKind===k)applyEngineVolume(k);
  if(persist)saveVolSettings();
}
function initReaderVolumeControls(){
  const saved=loadVolSettings();
  ['vi','ko'].forEach(k=>{
    const slider=$(k+'Vol');
    const val=clampVol(saved[k]??100);
    if(slider){
      slider.value=String(val);
      slider.oninput=()=>setReaderVolume(k,slider.value,true);
      slider.onchange=()=>setReaderVolume(k,slider.value,true);
    }
    setReaderVolume(k,val,false);
  });
}
function loadPaths(){viUrl=pathFor('vi');koUrl=pathFor('ko');applyVisibleVolume('vi');applyVisibleVolume('ko');$('audioInfo').textContent='Paths: '+viUrl+' | '+koUrl}
function showAudioPaths(){alert('VI: '+viUrl+'\nKO: '+koUrl+'\n\nNếu đặt reader trong thư mục subtitle-master, audio folder thường là ../audio.')}
function loadLocal(k,f){if(!f)return;if(k==='vi')viUrl=URL.createObjectURL(f);else koUrl=URL.createObjectURL(f);applyVisibleVolume(k);$('audioInfo').textContent='Loaded local '+k+': '+f.name}
function toggleAudio(){toggleSettings()}

function badgeHtml(b){
  const vi=hasRange('vi',b)?'<span class="badge vi timingBadge">VI '+rangeLabel(b.viRanges)+'</span>':'<span class="badge no">No VI</span>';
  const ko=hasRange('ko',b)?'<span class="badge vi timingBadge">KO '+rangeLabel(b.koRanges)+'</span>':'<span class="badge no">No KO</span>';
  const type=b.kind==='narration'?'<span class="badge narr">Narration</span>':'<span class="badge">Cue</span>';
  return '<div class="badges">'+type+vi+ko+'</div>';
}
function render(){
  const q=($('q').value||'').toLowerCase();
  let h='';
  project.blocks.forEach(function(b,i){
    const hay=[b.vi,b.ko,b.en,b.text,b.displayNo,b.sourceNo].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return;
    const title=(b.kind==='narration'?'Narration #':'Cue #')+(b.displayNo||b.sourceNo||i+1);
    h+='<div class="item '+(b.kind==='narration'?'narr':'')+' '+(i===idx?'active':'')+'" onclick="idx='+i+';render()">';
    h+='<div class="meta"><span>'+esc2(title)+'</span><span>'+(i===idx?'SELECTED':'')+'</span></div>';
    h+=badgeHtml(b);
    h+='<div class="txt">'+(b.vi?'<div>'+esc2(b.vi)+'</div>':'')+(b.ko?'<div class="ko">'+esc2(b.ko)+'</div>':'')+(b.en?'<div class="en">'+esc2(b.en)+'</div>':'')+'</div>';
    h+='<div class="row" style="margin-top:8px"><button onclick="event.stopPropagation();idx='+i+';readKoCurrent()">Read KO</button><button class="good" onclick="event.stopPropagation();idx='+i+';playCurrent(\'vi\')">VI Dub</button><button class="violet" onclick="event.stopPropagation();idx='+i+';playCurrent(\'ko\')">KO Live</button><button class="warn" onclick="event.stopPropagation();idx='+i+';playCueMode()">VI→VI→KO→KO</button></div>';
    h+='</div>';
  });
  $('list').innerHTML=h||'<div class="item">Không có cue phù hợp.</div>';
  const viCount=project.blocks.filter(b=>hasRange('vi',b)).length, koCount=project.blocks.filter(b=>hasRange('ko',b)).length;
  $('stat').textContent=project.blocks.length+' blocks · VI '+viCount+' · KO '+koCount+' · current '+(idx+1);
}
function cur(){return project.blocks[idx]||{}}
function prev(){idx=Math.max(0,idx-1);render();scrollActive()}
function next(){idx=Math.min(project.blocks.length-1,idx+1);render();scrollActive()}
function scrollActive(){document.querySelector('.item.active')?.scrollIntoView({block:'center',behavior:'smooth'})}
function stopAll(){stop=true;token++;engine().pause();try{speechSynthesis.cancel()}catch(e){}}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function waitMedia(a,timeout){timeout=timeout||6000;return new Promise(res=>{if(a.readyState>=1)return res(true);let done=false;function ok(){if(done)return;done=true;clean();res(true)}function bad(){if(done)return;done=true;clean();res(false)}function clean(){a.removeEventListener('loadedmetadata',ok);a.removeEventListener('canplay',ok);a.removeEventListener('error',bad);clearTimeout(to)}a.addEventListener('loadedmetadata',ok,{once:true});a.addEventListener('canplay',ok,{once:true});a.addEventListener('error',bad,{once:true});let to=setTimeout(bad,timeout)})}
async function unlockAudio(){try{let a=engine();let src=viUrl||koUrl||pathFor('vi')||pathFor('ko');if(!src){alert('Chưa có audio path.');return false}if(a.src!==new URL(src,location.href).href){a.src=src;a.load();await waitMedia(a,5000)}let vol=a.volume;a.volume=0.001;await a.play();a.pause();a.volume=vol||1;applyEngineVolume(engineKind||'vi');unlocked=true;$('audioInfo').textContent+=' | unlocked';return true}catch(e){alert('iPhone chưa cho unlock audio. Bấm lại Unlock iPhone Audio. '+(e.message||e));return false}}
function playRange(src,r,myToken,k){
  return new Promise(async res=>{
    if(!src||!r){res(false);return}
    const a=engine();stop=false;
    try{
      const abs=new URL(src,location.href).href;
      if(a.src!==abs){a.pause();a.src=src;a.load();await waitMedia(a,7000)}
      applyEngineVolume(k||'vi');
      a.currentTime=Math.max(0,Number(r.start)||0);
      const end=Math.max(Number(r.end)||0,(Number(r.start)||0)+.2);
      function finish(ok){a.removeEventListener('timeupdate',tick);a.removeEventListener('ended',ended);a.removeEventListener('error',err);res(ok)}
      function tick(){if(stop||myToken!==token){a.pause();finish(false);return}if(a.currentTime>=end-0.03){a.pause();finish(true)}}
      function ended(){finish(true)} function err(){finish(false)}
      a.addEventListener('timeupdate',tick);a.addEventListener('ended',ended,{once:true});a.addEventListener('error',err,{once:true});
      await a.play();
    }catch(e){$('audioInfo').textContent='Không phát được audio: '+(e.message||e)+' | '+src;res(false)}
  })
}
async function playAudioKind(k,myToken){
  const b=cur();const ranges=k==='vi'?b.viRanges:b.koRanges;const src=k==='vi'?viUrl:koUrl;
  if(!ranges||!ranges.length)return false;
  let any=false;
  for(const r of ranges){if(stop||myToken!==token)break;let ok=await playRange(src,r,myToken,k);any=any||ok}
  return any;
}
async function playCurrent(k){const my=++token;stop=false;const ok=await playAudioKind(k,my);if(!ok)await readKoCurrent()}

function getBestVoice(lang){
  try{
    const voices=speechSynthesis.getVoices()||[];
    const prefix=String(lang||'').slice(0,2).toLowerCase();
    const scored=voices.map(v=>{
      const hay=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      let score=0;
      if((v.lang||'').toLowerCase().startsWith(prefix))score+=100;
      if(lang==='ko-KR' && /ko|korean|한국|yuna|siri|google|microsoft|samsung|premium|enhanced/.test(hay))score+=60;
      if(lang==='vi-VN' && /vi|vietnam|tiếng việt|vietnamese|google|microsoft|premium|enhanced/.test(hay))score+=60;
      if(v.localService)score+=5;
      return {v,score};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    return scored[0]?.v||null;
  }catch(e){return null}
}
function readTts(text,lang,myToken,rate){
  return new Promise(res=>{
    text=String(text||'').trim();
    if(!text){res(false);return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.slice(0,1200));
      u.lang=lang;
      u.rate=rate||1;
      u.pitch=1;
      const v=getBestVoice(lang); if(v)u.voice=v;
      let done=false;
      function finish(ok){if(done)return;done=true;res(ok)}
      u.onend=()=>finish(true);u.onerror=()=>finish(false);
      speechSynthesis.speak(u);
      setTimeout(()=>{if(myToken!==token){speechSynthesis.cancel();finish(false)}},50);
    }catch(e){res(false)}
  })
}
function readKo(text,myToken){return readTts(text,'ko-KR',myToken,0.88)}
function readVi(text,myToken){return readTts(text,'vi-VN',myToken,0.95)}
function readKoCurrent(){const my=++token;stop=false;return readKo(cur().ko||cur().text||'',my)}
function readViCurrent(){const my=++token;stop=false;return readVi(cur().vi||'',my)}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices()}catch(e){}}}

async function playByModeForCurrent(mode,my){
  const b=cur();
  const hasVi=hasRange('vi',b), hasKo=hasRange('ko',b);
  if(mode==='vi-readvi-readko-ko'){
    if(hasVi) await playAudioKind('vi',my); else await readVi(b.vi||'',my);
    if(stop||my!==token)return;
    await readKo(b.ko||b.text||'',my);
    if(stop||my!==token)return;
    if(hasKo) await playAudioKind('ko',my);
  }else if(mode==='vi-readko-ko'){
    if(hasVi) await playAudioKind('vi',my);
    if(stop||my!==token)return;
    await readKo(b.ko||b.text||'',my);
    if(stop||my!==token)return;
    if(hasKo) await playAudioKind('ko',my);
  }else if(mode==='vi-ko'){
    if(hasVi)await playAudioKind('vi',my);
    if(stop||my!==token)return;
    if(hasKo)await playAudioKind('ko',my);
    else if(!hasVi)await readKo(b.ko||b.text||'',my);
  }else if(mode==='vi'){
    const ok=await playAudioKind('vi',my);
    if(!ok)await readVi(b.vi||'',my);
  }else if(mode==='ko'){
    const ok=await playAudioKind('ko',my);
    if(!ok)await readKo(b.ko||b.text||'',my);
  }else if(mode==='readko'){
    await readKo(b.ko||b.text||'',my);
  }
}
async function playCueMode(){
  const my=++token;stop=false;
  await playByModeForCurrent($('mode').value,my);
}
async function smart(){
  stop=false;const my=++token;
  const mode=$('mode').value;
  if((mode==='vi-readko-ko'||mode==='vi-readvi-readko-ko')&&!unlocked&&/iPad|iPhone|iPod/.test(navigator.userAgent)){await unlockAudio()}
  for(;idx<project.blocks.length&&my===token&&!stop;idx++){
    render();scrollActive();
    await playByModeForCurrent(mode,my);
    if(stop||my!==token)break;
  }
}
initReaderVolumeControls();loadPaths();render();
