19},{"id":103,"readerNo":104,"displayNo":328,"n":328,"type":"narration","vi":"Đêm rồi nên chắc cà phê không được.\n- Của anh 2.300 won. - Vâng.\nMột trong hai, em uống cái nào?","ko":"아... 밤에 커피는 좀 그러니까 ,300원입니다 넵 둘 중에... 뭐 마실래요?","en":"It's too late to drink coffee.\n-2,300 won please. -Okay.\nWhich one do you want?","text":"Đêm rồi nên chắc cà phê không được.\n- Của anh 2.300 won. - Vâng.\nMột trong hai, em uống cái nào?\n아... 밤에 커피는 좀 그러니까 ,300원입니다 넵 둘 중에... 뭐 마실래요?\nIt's too late to drink coffee.\n-2,300 won please. -Okay.\nWhich one do you want?","sourceUid":"merged-mrp4pp4t-173","sourceNo":328},{"id":104,"readerNo":105,"displayNo":335,"n":335,"type":"narration","vi":"Nay em sẽ đi chợ. Có ai muốn đi không ạ? Em đi một mình đi… Mua hộ chị băng vệ sinh được không? Có ai cần thêm gì không ạ? Cái tủ lạnh trống trơn đấy…","ko":"(정예은) 오늘 장 보러 갈 건데\n같이 가실 분 있어요?\n(송지원) 너 혼자 가...\n(정예은) 나는 생리대 소형 사다 줄래?\n(정예은) 예은 언니 말고 다른 거 필요한 분 있어요?\n(강이나) 냉장고 텅 비었더라...","en":"I'm going to the market today. Anybody wants to join? Go by yourself... Can you buy me a pad? Anyone else needs something? The fridge is empty...","text":"Nay em sẽ đi chợ. Có ai muốn đi không ạ? Em đi một mình đi… Mua hộ chị băng vệ sinh được không? Có ai cần thêm gì không ạ? Cái tủ lạnh trống trơn đấy…\n(정예은) 오늘 장 보러 갈 건데\n같이 가실 분 있어요?\n(송지원) 너 혼자 가...\n(정예은) 나는 생리대 소형 사다 줄래?\n(정예은) 예은 언니 말고 다른 거 필요한 분 있어요?\n(강이나) 냉장고 텅 비었더라...\nI'm going to the market today. Anybody wants to join? Go by yourself... Can you buy me a pad? Anyone else needs something? The fridge is empty...","sourceUid":"merged-mrp4rg3p-177","sourceNo":335},{"id":105,"readerNo":106,"displayNo":339,"n":339,"type":"narration","vi":"Chắc cậu giàu lắm hả? Suốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? Tớ thật sự không phải người như thế.","ko":"(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜","en":"Do you have so much money? It wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","text":"Chắc cậu giàu lắm hả? Suốt ngày ăn bám để mua quà cho bạn trai? Tớ thế bao giờ? Tớ thật sự không phải người như thế.\n(송지원) 돈이 차고 넘치니\n남친 선물한다고 맨날 빌붙어놓고\n(정예은) 내가 또 언제 그랬다고!\n나 그런 사람 아니다, 진짜\nDo you have so much money? It wasn't too long ago you were borrowing.\nWhen did I borrow? That's not who I am!","sourceUid":"merged-mrp4u1hi-184","sourceNo":339},{"id":106,"readerNo":107,"displayNo":343,"n":343,"type":"narration","vi":"Không phải cái khỉ gió. Thế hôm nay cậu đãi thịt đi. Hôm nay em cứ mua đồ em cần thôi, lúc sau tính quỹ chung rồi mua.","ko":"(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴! (윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사","en":"Says who?\nThen you pay for dinner today.\nYou buy what you need for now,\nthen we can discuss the rest later.","text":"Không phải cái khỉ gió. Thế hôm nay cậu đãi thịt đi. Hôm nay em cứ mua đồ em cần thôi, lúc sau tính quỹ chung rồi mua.\n(송지원) 아니긴, 개뿔 그럼 오늘 네가 삼겹살 쏴! (윤진명) 오늘은 너 필요한 거만 사고 공금은 따로 정리해서 사\nSays who?\nThen you pay for dinner today.\nYou buy what you need for now,\nthen we can discuss the rest later.","sourceUid":"merged-mrp4v4wj-186","sourceNo":343},{"id":107,"readerNo":108,"displayNo":345,"n":345,"type":"narration","vi":"[Bíp bíp bíp tiếng cửa] [Tiếng đóng cửa]","ko":"[삑삑삑 문소리] [문 닫는 소리]","en":"[Beep beep beep sound of door]\n[Sound of door closing]","text":"[Bíp bíp bíp tiếng cửa] [Tiếng đóng cửa]\n[삑삑삑 문소리] [문 닫는 소리]\n[Beep beep beep sound of door]\n[Sound of door closing]","sourceUid":"merged-mrp4wkl9-190","sourceNo":345},{"id":108,"readerNo":109,"displayNo":351,"n":351,"type":"narration","vi":"Khi em nói em là sinh viên,\ntôi còn tưởng em ra vẻ nữa.\nNghĩ lại cũng đều do tôi tự ti\nvì chỉ tốt nghiệp cấp ba.\nTôi vẫn chưa hoàn thiện bản thân.","ko":"그때는... 진명 씨가 대학생이라고 해서 괜히 유세 떠는 줄 알았어요 그러고 보면... 내가 고졸인 거에 되게... 자격지심이 있었던 거죠 아직 완성이 덜 되었어요 내가...","en":"When you said you were a college student... I thought you were conceited. When I think about it, I was not confident about myself not going to college. I still need to grow.","text":"Khi em nói em là sinh viên,\ntôi còn tưởng em ra vẻ nữa.\nNghĩ lại cũng đều do tôi tự ti\nvì chỉ tốt nghiệp cấp ba.\nTôi vẫn chưa hoàn thiện bản thân.\n그때는... 진명 씨가 대학생이라고 해서 괜히 유세 떠는 줄 알았어요 그러고 보면... 내가 고졸인 거에 되게... 자격지심이 있었던 거죠 아직 완성이 덜 되었어요 내가...\nWhen you said you were a college student... I thought you were conceited. When I think about it, I was not confident about myself not going to college. I still need to grow.","sourceUid":"merged-mrp4vzyr-188","sourceNo":351},{"id":109,"readerNo":110,"displayNo":359,"n":359,"type":"narration","vi":"Em đưa tay đây.\nSao không?\nEm coi nó là dây buộc thôi sao?\nCái này là nhẫn đó.\nĐưa tay đây nào.","ko":"손 줘 봐요 아, 왜요... 이게 지금 빵 끈으로 보여요? 이거 절대반집니다 손 줘봐요 어서요","en":"Let me see your hand.\nWhy?\nDoes this look like a bread tie?\nThis is absolutely a ring,\ngive me your hand.","text":"Em đưa tay đây.\nSao không?\nEm coi nó là dây buộc thôi sao?\nCái này là nhẫn đó.\nĐưa tay đây nào.\n손 줘 봐요 아, 왜요... 이게 지금 빵 끈으로 보여요? 이거 절대반집니다 손 줘봐요 어서요\nLet me see your hand.\nWhy?\nDoes this look like a bread tie?\nThis is absolutely a ring,\ngive me your hand.","sourceUid":"merged-mrp4xo64-192","sourceNo":359},{"id":110,"readerNo":111,"displayNo":360,"n":360,"type":"narration","vi":"Từ giờ em sẽ thành Gollum.","ko":"이제 진명 씨는 골룸이 될 거예요","en":"Now, Jin-Myung Yoon will become Gollum.","text":"Từ giờ em sẽ thành Gollum.\n이제 진명 씨는 골룸이 될 거예요\nNow, Jin-Myung Yoon will become Gollum.","sourceUid":"merged-mrp4xuj8-193","sourceNo":360},{"id":111,"readerNo":112,"displayNo":363,"n":363,"type":"narration","vi":"[Tiếng đóng cửa] [Tắt đèn]","ko":"[문 닫는 소리] [불 끈다]","en":"[Sound of door closing] [Turns off lights]","text":"[Tiếng đóng cửa] [Tắt đèn]\n[문 닫는 소리] [불 끈다]\n[Sound of door closing] [Turns off lights]","sourceUid":"merged-mrp4y478-194","sourceNo":363},{"id":112,"readerNo":113,"displayNo":247,"n":247,"type":"narration","vi":"Tên bạn là… Gì cơ? Lee Soo… Quê bạn ở đâu? Gyung… Gyunggi… - Tạm biệt. - Tạm biệt ạ. So với bạn ấy thì tính ra em còn tăng động.","ko":"(송지원) 이름이...\n네?\n이... 수...\n고향이 어디예요?\n경기... 평... 택...\n가세요...\n가세요\n으야...\n쟤에 비하면 넌 ADHD다","en":"Your name is...\nWhat?\nLee Soo...\nLee Soo…\nWhere are you from?\nGyung… Gyunggi…\nGyung... Gyung-gi...\n-Bye. -Bye.\nCompared to her, you have ADHD.","text":"Tên bạn là… Gì cơ? Lee Soo… Quê bạn ở đâu? Gyung… Gyunggi… - Tạm biệt. - Tạm biệt ạ. So với bạn ấy thì tính ra em còn tăng động.\n(송지원) 이름이...\n네?\n이... 수...\n고향이 어디예요?\n경기... 평... 택...\n가세요...\n가세요\n으야...\n쟤에 비하면 넌 ADHD다\nYour name is...\nWhat?\nLee Soo...\nLee Soo…\nWhere are you from?\nGyung… Gyunggi…\nGyung... Gyung-gi...\n-Bye. -Bye.\nCompared to her, you have ADHD.","sourceUid":"merged-mrp518jb-201","sourceNo":247},{"id":113,"readerNo":114,"displayNo":254,"n":254,"type":"narration","vi":"Sao tìm người ở cùng lại khó thế này?\nDo bọn mình khó tính?\nCũng đâu phải.\nBọn mình chỉ cần sạch sẽ phổ thông, lịch sự phổ thông,\nhòa đồng phổ thông thôi mà.\nCó mỗi thế thôi mà.\nHay là do con ma làm gì đó?","ko":"이렇게 하메 구하기가 힘드냐?\n우리가 까다롭나?\n그건 아니지\n우린 그저 보통의 깔끔함에 보통의 예의...\n보통의 사교성, 응...\n그거면 되는데...\n귀신이 역사를 하나?","en":"It's so hard to find a house mate.\nAre we being picky?\nThat can't be.\nWe just want average hygiene, average etiquette,\naverage sociability.\nYes, only that much.\nMaybe it's that ghost.","text":"Sao tìm người ở cùng lại khó thế này?\nDo bọn mình khó tính?\nCũng đâu phải.\nBọn mình chỉ cần sạch sẽ phổ thông, lịch sự phổ thông,\nhòa đồng phổ thông thôi mà.\nCó mỗi thế thôi mà.\nHay là do con ma làm gì đó?\n이렇게 하메 구하기가 힘드냐?\n우리가 까다롭나?\n그건 아니지\n우린 그저 보통의 깔끔함에 보통의 예의...\n보통의 사교성, 응...\n그거면 되는데...\n귀신이 역사를 하나?\nIt's so hard to find a house mate.\nAre we being picky?\nThat can't be.\nWe just want average hygiene, average etiquette,\naverage sociability.\nYes, only that much.\nMaybe it's that ghost.","sourceUid":"merged-mrpuswe9-36","sourceNo":254},{"id":114,"readerNo":115,"displayNo":386,"n":386,"type":"narration","vi":"[Nhạc chủ đề lạc quan kết thúc]\n[Nói không rõ]\n[âm thanh kỳ lạ]\n[Nhạc nền sôi động bắt đầu]\n[Tình nguyện viên hỗ trợ chữ ký hét lên]","ko":"[경쾌한 테마 음악 끝]\n[안 들리게 말한다]\n[음산한 소리]\n[경쾌한 배경 음악 시작]\n[서명 지지 봉사원들 외친다]","en":"[Upbeat theme music ends] [Speaks inaudibly] [eerie sound] [Upbeat background music starts] [Signature support volunteers shout]","text":"[Nhạc chủ đề lạc quan kết thúc]\n[Nói không rõ]\n[âm thanh kỳ lạ]\n[Nhạc nền sôi động bắt đầu]\n[Tình nguyện viên hỗ trợ chữ ký hét lên]\n[경쾌한 테마 음악 끝]\n[안 들리게 말한다]\n[음산한 소리]\n[경쾌한 배경 음악 시작]\n[서명 지지 봉사원들 외친다]\n[Upbeat theme music ends] [Speaks inaudibly] [eerie sound] [Upbeat background music starts] [Signature support volunteers shout]","sourceUid":"merged-mrpuu2zg-37","sourceNo":386},{"id":115,"readerNo":116,"displayNo":388,"n":388,"type":"dialogue","vi":"Bọn mình ký cái này đi.\nXin mọi người ký tên ủng hộ việc thay đổi luật bảo vệ động vật!\nXin hãy đến và ký tên.\nCó phim lúc 3:20, mình xin phim đó đi anh.","ko":"어! 오빠 저거 서명하러 가자 동물 보호법 개정을 요구합니다 서명 한번만 해주고 가세요! 아... 어! 3시 20분 영화 있다","en":"Let's sign that petition. Please come and support us for the new animal protection legislation. Please come and sign our petition. There is one at 3:20, let's watch that one.","text":"Bọn mình ký cái này đi.\nXin mọi người ký tên ủng hộ việc thay đổi luật bảo vệ động vật!\nXin hãy đến và ký tên.\nCó phim lúc 3:20, mình xin phim đó đi anh.\n어! 오빠 저거 서명하러 가자 동물 보호법 개정을 요구합니다 서명 한번만 해주고 가세요! 아... 어! 3시 20분 영화 있다\nLet's sign that petition. Please come and support us for the new animal protection legislation. Please come and sign our petition. There is one at 3:20, let's watch that one.","sourceUid":"merged-mrp56cae-212","sourceNo":388},{"id":116,"readerNo":117,"displayNo":389,"n":389,"type":"narration","vi":"[Các tình nguyện viên hỗ trợ chữ ký tiếp tục hét lên]","ko":"[서명 지지 봉사원들 계속 외친다]","en":"[Signature support volunteers continue to shout]","text":"[Các tình nguyện viên hỗ trợ chữ ký tiếp tục hét lên]\n[서명 지지 봉사원들 계속 외친다]\n[Signature support volunteers continue to shout]","sourceUid":"ko-mrob2li8-913","sourceNo":389},{"id":117,"readerNo":118,"displayNo":397,"n":397,"type":"narration","vi":"[Nhạc nền sôi động kết thúc]","ko":"[경쾌한 배경 음악 끝]","en":"[Upbeat background music ends]","text":"[Nhạc nền sôi động kết thúc]\n[경쾌한 배경 음악 끝]\n[Upbeat background music ends]","sourceUid":"ko-mrob2li8-921","sourceNo":397},{"id":118,"readerNo":119,"displayNo":398,"n":398,"type":"narration","vi":"Xem phim rồi ăn tối là vừa đẹp nhỉ?\nAnh sao vậy?\nNay anh không có hứng xem phim.","ko":"저거 보자, 오빠\n영화 보고 저녁 먹으면\n딱 맞겠는데...\n왜 그래, 오빠?\n오늘은 영화 볼 기분이 아니다","en":"We can watch the movie and go for dinner.\nWhat did I do wrong?\nI don't feel like watching a movie today.","text":"Xem phim rồi ăn tối là vừa đẹp nhỉ?\nAnh sao vậy?\nNay anh không có hứng xem phim.\n저거 보자, 오빠\n영화 보고 저녁 먹으면\n딱 맞겠는데...\n왜 그래, 오빠?\n오늘은 영화 볼 기분이 아니다\nWe can watch the movie and go for dinner.\nWhat did I do wrong?\nI don't feel like watching a movie today.","sourceUid":"merged-mrp588ot-214","sourceNo":398},{"id":119,"readerNo":120,"displayNo":278,"n":278,"type":"narration","vi":"Mày là thằng nào?\nThằng này là ai mà dám làm vậy với em?","ko":"아! 너 뭐야? 뭐야 이 새끼. 뭔데 너한테 이래?","en":"Who are you? Who is this jerk? Why is he treating you like this?","text":"Mày là thằng nào?\nThằng này là ai mà dám làm vậy với em?\n아! 너 뭐야? 뭐야 이 새끼. 뭔데 너한테 이래?\nWho are you? Who is this jerk? Why is he treating you like this?","sourceUid":"merged-mrp5c4au-221","sourceNo":278},{"id":120,"readerNo":121,"displayNo":400,"n":400,"type":"narration","vi":"[Tiếng xe dừng lại]","ko":"[자동차 급 정거 소리]","en":"[Sound of car stopping]","text":"[Tiếng xe dừng lại]\n[자동차 급 정거 소리]\n[Sound of car stopping]","sourceUid":"ko-mrob2li8-924","sourceNo":400},{"id":121,"readerNo":122,"displayNo":402,"n":402,"type":"narration","vi":"Kìa anh!\nXuống xe.\nAnh…","ko":"오빠? 오빠아! 내려! 오빠!","en":"Doo-Young! Get off. Anh… Doo-Young...","text":"Kìa anh!\nXuống xe.\nAnh…\n오빠? 오빠아! 내려! 오빠!\nDoo-Young! Get off. Anh… Doo-Young...","sourceUid":"merged-mrp5906e-215","sourceNo":402},{"id":122,"readerNo":123,"displayNo":411,"n":411,"type":"narration","vi":"Em đã sai gì sao?\nEm còn không biết?\nVâng…\nEm thật sự không biết.\nVậy nên em mới là con bé xấu xa đó.\nKhi ký tên, sao em lại ghi cả trường đại học?","ko":"내가 뭘 잘못했는데\n몰라서 물어?\n어...\n나 진짜 모르겠어\n그래서 네가 나쁘다는 거야 싸가지 없고...\n너 아까 서명할 때 대학은 왜 썼냐?","en":"What did I do wrong?\nDon't you know?\nYes...\nI'm really not sure.\nThat's why you are horrible.\nWhy did you write your college name on the petition?","text":"Em đã sai gì sao?\nEm còn không biết?\nVâng…\nEm thật sự không biết.\nVậy nên em mới là con bé xấu xa đó.\nKhi ký tên, sao em lại ghi cả trường đại học?\n내가 뭘 잘못했는데\n몰라서 물어?\n어...\n나 진짜 모르겠어\n그래서 네가 나쁘다는 거야 싸가지 없고...\n너 아까 서명할 때 대학은 왜 썼냐?\nWhat did I do wrong?\nDon't you know?\nYes...\nI'm really not sure.\nThat's why you are horrible.\nWhy did you write your college name on the petition?","sourceUid":"merged-mrpv5o0k-38","sourceNo":411},{"id":123,"readerNo":124,"displayNo":416,"n":416,"type":"narration","vi":"Không phải em ra vẻ vì học trường tốt hơn anh à?\nKhông phải.\nVì có ô ghi nghề nghiệp, nên…\nThế thì ghi \"sinh viên\" là được rồi!","ko":"어? 나보다 좋은 대학 다닌다고 유세 떤 거 아니야! 아니... 그건... 직업란이 있으니까 그냥 대학생이라고만 써도 됐잖아!","en":"You were trying to show off your school is better than mine. No. That's because there was a field-- You could've just written \"College student.\"","text":"Không phải em ra vẻ vì học trường tốt hơn anh à?\nKhông phải.\nVì có ô ghi nghề nghiệp, nên…\nThế thì ghi \"sinh viên\" là được rồi!\n어? 나보다 좋은 대학 다닌다고 유세 떤 거 아니야! 아니... 그건... 직업란이 있으니까 그냥 대학생이라고만 써도 됐잖아!\nYou were trying to show off your school is better than mine. No. That's because there was a field-- You could've just written \"College student.\"","sourceUid":"merged-mrp5b9mc-219","sourceNo":416},{"id":124,"readerNo":125,"displayNo":417,"n":417,"type":"narration","vi":"[Tiếng tháo dây an toàn] [Tiếng đóng cửa xe] [Tiếng mở cửa xe] [Thở dài]","ko":"[안전 벨트를 푸는 소리] [차문 닫는 소리] [차문 여는 소리] [한숨 쉰다]","en":"[Sound of unfastening seat belt] [Sound of car door closing] [Sound of car door opening] [Sighs]","text":"[Tiếng tháo dây an toàn] [Tiếng đóng cửa xe] [Tiếng mở cửa xe] [Thở dài]\n[안전 벨트를 푸는 소리] [차문 닫는 소리] [차문 여는 소리] [한숨 쉰다]\n[Sound of unfastening seat belt] [Sound of car door closing] [Sound of car door opening] [Sighs]","sourceUid":"merged-mrp5co11-223","sourceNo":417},{"id":125,"readerNo":126,"displayNo":419,"n":419,"type":"narration","vi":"Thôi, xuống xe đi.\nĐã bảo xuống xe!","ko":"됐으니까 내려\n- 내려 좀! - 아!","en":"Forget it and just get out. Just get out of here!","text":"Thôi, xuống xe đi.\nĐã bảo xuống xe!\n됐으니까 내려\n- 내려 좀! - 아!\nForget it and just get out. Just get out of here!","sourceUid":"merged-mrp5d1qu-224","sourceNo":419},{"id":126,"readerNo":127,"displayNo":425,"n":425,"type":"narration","vi":"[Thở dài] [Tiếng đóng cửa]","ko":"[한숨 쉰다] [문 닫는 소리]","en":"[Sighs] [Sound of door closing]","text":"[Thở dài] [Tiếng đóng cửa]\n[한숨 쉰다] [문 닫는 소리]\n[Sighs] [Sound of door closing]","sourceUid":"merged-mrppqba0-10","sourceNo":425},{"id":127,"readerNo":128,"displayNo":430,"n":430,"type":"narration","vi":"[tiếng giày] [tiếng đóng cửa]\n[Tiếng cửa bíp] [Tiếng gõ cửa]","ko":"[신발소리] [문 쾅 닫는 소리]\n[삑삑삑 문소리] [노크 소리]","en":"[sound of shoes] [sound of door slamming]\n[Sound of door beeping] [Sound of knocking]","text":"[tiếng giày] [tiếng đóng cửa]\n[Tiếng cửa bíp] [Tiếng gõ cửa]\n[신발소리] [문 쾅 닫는 소리]\n[삑삑삑 문소리] [노크 소리]\n[sound of shoes] [sound of door slamming]\n[Sound of door beeping] [Sound of knocking]","sourceUid":"merged-mrppz1s6-26","sourceNo":430},{"id":128,"readerNo":129,"displayNo":435,"n":435,"type":"narration","vi":"Ai thế?\nChị Kang!\nNó là bạn trai em à?\nChị đi ra đi.\nEm chia tay ngay đi.\nLiên quan gì đến chị?\nEm ngốc à? Sao lại quen thằng khốn đó?","ko":"누구야? 강 언니? 그 새끼 네 남친이야? 됐어, 나가 너 당장 헤어져!\n아우, 네가 무슨 상관인데?\n너 바보야? 그런 양아치랑 사귀게!","en":"Who is this? Kang! Is that your boyfriend? Leave me alone. You need to break up. Why do you care? Are you a nut? He is such a jerk!","text":"Ai thế?\nChị Kang!\nNó là bạn trai em à?\nChị đi ra đi.\nEm chia tay ngay đi.\nLiên quan gì đến chị?\nEm ngốc à? Sao lại quen thằng khốn đó?\n누구야? 강 언니? 그 새끼 네 남친이야? 됐어, 나가 너 당장 헤어져!\n아우, 네가 무슨 상관인데?\n너 바보야? 그런 양아치랑 사귀게!\nWho is this? Kang! Is that your boyfriend? Leave me alone. You need to break up. Why do you care? Are you a nut? He is such a jerk!","sourceUid":"merged-mrpveb79-39","sourceNo":435},{"id":129,"readerNo":130,"displayNo":438,"n":438,"type":"narration","vi":"Đã bảo là được rồi! Con ngốc này. Em thiếu thốn chỗ nào? Sao phải quen kẻ như thế? Tên đó…","ko":"아우, 됐다고!\n야 이, 병신아! 너 어디 모자라니?\n그딴 새끼를 왜 만나? 그 새끼는...","en":"This is my business! Are you stupid? Why are you meeting him? He is--","text":"Đã bảo là được rồi! Con ngốc này. Em thiếu thốn chỗ nào? Sao phải quen kẻ như thế? Tên đó…\n아우, 됐다고!\n야 이, 병신아! 너 어디 모자라니?\n그딴 새끼를 왜 만나? 그 새끼는...\nThis is my business! Are you stupid? Why are you meeting him? He is--","sourceUid":"merged-mrpptcja-16","sourceNo":438},{"id":130,"readerNo":131,"displayNo":441,"n":441,"type":"narration","vi":"Thôi đi! Em không muốn nghe! Chuyện tình cảm của em, để em lo. - Con ngốc kia! Nó đối xử với em vậy mà… - Vậy còn chị?","ko":"아, 그만해. 듣기 싫어! 내 연애야. 내가 알아서 해!\n그럼 넌! 넌 얼마나 훌륭한 연애를 하는데? 네 연애는 뭐?","en":"Stop that! I don't want to hear it! I take care of my own relationship.\n-You fool! You know how he treated you? -What about you?","text":"Thôi đi! Em không muốn nghe! Chuyện tình cảm của em, để em lo. - Con ngốc kia! Nó đối xử với em vậy mà… - Vậy còn chị?\n아, 그만해. 듣기 싫어! 내 연애야. 내가 알아서 해!\n그럼 넌! 넌 얼마나 훌륭한 연애를 하는데? 네 연애는 뭐?\nStop that! I don't want to hear it! I take care of my own relationship.\n-You fool! You know how he treated you? -What about you?","sourceUid":"merged-mrppuogp-19","sourceNo":441},{"id":131,"readerNo":132,"displayNo":308,"n":308,"type":"narration","vi":"Ôi, ngon thật sự luôn. - Cảm ơn. - Ai làm vậy? Cậu làm hả? - Chào mọi người. - Em đến rồi sao?\nNgồi đi.\nTôi ăn xong rồi ạ.\n- Chưa gì đã xong rồi? - Vâng.\nTôi đang giảm cân.","ko":"안녕하세요 (조현희) 일찍 왔네? 잘 먹었습니다! - 벌써 다 먹었어? - 네...","en":"Wow, it's really tasty.\n-Thank you! -Who made this? Did you?\n-Hi. -You are early!\nThere is a seat.\nThank you.\n-Are you already done? -Yes.\nI am on a diet.","text":"Ôi, ngon thật sự luôn. - Cảm ơn. - Ai làm vậy? Cậu làm hả? - Chào mọi người. - Em đến rồi sao?\nNgồi đi.\nTôi ăn xong rồi ạ.\n- Chưa gì đã xong rồi? - Vâng.\nTôi đang giảm cân.\n안녕하세요 (조현희) 일찍 왔네? 잘 먹었습니다! - 벌써 다 먹었어? - 네...\nWow, it's really tasty.\n-Thank you! -Who made this? Did you?\n-Hi. -You are early!\nThere is a seat.\nThank you.\n-Are you already done? -Yes.\nI am on a diet.","sourceUid":"merged-mrpw1zom-45","sourceNo":308},{"id":132,"readerNo":133,"displayNo":442,"n":442,"type":"narration","vi":"Chị yêu đương thế nào? Bộ tốt đẹp lắm sao?\nĐồ ngốc, em với chị giống nhau sao?","ko":"야 이, 병신아! 너 지금 그 꼴을 당하고도 야, 이 바보야. 너랑 나랑 같아?","en":"What about your relationship? Are they that great? You idiot, we are not the same.","text":"Chị yêu đương thế nào? Bộ tốt đẹp lắm sao?\nĐồ ngốc, em với chị giống nhau sao?\n야 이, 병신아! 너 지금 그 꼴을 당하고도 야, 이 바보야. 너랑 나랑 같아?\nWhat about your relationship? Are they that great? You idiot, we are not the same.","sourceUid":"merged-mrppw2td-21","sourceNo":442},{"id":133,"readerNo":134,"displayNo":445,"n":445,"type":"narration","vi":"[Tiếng đóng cửa]","ko":"[문 닫는 소리]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\n[문 닫는 소리]\n[Sound of door closing]","sourceUid":"ko-mrob2li8-969","sourceNo":445},{"id":134,"readerNo":135,"displayNo":447,"n":447,"type":"narration","vi":"Sao chị lại đến?\nSao chị lại đến làm ầm lên? Đây là nhà bọn em, về nhà chị đi!\nĐi ngay đây!\nĐừng có đến nữa!","ko":"왜 왔어? 왜 와서 지랄이야? 여기 우리 집이야 너희 집에 가! 갈 거야! (정예은) 다신 오지 마!","en":"Why did you come here? Why did you come and make trouble? This is our house, go back to yours! I'm leaving! Don't ever come back!","text":"Sao chị lại đến?\nSao chị lại đến làm ầm lên? Đây là nhà bọn em, về nhà chị đi!\nĐi ngay đây!\nĐừng có đến nữa!\n왜 왔어? 왜 와서 지랄이야? 여기 우리 집이야 너희 집에 가! 갈 거야! (정예은) 다신 오지 마!\nWhy did you come here? Why did you come and make trouble? This is our house, go back to yours! I'm leaving! Don't ever come back!","sourceUid":"merged-mrppxtsi-23","sourceNo":447},{"id":135,"readerNo":136,"displayNo":451,"n":451,"type":"narration","vi":"Có mời cũng không thèm đến, con ngốc! Đồ ngốc nghếch, kém cỏi! Đồ giặt của chị đâu?","ko":"오라고 해도 안 와. 이 찐따야\n이 씨...\n병신, 쪽박, 찌질이...\n내 세탁물은?","en":"I won't come back even if you begged me to!\nLoser! What about my clothes?","text":"Có mời cũng không thèm đến, con ngốc! Đồ ngốc nghếch, kém cỏi! Đồ giặt của chị đâu?\n오라고 해도 안 와. 이 찐따야\n이 씨...\n병신, 쪽박, 찌질이...\n내 세탁물은?\nI won't come back even if you begged me to!\nLoser! What about my clothes?","sourceUid":"merged-mrppyluh-24","sourceNo":451},{"id":136,"readerNo":137,"displayNo":456,"n":456,"type":"narration","vi":"Dạ? Ở trong phòng.\nXấu hổ quá.\nSao lại đúng lúc…","ko":"네? 네... 방에... 아이... 쪽팔려! 하필... 아이...","en":"Yeah, in the room.\nSo embarrassing.\nHow come...","text":"Dạ? Ở trong phòng.\nXấu hổ quá.\nSao lại đúng lúc…\n네? 네... 방에... 아이... 쪽팔려! 하필... 아이...\nYeah, in the room.\nSo embarrassing.\nHow come...","sourceUid":"merged-mrpq0jrs-29","sourceNo":456},{"id":137,"readerNo":138,"displayNo":459,"n":459,"type":"narration","vi":"[Tiếng giường kêu lạch cạch]\n[Nhạc nền bắt đầu]\n[Nhân viên nói chuyện]","ko":"[침대 덜컹거리는 소리] [배경 음악 시작] [종업원들 얘기한다]","en":"[Sound of bed rattling] [Background music starts] [Employees talking]","text":"[Tiếng giường kêu lạch cạch]\n[Nhạc nền bắt đầu]\n[Nhân viên nói chuyện]\n[침대 덜컹거리는 소리] [배경 음악 시작] [종업원들 얘기한다]\n[Sound of bed rattling] [Background music starts] [Employees talking]","sourceUid":"merged-mrpw5zm2-50","sourceNo":459},{"id":138,"readerNo":139,"displayNo":468,"n":468,"type":"narration","vi":"Anh Jae Wan!\nSao?\nĐây là quà chúc mừng.\nEm đâu cần làm vậy…\nCũng không có gì đâu.\nThật sự không có gì.","ko":"재완 씨...\n흥!\n응?\n이거 축하 선물이요\n아...\n아, 뭐 이런 걸 다...\n별거 아닌데...\n진짜 별거 아니에요","en":"Anh Jae Wan! Jae-Wan! Sao? Yeah? This is for you, congratulations. You didn't have to...\nIt's nothing.\nNothing special, really.","text":"Anh Jae Wan!\nSao?\nĐây là quà chúc mừng.\nEm đâu cần làm vậy…\nCũng không có gì đâu.\nThật sự không có gì.\n재완 씨...\n흥!\n응?\n이거 축하 선물이요\n아...\n아, 뭐 이런 걸 다...\n별거 아닌데...\n진짜 별거 아니에요\nAnh Jae Wan! Jae-Wan! Sao? Yeah? This is for you, congratulations. You didn't have to...\nIt's nothing.\nNothing special, really.","sourceUid":"merged-mrpw56z2-49","sourceNo":468},{"id":139,"readerNo":140,"displayNo":476,"n":476,"type":"narration","vi":"Lên món đây. Một bít tết cừu, một bít tết bò. Tính mài dao cả ngày luôn hả? Không làm việc hả? Tôi xin lỗi.","ko":"(주방장) 자, 메뉴 엠세이크 하나 리바이세이크 하나 야 인마! 너는 칼을 하루 종일 갈고 있냐? 일 안 해?\n네\n죄송합니다. 죄송합니다","en":"Here are the dishes, one lamb steak and one beef steak. Are you going to sharpen your knife all day? Aren't you working? I'm sorry. Sorry.","text":"Lên món đây. Một bít tết cừu, một bít tết bò. Tính mài dao cả ngày luôn hả? Không làm việc hả? Tôi xin lỗi.\n(주방장) 자, 메뉴 엠세이크 하나 리바이세이크 하나 야 인마! 너는 칼을 하루 종일 갈고 있냐? 일 안 해?\n네\n죄송합니다. 죄송합니다\nHere are the dishes, one lamb steak and one beef steak. Are you going to sharpen your knife all day? Aren't you working? I'm sorry. Sorry.","sourceUid":"merged-mrpwhtal-58","sourceNo":476},{"id":140,"readerNo":141,"displayNo":478,"n":478,"type":"narration","vi":"[Âm thanh mài dao] [Nhạc nền kết thúc] [Nhạc nền cổ điển bắt đầu]\nCậu ấy trẻ hơn ba tuổi!\n[Nhạc nền cổ điển kết thúc] [Nhạc chủ đề bắt đầu]","ko":"[칼 가는 소리] [배경 음악 끝] [클래식 배경 음악 시작]\n[클래식 배경 음악 끝] [테마 음악 시작]\n[종업원들 얘기한다]","en":"[Knife sharpening sound] [Background music ends] [Classical background music starts] He is three years younger! [Classical background music ends] [Theme music starts]","text":"[Âm thanh mài dao] [Nhạc nền kết thúc] [Nhạc nền cổ điển bắt đầu]\nCậu ấy trẻ hơn ba tuổi!\n[Nhạc nền cổ điển kết thúc] [Nhạc chủ đề bắt đầu]\n[칼 가는 소리] [배경 음악 끝] [클래식 배경 음악 시작]\n[클래식 배경 음악 끝] [테마 음악 시작]\n[종업원들 얘기한다]\n[Knife sharpening sound] [Background music ends] [Classical background music starts] He is three years younger! [Classical background music ends] [Theme music starts]","sourceUid":"merged-mrpwtmjm-72","sourceNo":478},{"id":141,"readerNo":142,"displayNo":480,"n":480,"type":"narration","vi":"Chúc quý khách ngon miệng.\n- Kiểm tra đặt hàng đi nhé. - Vâng.","ko":"즐거운 시간 되십시오 야, 너 발주 좀 확인해","en":"Please enjoy your meal. -Will you check the order? -Yes.","text":"Chúc quý khách ngon miệng.\n- Kiểm tra đặt hàng đi nhé. - Vâng.\n즐거운 시간 되십시오 야, 너 발주 좀 확인해\nPlease enjoy your meal. -Will you check the order? -Yes.","sourceUid":"merged-mrpwk6kv-60","sourceNo":480},{"id":142,"readerNo":143,"displayNo":490,"n":490,"type":"narration","vi":"Yoon Jin Myung. Đưa tay ra. Ai mà muốn ăn thức ăn phục vụ bởi cái tay thế này? Khách hàng phàn nàn thì sao? Mọi người tan làm đi.","ko":"예\n윤진명!\n손 내밀어 봐\n흑!\n너 같으면 이런 손으로 서빙된 음식 먹고 싶겠어?\n손님이 컴플레인 걸면 어쩔 뻔했어?\n다른 사람들 다 퇴근해요","en":"Yoon Jin Myung.\nJin-Myung Yoon.\nLet me see your hands.\nWould you want to be served with hands like this?\nWhat if the customers complain?\nEveryone else can leave.","text":"Yoon Jin Myung. Đưa tay ra. Ai mà muốn ăn thức ăn phục vụ bởi cái tay thế này? Khách hàng phàn nàn thì sao? Mọi người tan làm đi.\n예\n윤진명!\n손 내밀어 봐\n흑!\n너 같으면 이런 손으로 서빙된 음식 먹고 싶겠어?\n손님이 컴플레인 걸면 어쩔 뻔했어?\n다른 사람들 다 퇴근해요\nYoon Jin Myung.\nJin-Myung Yoon.\nLet me see your hands.\nWould you want to be served with hands like this?\nWhat if the customers complain?\nEveryone else can leave.","sourceUid":"merged-mrpwmao5-63","sourceNo":490},{"id":143,"readerNo":144,"displayNo":327,"n":327,"type":"narration","vi":"Tôi cũng đã tự mình xoay xở tốt nghiệp đại học.","ko":"나도... 나 혼자서 대학 졸업했다","en":"I made it out of college myself as well.","text":"Tôi cũng đã tự mình xoay xở tốt nghiệp đại học.\n나도... 나 혼자서 대학 졸업했다\nI made it out of college myself as well.","sourceUid":"merged-mrpwuegr-73","sourceNo":327},{"id":144,"readerNo":145,"displayNo":493,"n":493,"type":"narration","vi":"[Bật đèn] [Tiếng đóng cửa]","ko":"[불을 켠다] [문 닫는 소리]","en":"[Turn on the light] [Sound of door closing]","text":"[Bật đèn] [Tiếng đóng cửa]\n[불을 켠다] [문 닫는 소리]\n[Turn on the light] [Sound of door closing]","sourceUid":"merged-mrpwo0n9-70","sourceNo":493},{"id":145,"readerNo":146,"displayNo":499,"n":499,"type":"narration","vi":"Sống ở nhà chú rồi dạy kèm em họ. Chuyện ăn ở coi như được giải quyết, nhưng vẫn luôn phải lo tiền học, tiền sách vở, đi lại.","ko":"삼촌네서 사촌 동생 과외 시키면서\n숙식은 그렇게 해결됐는데\n등록금에 책값, 교통비\n매일 매일이 돈 걱정이었어","en":"I stayed with my uncle, teaching my cousin.\nThat's where I lived,\nbut still had to make tuition and living costs, always worried about money.","text":"Sống ở nhà chú rồi dạy kèm em họ. Chuyện ăn ở coi như được giải quyết, nhưng vẫn luôn phải lo tiền học, tiền sách vở, đi lại.\n삼촌네서 사촌 동생 과외 시키면서\n숙식은 그렇게 해결됐는데\n등록금에 책값, 교통비\n매일 매일이 돈 걱정이었어\nI stayed with my uncle, teaching my cousin.\nThat's where I lived,\nbut still had to make tuition and living costs, always worried about money.","sourceUid":"merged-mrpww0do-74","sourceNo":499},{"id":146,"readerNo":147,"displayNo":503,"n":503,"type":"narration","vi":"Khi nãy vì cũng có nhiều người để ý…\nchứ tôi biết cô vất vả thế nào.","ko":"캬...\n아까는 뭐...\n다른 사람들 눈도 있고...\n네가 얼마나 힘든지 안다","en":"There were other people earlier...\nbut I know how it can be difficult for you.","text":"Khi nãy vì cũng có nhiều người để ý…\nchứ tôi biết cô vất vả thế nào.\n캬...\n아까는 뭐...\n다른 사람들 눈도 있고...\n네가 얼마나 힘든지 안다\nThere were other people earlier...\nbut I know how it can be difficult for you.","sourceUid":"merged-mrpwx7fz-75","sourceNo":503},{"id":147,"readerNo":148,"displayNo":505,"n":505,"type":"narration","vi":"Ăn đi.\nVâng.","ko":"먹어!\n네...","en":"Eat.\nYes.","text":"Ăn đi.\nVâng.\n먹어!\n네...\nEat.\nYes.","sourceUid":"merged-mrpwyb6s-76","sourceNo":505},{"id":148,"readerNo":149,"displayNo":337,"n":337,"type":"narration","vi":"Để tôi hướng dẫn anh thanh toán. Tạm biệt quý khách. Quý khách đi thong thả. Để tôi giúp quý khách thanh toán. Tổng là 125.800 won ạ.","ko":"계산 도와드리겠습니다\n안녕히 가십시오\n계산 도와 드리겠습니다\n,800원 나왔습니다","en":"You can take care of your bill over there.\nThank you.\nHope you had a good time.\nThank you, I will help you.\n,800 won please.","text":"Để tôi hướng dẫn anh thanh toán. Tạm biệt quý khách. Quý khách đi thong thả. Để tôi giúp quý khách thanh toán. Tổng là 125.800 won ạ.\n계산 도와드리겠습니다\n안녕히 가십시오\n계산 도와 드리겠습니다\n,800원 나왔습니다\nYou can take care of your bill over there.\nThank you.\nHope you had a good time.\nThank you, I will help you.\n,800 won please.","sourceUid":"merged-mrpx36tb-78","sourceNo":337},{"id":149,"readerNo":150,"displayNo":355,"n":355,"type":"narration","vi":"Có nhanh lên không? Vâng, đến ngay đây ạ. Hôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. Kêu anh ấy đến nhà… vì tôi cô đơn.","ko":"빨리 안 가지고 와! 아 네, 지금 갑니다 어젯밤엔 진짜 위험했어요 하마터면 애인한테 전화할 뻔했다니까요... 좀 와달라고...나 외롭다고...","en":"Won't you hurry up? It's coming now. It was really dangerous last night... I almost called my lover. To ask him to come... that I am lonely.","text":"Có nhanh lên không? Vâng, đến ngay đây ạ. Hôm qua nguy hiểm thật. Suýt nữa tôi đã gọi cho người yêu. Kêu anh ấy đến nhà… vì tôi cô đơn.\n빨리 안 가지고 와! 아 네, 지금 갑니다 어젯밤엔 진짜 위험했어요 하마터면 애인한테 전화할 뻔했다니까요... 좀 와달라고...나 외롭다고...\nWon't you hurry up? It's coming now. It was really dangerous last night... I almost called my lover. To ask him to come... that I am lonely.","sourceUid":"merged-mrpxd363-94","sourceNo":355},{"id":150,"readerNo":151,"displayNo":508,"n":508,"type":"narration","vi":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]","ko":"[테마 음악 끝] [클래식 배경 음악 시작]","en":"[Theme music ends] [Classic background music starts]","text":"[Nhạc chủ đề kết thúc] [Nhạc nền cổ điển bắt đầu]\n[테마 음악 끝] [클래식 배경 음악 시작]\n[Theme music ends] [Classic background music starts]","sourceUid":"merged-mrpx51kf-85","sourceNo":508},{"id":151,"readerNo":152,"displayNo":513,"n":513,"type":"narration","vi":"[Nhạc nền cổ điển kết thúc]","ko":"[클래식 배경 음악 끝]","en":"[Classic background music ends]","text":"[Nhạc nền cổ điển kết thúc]\n[클래식 배경 음악 끝]\n[Classic background music ends]","sourceUid":"ko-mrob2li9-1037","sourceNo":513},{"id":152,"readerNo":153,"displayNo":369,"n":369,"type":"narration","vi":"Chết mất thôi. Tôi cứ liên tục như vậy từ khi dọn ra. Giấc mơ thế nào?","ko":"아주 죽겠어요\n이사 가고 나서 부터 계속 꾸는데...\n어떤 꿈인데?","en":"It's really killing me,\nit's been every day since I moved.\nWhat kind of dream is it?","text":"Chết mất thôi. Tôi cứ liên tục như vậy từ khi dọn ra. Giấc mơ thế nào?\n아주 죽겠어요\n이사 가고 나서 부터 계속 꾸는데...\n어떤 꿈인데?\nIt's really killing me,\nit's been every day since I moved.\nWhat kind of dream is it?","sourceUid":"merged-mrpxp8sy-111","sourceNo":369},{"id":153,"readerNo":154,"displayNo":519,"n":519,"type":"narration","vi":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.","ko":"(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...","en":"It is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","text":"Không phải là kỳ lạ lắm sao?\nMới hôm qua anh ấy còn quát mắng như thể sẽ đuổi việc cô ấy,\nbảo cô ấy thế này thế kia.\nVậy mà hôm nay lại thấy ở quầy thu ngân.\n(조현희) 아니... 이상하잖아...\n아니, 어젯밤만 해도 막\n당장에라도 자를 것처럼\n‘너 나가!’ 어? 어... ‘맛이 있겠냐?’\n이래 놓고는\n아이, 어떻게 하루 만에 카운터냐고...\nIt is really strange.\nYesterday, he was acting like he was going to fire her right away,\ntelling her to get out.\nHow come next day she is at the till?","sourceUid":"merged-mrpx7cem-91","sourceNo":519},{"id":154,"readerNo":155,"displayNo":523,"n":523,"type":"narration","vi":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.","ko":"걔는 가만히 서 가지고 계산 띡띡하고 7천 500원이면... 아이! 근데 네가 왜 화를 내냐고? 새로 온 애가 버벅대니까 나만 힘들잖아... 아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다","en":"She gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","text":"Chỉ cần đứng yên tại chỗ, bấm nút thanh toán mà được 7.500 won.\nNhưng sao cô lại nổi giận cơ chứ?\nNgười mới còn lớ ngớ nên chỉ mình tôi mệt thôi.\nRõ ràng là có chuyện gì rồi.\n걔는 가만히 서 가지고 계산 띡띡하고 7천 500원이면... 아이! 근데 네가 왜 화를 내냐고? 새로 온 애가 버벅대니까 나만 힘들잖아... 아휴, 성질머리 하고는...\n분명히 무슨 일이 있었다\nShe gets to just stand there making $7.5 every hour.\nSo why are you upset about that?\nIt is all on me with the newbie now.\nThere must be something.","sourceUid":"merged-mrpxddi4-95","sourceNo":523},{"id":155,"readerNo":156,"displayNo":375,"n":375,"type":"narration","vi":"Là thế này.\nTôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước.\nGiống mắt người,\nnhưng cũng giống mắt thú…\nĐôi mắt ấy xa dần…\nnhưng vẫn nhìn theo tôi cho đến cùng.","ko":"그게요...\n내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고...\n짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서...\n끝까지 날 쳐다보는데...","en":"That is...\nI fell into water...\nIt's completely dark.\nSomebody is looking at me in the water.\nIt looks like human eyes,\nor maybe an animal's...\nThose eyes are going away slowly...\nbut they keep staring at me.","text":"Là thế này.\nTôi rơi xuống nước.\nKhắp nơi chỉ toàn nước đen kịt.\nCó ai đó liên tục nhìn tôi dưới làn nước.\nGiống mắt người,\nnhưng cũng giống mắt thú…\nĐôi mắt ấy xa dần…\nnhưng vẫn nhìn theo tôi cho đến cùng.\n그게요...\n내가 물에 빠졌어요\n온통 검은 물인데\n물 안에서 누가 날 쳐다봐요\n사람의 눈 같기도 하고...\n짐승의 눈 같기도 하고...\n그 눈이 점점 멀어지면서...\n끝까지 날 쳐다보는데...\nThat is...\nI fell into water...\nIt's completely dark.\nSomebody is looking at me in the water.\nIt looks like human eyes,\nor maybe an animal's...\nThose eyes are going away slowly...\nbut they keep staring at me.","sourceUid":"merged-mrpxrclp-112","sourceNo":375},{"id":156,"readerNo":157,"displayNo":528,"n":528,"type":"narration","vi":"[nhạc jazz bắt đầu]","ko":"[재즈 음악 시작]","en":"[jazz music starts]","text":"[nhạc jazz bắt đầu]\n[재즈 음악 시작]\n[jazz music starts]","sourceUid":"ko-mrob2li9-1052","sourceNo":528},{"id":157,"readerNo":158,"displayNo":377,"n":377,"type":"narration","vi":"Tôi…\nChú có muốn đến nhà tôi không?\nMà cũng không được.\nNhà người yêu mà đưa đàn ông khác đến thì không phải lắm.\nTôi cũng có phép lịch sự tối thiểu mà.","ko":"나는...\n아저씨, 우리 집 갈래요?\n아, 그건 안 되겠다\n애인 집인데 딴 남자 데려가면 상도덕이 아니지...\n그 정도 예의는 있어요, 나도","en":"I... You want to come to my place? Well, I shouldn't... I shouldn't be bringing a guy to the house my lover got me. I still have some etiquette.","text":"Tôi…\nChú có muốn đến nhà tôi không?\nMà cũng không được.\nNhà người yêu mà đưa đàn ông khác đến thì không phải lắm.\nTôi cũng có phép lịch sự tối thiểu mà.\n나는...\n아저씨, 우리 집 갈래요?\n아, 그건 안 되겠다\n애인 집인데 딴 남자 데려가면 상도덕이 아니지...\n그 정도 예의는 있어요, 나도\nI... You want to come to my place? Well, I shouldn't... I shouldn't be bringing a guy to the house my lover got me. I still have some etiquette.","sourceUid":"merged-mrpxuf8d-115","sourceNo":377},{"id":158,"readerNo":159,"displayNo":539,"n":539,"type":"narration","vi":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.","ko":"전화하면 안 되는 건가? 바보 당연히 안 되죠 남녀관계라는 건요... 시소 같은 거예요 내가 올라가면 상대방은 내려가게 돼 있어요","en":"Can you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","text":"Sao lại không thể gọi điện?\nĐồ ngốc.\nTất nhiên là không được rồi.\nChuyện nam nữ giống như chiếc bập bênh.\nNếu tôi đi lên, người ấy chắc chắn sẽ đi xuống.\n전화하면 안 되는 건가? 바보 당연히 안 되죠 남녀관계라는 건요... 시소 같은 거예요 내가 올라가면 상대방은 내려가게 돼 있어요\nCan you not? Naive. Of course not. A relationship is like a seesaw. If I go up, my partner goes down.\nIf one begs,","sourceUid":"merged-mrpxj2yb-109","sourceNo":539},{"id":159,"readerNo":160,"displayNo":383,"n":383,"type":"narration","vi":"Để tôi đi vệ sinh.","ko":"나 잠깐 화장실 좀...","en":"I need to go to the toilet.","text":"Để tôi đi vệ sinh.\n나 잠깐 화장실 좀...\nI need to go to the toilet.","sourceUid":"merged-mrpxwsrx-117","sourceNo":383},{"id":160,"readerNo":161,"displayNo":543,"n":543,"type":"narration","vi":"Nếu phía này đeo bám thì phía kia sẽ chạy mất. Nhưng đó không phải chuyện quan trọng.","ko":"이쪽에서 매달리면\n저쪽은 도망간다고요\n중요한 건 그게 아니고...","en":"the other runs away.\nThis is not important.","text":"Nếu phía này đeo bám thì phía kia sẽ chạy mất. Nhưng đó không phải chuyện quan trọng.\n이쪽에서 매달리면\n저쪽은 도망간다고요\n중요한 건 그게 아니고...\nthe other runs away.\nThis is not important.","sourceUid":"merged-mrpxijp9-107","sourceNo":543},{"id":161,"readerNo":162,"displayNo":545,"n":545,"type":"narration","vi":"Tôi nên làm sao đây?\nChuyện mơ thấy ác mộng?","ko":"나 어떡하죠? 나쁜 꿈 꾼다는 거?","en":"What should I do?\nYour bad dream?","text":"Tôi nên làm sao đây?\nChuyện mơ thấy ác mộng?\n나 어떡하죠? 나쁜 꿈 꾼다는 거?\nWhat should I do?\nYour bad dream?","sourceUid":"merged-mrpxitqd-108","sourceNo":545},{"id":162,"readerNo":163,"displayNo":562,"n":562,"type":"narration","vi":"[Nhạc jazz kết thúc] [Nhạc nền kỳ lạ bắt đầu] [Nhạc kỳ lạ kết thúc] [Nhạc jazz tiếp tục]","ko":"[재즈 음악 끝] [음산한 배경 음악 시작] [음산한 음악 끝] [재즈 음악 계속]","en":"[jazz music ends] [eerie background music begins] [eerie music ends] [jazz music continues]","text":"[Nhạc jazz kết thúc] [Nhạc nền kỳ lạ bắt đầu] [Nhạc kỳ lạ kết thúc] [Nhạc jazz tiếp tục]\n[재즈 음악 끝] [음산한 배경 음악 시작] [음산한 음악 끝] [재즈 음악 계속]\n[jazz music ends] [eerie background music begins] [eerie music ends] [jazz music continues]","sourceUid":"merged-mrpxvhn9-116","sourceNo":562},{"id":163,"readerNo":164,"displayNo":386,"n":386,"type":"narration","vi":"Hôm qua tôi đã chờ em ở cổng sau. Quản lý đã đưa tôi về. Em biết mọi người bàn tán không?","ko":"어제도 뒷문에서 기다렸어요\n매니저님이 데려다 줬어요\n사람들이 수군대는 거 알아요?","en":"I waited for you at the back door last night. Manager gave me a ride. You know, people are talking about you.","text":"Hôm qua tôi đã chờ em ở cổng sau. Quản lý đã đưa tôi về. Em biết mọi người bàn tán không?\n어제도 뒷문에서 기다렸어요\n매니저님이 데려다 줬어요\n사람들이 수군대는 거 알아요?\nI waited for you at the back door last night. Manager gave me a ride. You know, people are talking about you.","sourceUid":"merged-mrpxzu7k-121","sourceNo":386},{"id":164,"readerNo":165,"displayNo":568,"n":568,"type":"narration","vi":"[Nhạc Jazz kết thúc] [Tiếng rửa mặt]","ko":"[재즈 음악 끝] [세수하는 소리]","en":"[Jazz music ends] [Sound of washing face]","text":"[Nhạc Jazz kết thúc] [Tiếng rửa mặt]\n[재즈 음악 끝] [세수하는 소리]\n[Jazz music ends] [Sound of washing face]","sourceUid":"merged-mrpxxac1-119","sourceNo":568},{"id":165,"readerNo":166,"displayNo":569,"n":569,"type":"narration","vi":"[Nhạc chủ đề bắt đầu]","ko":"[테마 음악 시작]","en":"[Theme music starts]","text":"[Nhạc chủ đề bắt đầu]\n[테마 음악 시작]\n[Theme music starts]","sourceUid":"ko-mrob2li9-1093","sourceNo":569},{"id":166,"readerNo":167,"displayNo":576,"n":576,"type":"narration","vi":"Hãy nói chuyện đó không đúng đi.\nChuyện đó là chuyện gì?\nTôi nói thì anh sẽ tin chứ?\nTin.","ko":"그런 거 아니라고 말해줘요\n그런 거 어떤 거요?\n말하면 믿을 거예요?\n네","en":"Please tell me that's not true.\nWhat's not true?\nWill you believe me if I do?\nTin.\nYes.","text":"Hãy nói chuyện đó không đúng đi.\nChuyện đó là chuyện gì?\nTôi nói thì anh sẽ tin chứ?\nTin.\n그런 거 아니라고 말해줘요\n그런 거 어떤 거요?\n말하면 믿을 거예요?\n네\nPlease tell me that's not true.\nWhat's not true?\nWill you believe me if I do?\nTin.\nYes.","sourceUid":"merged-mrpy0fyz-122","sourceNo":576},{"id":167,"readerNo":168,"displayNo":394,"n":394,"type":"narration","vi":"- Có người. - Nhanh ra đi, cho chị đi. Chị sắp ra quần rồi, mau đi. Này, nhanh lên. Mắc quá! Chị xin lỗi.","ko":"있어...\n야, 나 싸... 야 나와 봐. 나 싸...\n야 싼다, 빨리 나와 봐...\n아, 야 빨리... 나 싸... 싸네...\n아... 미안","en":"-I'm here. -I'm about to let it go, come out. I'm almost there, come on. Come on, please. Sorry.","text":"- Có người. - Nhanh ra đi, cho chị đi. Chị sắp ra quần rồi, mau đi. Này, nhanh lên. Mắc quá! Chị xin lỗi.\n있어...\n야, 나 싸... 야 나와 봐. 나 싸...\n야 싼다, 빨리 나와 봐...\n아, 야 빨리... 나 싸... 싸네...\n아... 미안\n-I'm here. -I'm about to let it go, come out. I'm almost there, come on. Come on, please. Sorry.","sourceUid":"merged-mrpy6eb3-125","sourceNo":394},{"id":168,"readerNo":169,"displayNo":398,"n":398,"type":"narration","vi":"Chị Kang đến đấy.\nỪ, chị thấy trên đường về rồi.\nXin lỗi.\nCảm ơn vì cho chị dùng nhà vệ sinh.\n- Song. - Dạ?","ko":"강 언니 왔어... 어... 오다 봤어 미안... 화장실 잘 쓰고 갑니다 송! 예?","en":"Kang's here. I know, I saw her. Sorry. Thanks for letting me use the toilet. -Song. -Yeah?","text":"Chị Kang đến đấy.\nỪ, chị thấy trên đường về rồi.\nXin lỗi.\nCảm ơn vì cho chị dùng nhà vệ sinh.\n- Song. - Dạ?\n강 언니 왔어... 어... 오다 봤어 미안... 화장실 잘 쓰고 갑니다 송! 예?\nKang's here. I know, I saw her. Sorry. Thanks for letting me use the toilet. -Song. -Yeah?","sourceUid":"merged-mrpyd1sy-138","sourceNo":398},{"id":169,"readerNo":170,"displayNo":577,"n":577,"type":"narration","vi":"[Nhạc chủ đề kết thúc]","ko":"[테마 음악 끝]","en":"[Theme music ends]","text":"[Nhạc chủ đề kết thúc]\n[테마 음악 끝]\n[Theme music ends]","sourceUid":"ko-mrob2li9-1101","sourceNo":577},{"id":170,"readerNo":171,"displayNo":585,"n":585,"type":"narration","vi":"[Tiếng gõ cửa] [Tiếng nước xối] [Tiếng đóng cửa]","ko":"[노크 소리] [물 내리는 소리] [문 닫는 소리]","en":"[Knocking sound] [Water flushing] [Door closing sound]","text":"[Tiếng gõ cửa] [Tiếng nước xối] [Tiếng đóng cửa]\n[노크 소리] [물 내리는 소리] [문 닫는 소리]\n[Knocking sound] [Water flushing] [Door closing sound]","sourceUid":"merged-mrpya4fc-133","sourceNo":585},{"id":171,"readerNo":172,"displayNo":590,"n":590,"type":"narration","vi":"- Gì vậy chứ? - Hình như chị ấy say lắm.\nSay thì say nhưng sao chị ấy lại đến đây?\nĐúng như người xưa đã nói ấy.\n\"Ngựa quen đường cũ.\"","ko":"뭐야? 되게 취한 거 같아요 취한 건 취한 거고... 왜 왔냐고? 김유신의 말 같은 거 아닐까요? 늘 가던 데로 가는 거","en":"-What's this? -She seems very drunk.\nOkay, she's drunk, but what's she doing here?\nMaybe it's an instinct?\nHoming instinct.","text":"- Gì vậy chứ? - Hình như chị ấy say lắm.\nSay thì say nhưng sao chị ấy lại đến đây?\nĐúng như người xưa đã nói ấy.\n\"Ngựa quen đường cũ.\"\n뭐야? 되게 취한 거 같아요 취한 건 취한 거고... 왜 왔냐고? 김유신의 말 같은 거 아닐까요? 늘 가던 데로 가는 거\n-What's this? -She seems very drunk.\nOkay, she's drunk, but what's she doing here?\nMaybe it's an instinct?\nHoming instinct.","sourceUid":"merged-mrpycfas-137","sourceNo":590},{"id":172,"readerNo":173,"displayNo":414,"n":414,"type":"narration","vi":"Đúng là ngốc thật.\nEm không biết em tuyệt vời thế nào à?\nSao lại quen tên khốn nạn như thế?","ko":"아... 아!\n아...\n바보야, 진짜...\n쟤는 지가 얼마나 괜찮은 앤지 모른다\n그것도 모르고 쌩양아치를 만나...","en":"You fool... she doesn't know how good she is. She is wasting her time meeting that jerk.","text":"Đúng là ngốc thật.\nEm không biết em tuyệt vời thế nào à?\nSao lại quen tên khốn nạn như thế?\n아... 아!\n아...\n바보야, 진짜...\n쟤는 지가 얼마나 괜찮은 앤지 모른다\n그것도 모르고 쌩양아치를 만나...\nYou fool... she doesn't know how good she is. She is wasting her time meeting that jerk.","sourceUid":"merged-mrpyw5e1-147","sourceNo":414},{"id":173,"readerNo":174,"displayNo":604,"n":604,"type":"narration","vi":"Con ma kia đi mất rồi đúng không?\nDạo này hết thấy rồi nhỉ?\nChắc không thấy đâu.\nVì nó đã đi theo chị mà.\nDạo này nó rất bận vì xuất hiện trong giấc mơ của chị.\nNày, coi chừng.","ko":"저기 귀신 없어졌지?\n어?\n요즘 안 보이지?\n안 보일 거야\n나 따라왔으니까\n요즘에 내 꿈에 나오느라 겁나 바쁘거든\n어머... 야 야!\n어...\n- 아! - 아! 아...\n아!","en":"That ghost is gone, right? Not here any more. Probably not. It followed me.\nIt's in my dreams lately.\nWatch out.","text":"Con ma kia đi mất rồi đúng không?\nDạo này hết thấy rồi nhỉ?\nChắc không thấy đâu.\nVì nó đã đi theo chị mà.\nDạo này nó rất bận vì xuất hiện trong giấc mơ của chị.\nNày, coi chừng.\n저기 귀신 없어졌지?\n어?\n요즘 안 보이지?\n안 보일 거야\n나 따라왔으니까\n요즘에 내 꿈에 나오느라 겁나 바쁘거든\n어머... 야 야!\n어...\n- 아! - 아! 아...\n아!\nThat ghost is gone, right? Not here any more. Probably not. It followed me.\nIt's in my dreams lately.\nWatch out.","sourceUid":"merged-mrpyt6r8-144","sourceNo":604},{"id":174,"readerNo":175,"displayNo":611,"n":611,"type":"narration","vi":"Em đó…\nĐừng có quen tên đó nữa.\nChị sợ em sẽ bị tổn thương.\nChị lo cho em.","ko":"너...\n그 남자 만나지 마\n네가 다칠까 봐 그래\n걱정돼서...","en":"You...\ndon't see him any more.\nI think you might get hurt.\nI'm worried.","text":"Em đó…\nĐừng có quen tên đó nữa.\nChị sợ em sẽ bị tổn thương.\nChị lo cho em.\n너...\n그 남자 만나지 마\n네가 다칠까 봐 그래\n걱정돼서...\nYou...\ndon't see him any more.\nI think you might get hurt.\nI'm worried.","sourceUid":"merged-mrpytmiu-146","sourceNo":611},{"id":175,"readerNo":176,"displayNo":616,"n":616,"type":"narration","vi":"[Tiếng nước rơi] [Nhạc chủ đề bắt đầu]\n[ngáy]","ko":"[물 내리는 소리] [테마 음악 시작]\n[코를 골다]","en":"[Sound of water falling] [Theme music starts]\n[snoring]","text":"[Tiếng nước rơi] [Nhạc chủ đề bắt đầu]\n[ngáy]\n[물 내리는 소리] [테마 음악 시작]\n[코를 골다]\n[Sound of water falling] [Theme music starts]\n[snoring]","sourceUid":"merged-mrpzf8eb-162","sourceNo":616},{"id":176,"readerNo":177,"displayNo":620,"n":620,"type":"narration","vi":"Ngốc quá đi mất.\nGì đây?\nSao lại say ở nhà người khác?","ko":"아이고, 바보야 진짜...\n뭐야...\n남의 집에서 술주정은...","en":"How foolish... What now... falling asleep here?","text":"Ngốc quá đi mất.\nGì đây?\nSao lại say ở nhà người khác?\n아이고, 바보야 진짜...\n뭐야...\n남의 집에서 술주정은...\nHow foolish... What now... falling asleep here?","sourceUid":"merged-mrpz6e0j-153","sourceNo":620},{"id":177,"readerNo":178,"displayNo":626,"n":626,"type":"narration","vi":"Em biết mọi người bàn tán không?\nHãy nói chuyện đó không đúng đi.\nTôi không thể nói.\nCô ra quầy thanh toán đứng\ncho đến khi khỏi tay đi.","ko":"(박재완) 사람들이 수군대는 거 알아요? 그런 거 아니라고 말해줘요 (윤진명) 말할 수 없어... 손톱 다 나을 때까지 카운터에서 일해","en":"Do you know people are talking about you?\nTell me that's not true.\nI can't.\nUntil you recover,\nstay at the desk.","text":"Em biết mọi người bàn tán không?\nHãy nói chuyện đó không đúng đi.\nTôi không thể nói.\nCô ra quầy thanh toán đứng\ncho đến khi khỏi tay đi.\n(박재완) 사람들이 수군대는 거 알아요? 그런 거 아니라고 말해줘요 (윤진명) 말할 수 없어... 손톱 다 나을 때까지 카운터에서 일해\nDo you know people are talking about you?\nTell me that's not true.\nI can't.\nUntil you recover,\nstay at the desk.","sourceUid":"merged-mrpz7xh3-157","sourceNo":626},{"id":178,"readerNo":179,"displayNo":630,"n":630,"type":"narration","vi":"Nếu sau này có chuyện gì, cứ việc nói với tôi. Tôi không thể nói là không có chuyện gì. Anh ta biết chính xác bản thân đang làm gì.","ko":"앞으로 어려운 일 있으면...\n뭐 삼촌처럼... (윤진명) 아무 일 없었다고 말할 수 없다 그 행동이 어떤 의미인지... 그는 알고 있었다","en":"Let me know if anything happens,\nlike talking to your uncle.\nI can't say nothing happened.\nHe knew exactly what he meant through his action.","text":"Nếu sau này có chuyện gì, cứ việc nói với tôi. Tôi không thể nói là không có chuyện gì. Anh ta biết chính xác bản thân đang làm gì.\n앞으로 어려운 일 있으면...\n뭐 삼촌처럼... (윤진명) 아무 일 없었다고 말할 수 없다 그 행동이 어떤 의미인지... 그는 알고 있었다\nLet me know if anything happens,\nlike talking to your uncle.\nI can't say nothing happened.\nHe knew exactly what he meant through his action.","sourceUid":"merged-mrpz8x4g-160","sourceNo":630},{"id":179,"readerNo":180,"displayNo":633,"n":633,"type":"narration","vi":"Cảm ơn anh.\nĐược rồi.\nTôi cũng biết…\nanh ta làm vậy là có ý gì.","ko":"고맙습니다 그래 (윤진명) 그 행동이 어떤 의미인지...나도 알고 있었다","en":"Thank you. Okay. I also knew... what his action meant.","text":"Cảm ơn anh.\nĐược rồi.\nTôi cũng biết…\nanh ta làm vậy là có ý gì.\n고맙습니다 그래 (윤진명) 그 행동이 어떤 의미인지...나도 알고 있었다\nThank you. Okay. I also knew... what his action meant.","sourceUid":"merged-mrpz9aoj-161","sourceNo":633},{"id":180,"readerNo":181,"displayNo":639,"n":639,"type":"narration","vi":"Thời gian qua chị đã khinh miệt em. Vì nghĩ rằng mình tốt đẹp hơn em. Nhưng không phải. Chỉ là… chị không gặp nhiều cám dỗ như em thôi.","ko":"그동안 난 널 경멸했다\n내가 너보다 잘난 사람이라고 생각했어\n아니었어\n나에겐...\n그저 너만큼의 유혹이 없었던 것뿐이야","en":"I hated you before.\nI thought I was better than you,\nbut I wasn't.\nIt's just...\nI didn't have as much of a temptation.","text":"Thời gian qua chị đã khinh miệt em. Vì nghĩ rằng mình tốt đẹp hơn em. Nhưng không phải. Chỉ là… chị không gặp nhiều cám dỗ như em thôi.\n그동안 난 널 경멸했다\n내가 너보다 잘난 사람이라고 생각했어\n아니었어\n나에겐...\n그저 너만큼의 유혹이 없었던 것뿐이야\nI hated you before.\nI thought I was better than you,\nbut I wasn't.\nIt's just...\nI didn't have as much of a temptation.","sourceUid":"merged-mrpzg5n4-165","sourceNo":639},{"id":181,"readerNo":182,"displayNo":440,"n":440,"type":"narration","vi":"Thì ra hôm nay là Chủ Nhật.\nEm xin lỗi vì gây chuyện tối qua.\nCon ma ấy\nvẫn đang ở đây.\nHôm qua chị bảo nó đi theo chị mà.","ko":"아... 일요일이구나...\n어제는 물의를 일으켜서 죄송합니다\n그 귀신...\n계속 여기 있었어\n어?\n그 귀신이 강 언니 따라온 것 같다고\n어제 그랬잖아...","en":"It is Sunday. I'm really sorry about last night. That ghost, it was here the whole time. Yesterday, you said it followed you.","text":"Thì ra hôm nay là Chủ Nhật.\nEm xin lỗi vì gây chuyện tối qua.\nCon ma ấy\nvẫn đang ở đây.\nHôm qua chị bảo nó đi theo chị mà.\n아... 일요일이구나...\n어제는 물의를 일으켜서 죄송합니다\n그 귀신...\n계속 여기 있었어\n어?\n그 귀신이 강 언니 따라온 것 같다고\n어제 그랬잖아...\nIt is Sunday. I'm really sorry about last night. That ghost, it was here the whole time. Yesterday, you said it followed you.","sourceUid":"merged-mrpzswvc-172","sourceNo":440},{"id":182,"readerNo":183,"displayNo":445,"n":445,"type":"narration","vi":"Chị đã nói vậy sao?\nChị không nhớ hả?\nNói tóm lại nó vẫn luôn ở đây, không có đi theo chị.\nĐược rồi.\nVậy thứ đó là gì chứ?","ko":"내가 그런 말 했어?\n기억 안 나?\n\n어쨌든 그 귀신은 계속 여기 있었어\n강 언니 따라간 거 아니야\n그래?\n그럼, 그건 뭐지?","en":"Did I say that?\nDon't you remember?\nAnyway, the ghost has been here, it didn't follow you.\nOkay.\nThen what is that?","text":"Chị đã nói vậy sao?\nChị không nhớ hả?\nNói tóm lại nó vẫn luôn ở đây, không có đi theo chị.\nĐược rồi.\nVậy thứ đó là gì chứ?\n내가 그런 말 했어?\n기억 안 나?\n\n어쨌든 그 귀신은 계속 여기 있었어\n강 언니 따라간 거 아니야\n그래?\n그럼, 그건 뭐지?\nDid I say that?\nDon't you remember?\nAnyway, the ghost has been here, it didn't follow you.\nOkay.\nThen what is that?","sourceUid":"merged-mrpzuw9m-175","sourceNo":445},{"id":183,"readerNo":184,"displayNo":448,"n":448,"type":"narration","vi":"Em sống ở đây không được sao? Em biết dọn đi rồi quay lại là ngu ngốc… rồi cả chuyện nói dối nữa.","ko":"나 그냥 여기서 살면 안 될까? 나갔다 들어왔다 바보 같은 것도 알고 내가 거짓말한 것도 알고","en":"Can I not just live here?\nI know it looks stupid coming back after moving out,\nalso, I lied.","text":"Em sống ở đây không được sao? Em biết dọn đi rồi quay lại là ngu ngốc… rồi cả chuyện nói dối nữa.\n나 그냥 여기서 살면 안 될까? 나갔다 들어왔다 바보 같은 것도 알고 내가 거짓말한 것도 알고\nCan I not just live here?\nI know it looks stupid coming back after moving out,\nalso, I lied.","sourceUid":"merged-mrpzyehy-178","sourceNo":448},{"id":184,"readerNo":185,"displayNo":641,"n":641,"type":"narration","vi":"[Tiếng thức dậy và rên rỉ] [Nhạc chủ đề kết thúc]","ko":"[잠 깨며 끙끙대는 소리] [테마 음악 끝]","en":"[Sound of waking up and groaning] [Theme music ends]","text":"[Tiếng thức dậy và rên rỉ] [Nhạc chủ đề kết thúc]\n[잠 깨며 끙끙대는 소리] [테마 음악 끝]\n[Sound of waking up and groaning] [Theme music ends]","sourceUid":"merged-mrpzjkpj-169","sourceNo":641},{"id":185,"readerNo":186,"displayNo":452,"n":452,"type":"narration","vi":"Em biết… nhưng em không thể sống ở đây nữa ư?","ko":"아는데...\n나 그래도 여기서 살면 안 될까?","en":"I know, but... can't I just live here?","text":"Em biết… nhưng em không thể sống ở đây nữa ư?\n아는데...\n나 그래도 여기서 살면 안 될까?\nI know, but... can't I just live here?","sourceUid":"merged-mrpzk36o-170","sourceNo":452},{"id":186,"readerNo":187,"displayNo":657,"n":657,"type":"narration","vi":"[Tiếng đóng cửa]","ko":"[문 닫는 소리]\n[배경 음악 시작]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\n[문 닫는 소리]\n[배경 음악 시작]\n[Sound of door closing]","sourceUid":"merged-mrq008s5-180","sourceNo":657},{"id":187,"readerNo":188,"displayNo":669,"n":669,"type":"narration","vi":"- Mời bạn. - Tôi cảm ơn. Không hiểu sao tôi lại căng thẳng quá. Tạm biệt ạ. Bạn đi cẩn thận nhé.","ko":"드세요 고맙습니다 왠지 긴장되네요... 가 보겠습니다 (모두) 안녕히 가세요...","en":"-Please have tea. -Thank you. For some reason, I'm nervous. Bye.","text":"- Mời bạn. - Tôi cảm ơn. Không hiểu sao tôi lại căng thẳng quá. Tạm biệt ạ. Bạn đi cẩn thận nhé.\n드세요 고맙습니다 왠지 긴장되네요... 가 보겠습니다 (모두) 안녕히 가세요...\n-Please have tea. -Thank you. For some reason, I'm nervous. Bye.","sourceUid":"merged-mrq03k3b-187","sourceNo":669},{"id":188,"readerNo":189,"displayNo":678,"n":678,"type":"narration","vi":"Em thấy không ưng lắm.\nỞ đâu?\nChỉ là đơn giản cảm thấy thế thôi.\nEm cũng thế.\nCòn tiền bối Yoon?\nChị thì cũng không phải ưng lắm.\nĐúng không? Em cũng không ưng gì cả.\nQuá bình thường.","ko":"난 쫌 별로인데\n어디가?\n그냥 뭐... 전체적으로다가 느낌적인 느낌이...\n저도 좀 그래요. 윤 선배는요?\n나도 뭐, 딱히 마음에 드는 건 아닌데...\n나도 별로야...\n너무 평범해\n그치이? 너어어무 평범해","en":"I'm not so sure.\nAbout what?\nMy feeling's all over the place...\nMe too.\nYou?\nI am not so sure either.\nRight? I didn't like her much.\nToo ordinary.","text":"Em thấy không ưng lắm.\nỞ đâu?\nChỉ là đơn giản cảm thấy thế thôi.\nEm cũng thế.\nCòn tiền bối Yoon?\nChị thì cũng không phải ưng lắm.\nĐúng không? Em cũng không ưng gì cả.\nQuá bình thường.\n난 쫌 별로인데\n어디가?\n그냥 뭐... 전체적으로다가 느낌적인 느낌이...\n저도 좀 그래요. 윤 선배는요?\n나도 뭐, 딱히 마음에 드는 건 아닌데...\n나도 별로야...\n너무 평범해\n그치이? 너어어무 평범해\nI'm not so sure.\nAbout what?\nMy feeling's all over the place...\nMe too.\nYou?\nI am not so sure either.\nRight? I didn't like her much.\nToo ordinary.","sourceUid":"merged-mrqh3uqw-2","sourceNo":678},{"id":189,"readerNo":190,"displayNo":682,"n":682,"type":"narration","vi":"Đúng rồi, quá là bình thường ấy, không mặn tẹo nào.\nCũng phải có lúc này lúc kia,\nthỉnh thoảng nói dối, rồi sống náo nhiệt lên tí.","ko":"그치?\n재미가 없어...\n사람이 좀, 응? 들쑥날쑥하고, 응?\n거짓말도 좀 할 거 같고 인생이 좀... 말이야... 응?\n다이나믹하게...","en":"Yeah, too ordinary, no fun.\nSometimes, ups and downs\nand bits of lies make our life dynamic.","text":"Đúng rồi, quá là bình thường ấy, không mặn tẹo nào.\nCũng phải có lúc này lúc kia,\nthỉnh thoảng nói dối, rồi sống náo nhiệt lên tí.\n그치?\n재미가 없어...\n사람이 좀, 응? 들쑥날쑥하고, 응?\n거짓말도 좀 할 거 같고 인생이 좀... 말이야... 응?\n다이나믹하게...\nYeah, too ordinary, no fun.\nSometimes, ups and downs\nand bits of lies make our life dynamic.","sourceUid":"merged-mrqhc9o8-4","sourceNo":682},{"id":190,"readerNo":191,"displayNo":475,"n":475,"type":"narration","vi":"MẸ\nAlô?\nTôi biết làm sao đây, ôi con tôi!\nCon của tôi.\nSống không ra sống, chết không ra chết.\nCon trai tôi.\nSoo Myung à!\nCon trai tôi, Soo Myung à!","ko":"여보세요?\n(아줌마) 불쌍한 내 새끼... 어떡해\n어떡해\n년 동안 죽지도 못하고\n살지도 못하고...\n수명아, 수명아\n수명아!","en":"MOM Hello? What do I do now, my son! My baby.\nHe can't live or die.\nMy dear son.\nSea-Myung!\nMy baby, Sea-Myung!","text":"MẸ\nAlô?\nTôi biết làm sao đây, ôi con tôi!\nCon của tôi.\nSống không ra sống, chết không ra chết.\nCon trai tôi.\nSoo Myung à!\nCon trai tôi, Soo Myung à!\n여보세요?\n(아줌마) 불쌍한 내 새끼... 어떡해\n어떡해\n년 동안 죽지도 못하고\n살지도 못하고...\n수명아, 수명아\n수명아!\nMOM Hello? What do I do now, my son! My baby.\nHe can't live or die.\nMy dear son.\nSea-Myung!\nMy baby, Sea-Myung!","sourceUid":"merged-mrqhf0i4-7","sourceNo":475},{"id":191,"readerNo":192,"displayNo":666,"n":666,"type":"narration","vi":"[Tiếng đóng cửa] [Tiếng đóng cửa] [Nhạc nền kết thúc]","ko":"[문 닫는 소리] [삑삑삑 문소리] [배경 음악 끝]","en":"[Sound of door closing] [Sound of door closing] [Background music ends]","text":"[Tiếng đóng cửa] [Tiếng đóng cửa] [Nhạc nền kết thúc]\n[문 닫는 소리] [삑삑삑 문소리] [배경 음악 끝]\n[Sound of door closing] [Sound of door closing] [Background music ends]","sourceUid":"merged-mrq01jr4-184","sourceNo":666},{"id":192,"readerNo":193,"displayNo":700,"n":700,"type":"narration","vi":"Cũng vì mẹ nên con không thể đi.\nKhông, con đừng đi…\nChị không cần lo nữa,\ncậu ấy ổn định lại rồi.\nCậu ấy trở lại trạng thái ban đầu rồi.","ko":"내 새끼, 수명아...\n수명아, 엄마 땜에 못 간 거지...\n내가...\n걱정 마십시오\n다시 안정됐습니다\n네에\n원래 상태로... 돌아왔습니다\n예?","en":"You couldn't leave because of me.\nNo, you can't...\nDon't worry,\nhe is back again.\nHe is back to stable condition now.","text":"Cũng vì mẹ nên con không thể đi.\nKhông, con đừng đi…\nChị không cần lo nữa,\ncậu ấy ổn định lại rồi.\nCậu ấy trở lại trạng thái ban đầu rồi.\n내 새끼, 수명아...\n수명아, 엄마 땜에 못 간 거지...\n내가...\n걱정 마십시오\n다시 안정됐습니다\n네에\n원래 상태로... 돌아왔습니다\n예?\nYou couldn't leave because of me.\nNo, you can't...\nDon't worry,\nhe is back again.\nHe is back to stable condition now.","sourceUid":"merged-mrqhina8-12","sourceNo":700},{"id":193,"readerNo":194,"displayNo":688,"n":688,"type":"narration","vi":"[Điện thoại đổ chuông] [Nhạc nền bắt đầu] [Khóc lớn]","ko":"[전화벨 소리] [배경 음악 시작] [대성통곡한다]","en":"[Phone ringing] [Background music starts] [Weeping loudly]","text":"[Điện thoại đổ chuông] [Nhạc nền bắt đầu] [Khóc lớn]\n[전화벨 소리] [배경 음악 시작] [대성통곡한다]\n[Phone ringing] [Background music starts] [Weeping loudly]","sourceUid":"merged-mrqhhp6g-10","sourceNo":688},{"id":194,"readerNo":195,"displayNo":483,"n":483,"type":"narration","vi":"Mọi người vất vả rồi! Tạm biệt ạ! Anh về cẩn thận ạ.","ko":"수고했습니다!\n야! 고생했어\n- 들어가세요! - 어...","en":"Good work today!\nBye!\nSee you tomorrow.","text":"Mọi người vất vả rồi! Tạm biệt ạ! Anh về cẩn thận ạ.\n수고했습니다!\n야! 고생했어\n- 들어가세요! - 어...\nGood work today!\nBye!\nSee you tomorrow.","sourceUid":"merged-mrqhlrow-13","sourceNo":483},{"id":195,"readerNo":196,"displayNo":701,"n":701,"type":"narration","vi":"[Thở ngây ngất]","ko":"[넋 나간 호흡]","en":"[Ecstatic breathing]","text":"[Thở ngây ngất]\n[넋 나간 호흡]\n[Ecstatic breathing]","sourceUid":"ko-mrob2li9-1225","sourceNo":701},{"id":196,"readerNo":197,"displayNo":714,"n":714,"type":"narration","vi":"Có chuyện gì sao?\nEm trai tôi chưa chết.\nTận sáu năm trôi qua rồi…\nTôi tưởng lần này nó chết thật.\nTôi đã luôn mong nó chết đi.","ko":"무슨 일 있었어요?\n내 동생이 안 죽었어요\n년 동안이나 안 죽고...\n이번에는 진짜 죽을 줄 알았는데...\n그렇게 죽기를 바랬는데...","en":"Something happened?\nMy brother didn't die.\nFor six years...\nI thought he actually died this time.\nI've been hoping for that.","text":"Có chuyện gì sao?\nEm trai tôi chưa chết.\nTận sáu năm trôi qua rồi…\nTôi tưởng lần này nó chết thật.\nTôi đã luôn mong nó chết đi.\n무슨 일 있었어요?\n내 동생이 안 죽었어요\n년 동안이나 안 죽고...\n이번에는 진짜 죽을 줄 알았는데...\n그렇게 죽기를 바랬는데...\nSomething happened?\nMy brother didn't die.\nFor six years...\nI thought he actually died this time.\nI've been hoping for that.","sourceUid":"merged-mrqho9qf-19","sourceNo":714},{"id":197,"readerNo":198,"displayNo":707,"n":707,"type":"narration","vi":"[Nhạc nền kết thúc]\n[Nhân viên nói chuyện]\n[Bật tạp dề]","ko":"[배경 음악 끝] [종업원들 얘기한다] [앞치마 턴다]","en":"[Background music ends]\n[Employees talking]\n[Turns on apron]","text":"[Nhạc nền kết thúc]\n[Nhân viên nói chuyện]\n[Bật tạp dề]\n[배경 음악 끝] [종업원들 얘기한다] [앞치마 턴다]\n[Background music ends]\n[Employees talking]\n[Turns on apron]","sourceUid":"merged-mrqhmfmc-15","sourceNo":707},{"id":198,"readerNo":199,"displayNo":487,"n":487,"type":"narration","vi":"Anh thích tôi à?","ko":"나 좋아해요?","en":"Do you like me?","text":"Anh thích tôi à?\n나 좋아해요?\nDo you like me?","sourceUid":"merged-mrqhucuw-21","sourceNo":487},{"id":199,"readerNo":200,"displayNo":709,"n":709,"type":"narration","vi":"[Thở dài] [Tiếng đóng cửa]","ko":"[한숨 쉰다] [문 닫는 소리]","en":"[Sighs] [Sound of door closing]","text":"[Thở dài] [Tiếng đóng cửa]\n[한숨 쉰다] [문 닫는 소리]\n[Sighs] [Sound of door closing]","sourceUid":"merged-mrqhn06s-17","sourceNo":709},{"id":200,"readerNo":201,"displayNo":720,"n":720,"type":"narration","vi":"Giờ vẫn thích sao?\nVâng.\nĐừng thích tôi.\nMỗi khi nghĩ đến chuyện có ai đó thích mình…\ntôi sẽ trở nên yếu đuối.","ko":"아직도 나 좋아해요?\n네\n좋아하지 마요\n누가 나 좋아한다고 생각하면...\n약해져요","en":"Do you still like me?\nYes.\nYou shouldn't.\nWhen I think someone likes me...\nit makes me weak.","text":"Giờ vẫn thích sao?\nVâng.\nĐừng thích tôi.\nMỗi khi nghĩ đến chuyện có ai đó thích mình…\ntôi sẽ trở nên yếu đuối.\n아직도 나 좋아해요?\n네\n좋아하지 마요\n누가 나 좋아한다고 생각하면...\n약해져요\nDo you still like me?\nYes.\nYou shouldn't.\nWhen I think someone likes me...\nit makes me weak.","sourceUid":"merged-mrqhunhm-22","sourceNo":720},{"id":201,"readerNo":202,"displayNo":724,"n":724,"type":"narration","vi":"Nếu giờ tôi yếu đuối…\nthì sẽ chấm hết.\nVậy nên…\nđừng thích tôi nữa.","ko":"여기서 약해지면... 진짜 끝장이에요 그러니까... 나 좋아하지 마요","en":"If I become weak now,\nit will be the end.\nSo...\ndon't like me.","text":"Nếu giờ tôi yếu đuối…\nthì sẽ chấm hết.\nVậy nên…\nđừng thích tôi nữa.\n여기서 약해지면... 진짜 끝장이에요 그러니까... 나 좋아하지 마요\nIf I become weak now,\nit will be the end.\nSo...\ndon't like me.","sourceUid":"merged-mrqhxeyo-23","sourceNo":724},{"id":202,"readerNo":203,"displayNo":508,"n":508,"type":"narration","vi":"Tiền bối. Có chuyện gì sao? Chị đau quá. Chị bị bật móng tay. Chị không ngờ nó đau đến mức này. Đau đến mức… tưởng như chết mất. Chị chết mất thôi.","ko":"(송지원) 윤 선배...\n무슨 일 있어?\n손톱이...\n빠졌는데...\n이렇게...\n아픈 줄 몰랐어...\n아파서...\n죽을 거 같아\n죽을 거 같아...","en":"Yoon.\nAre you okay?\nIt hurts.\nMy nail came off.\nAnd I didn't know it would hurt so bad.\nIt hurts...\nHurts like I'm dying.\nIt feels like I'm dying.","text":"Tiền bối. Có chuyện gì sao? Chị đau quá. Chị bị bật móng tay. Chị không ngờ nó đau đến mức này. Đau đến mức… tưởng như chết mất. Chị chết mất thôi.\n(송지원) 윤 선배...\n무슨 일 있어?\n손톱이...\n빠졌는데...\n이렇게...\n아픈 줄 몰랐어...\n아파서...\n죽을 거 같아\n죽을 거 같아...\nYoon.\nAre you okay?\nIt hurts.\nMy nail came off.\nAnd I didn't know it would hurt so bad.\nIt hurts...\nHurts like I'm dying.\nIt feels like I'm dying.","sourceUid":"merged-mrqi4j1n-48","sourceNo":508},{"id":203,"readerNo":204,"displayNo":726,"n":726,"type":"narration","vi":"[Khóc][Khóc lớn]","ko":"[운다][크게 소리 내 운다]","en":"[Crying][Crying loudly]","text":"[Khóc][Khóc lớn]\n[운다][크게 소리 내 운다]\n[Crying][Crying loudly]","sourceUid":"merged-mrqhy44l-26","sourceNo":726},{"id":204,"readerNo":205,"displayNo":733,"n":733,"type":"narration","vi":"[Bài hát chủ đề bắt đầu]","ko":"[테마 노래 시작]","en":"[Theme song starts]","text":"[Bài hát chủ đề bắt đầu]\n[테마 노래 시작]\n[Theme song starts]","sourceUid":"ko-mrob2li9-1257","sourceNo":733},{"id":205,"readerNo":206,"displayNo":744,"n":744,"type":"narration","vi":"MÓNG TAY BẠN ĐÃ ĐỠ CHƯA?\nVâng, không sao. BẠN 28 TUỔI VẪN CHƯA TỐT NGHIỆP, LÝ DO LÀ GÌ? BIẾT THU NHẬP CỦA KANG YI NA CHỨ?\nTôi đã bảo lưu nhiều lần.\nTôi có biết qua, nhưng không liên quan đến tôi lắm.","ko":"네, 괜찮습니다\n휴학을 많이 했습니다\n대충 알고 있습니다\n저랑은 상관없는 일입니다","en":"HOW IS YOUR NAIL? It's okay now.\nYOU ARE 28 AND STILL IN SCHOOL, WHAT'S THE REASON?\nDO YOU KNOW KANG'S MONTHLY INCOME?\nI took a lot of breaks.\nApproximately, but it has nothing to do with me.","text":"MÓNG TAY BẠN ĐÃ ĐỠ CHƯA?\nVâng, không sao. BẠN 28 TUỔI VẪN CHƯA TỐT NGHIỆP, LÝ DO LÀ GÌ? BIẾT THU NHẬP CỦA KANG YI NA CHỨ?\nTôi đã bảo lưu nhiều lần.\nTôi có biết qua, nhưng không liên quan đến tôi lắm.\n네, 괜찮습니다\n휴학을 많이 했습니다\n대충 알고 있습니다\n저랑은 상관없는 일입니다\nHOW IS YOUR NAIL? It's okay now.\nYOU ARE 28 AND STILL IN SCHOOL, WHAT'S THE REASON?\nDO YOU KNOW KANG'S MONTHLY INCOME?\nI took a lot of breaks.\nApproximately, but it has nothing to do with me.","sourceUid":"merged-mrqigdus-56","sourceNo":744},{"id":206,"readerNo":207,"displayNo":752,"n":752,"type":"narration","vi":"THỨ CẤP BÁCH NHẤT?\nTiền.\nTIẾP THEO LÀ?\nGiấc ngủ.\nQUAN HỆ GIA ĐÌNH?\nMẹ và tôi.\nBẠN CHỈ CÓ MỖI MẸ LÀ NGƯỜI THÂN?\nTôi có một người em trai.\nBao giờ mới kết thúc ạ?\nBẠN CÓ NGHĨ CON MA CẠNH TỦ GIÀY LIÊN QUAN ĐẾN EM TRAI?\nTôi không biết nữa.","ko":"돈입니다 잠 엄마, 저... 동생이 있습니다 이거... 언제 끝나나요? 모르겠습니다","en":"MOST IN NEED?\nMoney.\nNEXT?\nSleep.\nYOUR FAMILY?\nMy mom and myself.\nIS YOUR MOTHER ONLY FAMILY?\nI have a brother.\nWhen will it finish?\nDO YOU THINK THE GHOST HAS SOMETHING TO DO WITH YOUR BROTHER?\nI don't know.","text":"THỨ CẤP BÁCH NHẤT?\nTiền.\nTIẾP THEO LÀ?\nGiấc ngủ.\nQUAN HỆ GIA ĐÌNH?\nMẹ và tôi.\nBẠN CHỈ CÓ MỖI MẸ LÀ NGƯỜI THÂN?\nTôi có một người em trai.\nBao giờ mới kết thúc ạ?\nBẠN CÓ NGHĨ CON MA CẠNH TỦ GIÀY LIÊN QUAN ĐẾN EM TRAI?\nTôi không biết nữa.\n돈입니다 잠 엄마, 저... 동생이 있습니다 이거... 언제 끝나나요? 모르겠습니다\nMOST IN NEED?\nMoney.\nNEXT?\nSleep.\nYOUR FAMILY?\nMy mom and myself.\nIS YOUR MOTHER ONLY FAMILY?\nI have a brother.\nWhen will it finish?\nDO YOU THINK THE GHOST HAS SOM   alert('VI candidates:\n'+candidateUrls('vi').join('\n')+'\n\nKO candidates:\n'+candidateUrls('ko').join('\n')+'\n\nTên trên GitHub phân biệt HOA/thường. Nếu Smart Flow không phát, kiểm tra file trong folder audio hoặc dùng nút chọn file thủ công.');
}
async function tryLoadCandidate(kind){
  let a=getAudio(kind); let cur=a.currentSrc||a.src||'';
  if(cur && cur.startsWith('blob:')) return cur;
  for(const src of candidateUrls(kind)){
    try{
      engine.pause(); engine.src=src; engine.load();
      let ok=await waitMedia(engine,8000);
      if(ok){ a.src=src; try{a.load();}catch(e){} return src; }
    }catch(e){}
  }
  return '';
}

function waitMedia(a,timeout=5000){return new Promise(res=>{if(a.readyState>=1)return res(true);let done=false;let ok=()=>{if(done)return;done=true;clean();res(true)};let bad=()=>{if(done)return;done=true;clean();res(false)};let clean=()=>{a.removeEventListener('loadedmetadata',ok);a.removeEventListener('canplay',ok);a.removeEventListener('error',bad);clearTimeout(to)};a.addEventListener('loadedmetadata',ok,{once:true});a.addEventListener('canplay',ok,{once:true});a.addEventListener('error',bad,{once:true});let to=setTimeout(bad,timeout)})}
async function prepareEngine(kind,start=0){let src=await tryLoadCandidate(kind);if(!src)throw new Error('Không load được audio '+kind.toUpperCase()+'. Kiểm tra folder audio/tên file trên GitHub, hoặc chọn file thủ công. Bấm Audio paths để xem đường dẫn đang thử.');if(engine.src!==src){engine.pause();engine.src=src;engine.load();}let ok=await waitMedia(engine,8000);if(!ok)throw new Error('Không load được audio '+kind.toUpperCase()+'. File có thể chưa tải xong trên GitHub Pages, thử chờ vài giây rồi bấm lại.');applyEngineVolume(kind);try{engine.currentTime=Math.max(0,Number(start||0));}catch(e){}return engine}
async function unlockAudio(show=true){try{let src=await tryLoadCandidate('vi'); if(!src) src=await tryLoadCandidate('ko'); if(!src){if(show)alert('Chưa tìm thấy audio VI/KO. Kiểm tra thư mục audio hoặc chọn file MP3 thủ công.');return false}if(engine.src!==src){engine.src=src;engine.load();await waitMedia(engine,8000)}let oldVol=engine.volume;engine.volume=0.001;try{engine.currentTime=Math.min(0.05,Math.max(0,engine.currentTime||0));}catch(e){}await engine.play();engine.pause();engine.volume=oldVol||1;applyEngineVolume(engineKind||'vi');unlocked=true;setMsg('Đã unlock audio cho iPhone. Bây giờ bấm Smart Flow hoặc VI/KO.');return true}catch(e){unlocked=false;if(show)alert('iPhone chưa cho phát audio. Hãy bấm Unlock iPhone Audio một lần nữa.\n'+(e&&e.message?e.message:e));return false}}

function render(){let q=($('q').value||'').toLowerCase(),h='';blocks.forEach((b,i)=>{if(q&&!blockSearchText(b).includes(q))return;let L=split(b),vr=vi[String(b.id)],kr=ko[String(b.id)];let time=(vr?'<span class="timeBadge">VI '+fmt(vr.start)+'→'+fmt(vr.end)+'</span>':'<span class="badge no">No VI</span>')+' '+(kr?'<span class="timeBadge">KO '+fmt(kr.start)+'→'+fmt(kr.end)+'</span>':'<span class="badge no">No KO</span>');let cls=(i===cur?'active ':'')+(String(b.type||'').toLowerCase().includes('narr')?'narr':'');h+='<div class="seg '+cls+'" onclick="cur='+i+';render();side()"><div class="meta"><span>Cue #'+label(b,i)+'</span><span>'+time+'</span></div><div class="badges">'+(L.vi?'<span class="badge vi">VI</span>':'')+(L.ko?'<span class="badge ko">KO</span>':'')+(L.en?'<span class="badge">EN</span>':'')+'</div>'+langHtml(L)+'<div class="row" style="margin-top:8px"><button class="good" onclick="event.stopPropagation();cur='+i+';playCurrent(\'vi\')">VI Dub</button><button class="violet" onclick="event.stopPropagation();cur='+i+';playCurrent(\'ko\')">KO Live</button><button class="warn" onclick="event.stopPropagation();cur='+i+';smart()">Smart</button></div></div>'});$('list').innerHTML=h;$('stat').textContent=blocks.length+' blocks · current Cue #'+label(blocks[cur]||{},cur)+(isIOS()?' · iPhone mode: dùng 1 audio engine':'');side()}
function side(){let L=split(blocks[cur]||{});$('vip').textContent=L.vi;$('kop').textContent=L.ko}

function play(kind,i=cur,token=++tok){return new Promise(async res=>{let r=getRange(kind,i);if(!r)return res();try{let a=await prepareEngine(kind,r.start);let end=Number(r.end||0);let done=false;let cleanup=()=>{a.removeEventListener('timeupdate',check);a.removeEventListener('ended',ended);a.removeEventListener('error',errored)};let finish=()=>{if(done)return;done=true;cleanup();a.pause();res()};let check=()=>{if(done)return;if(token!==tok||!flow&&token!==tok)return finish();if(a.currentTime>=end-0.03)finish()};let ended=()=>finish();let errored=()=>finish();a.addEventListener('timeupdate',check);a.addEventListener('ended',ended,{once:true});a.addEventListener('error',errored,{once:true});setMsg(`Đang phát ${kind.toUpperCase()} Cue #${label(blocks[i]||{},i)} ${fmt(r.start)} → ${fmt(r.end)}`);try{await a.play();}catch(e){cleanup();if(isIOS()&&!unlocked){alert('iPhone cần unlock audio trước. Bấm Unlock iPhone Audio rồi thử lại.')}else{alert('Không phát được audio: '+(e&&e.message?e.message:e));}return res()}setTimeout(check,80)}catch(e){alert(e.message||e);res()}})}
function playCurrent(k){stopAll(false);tok++;play(k,cur,tok)}
function sequenceFor(mode){if(mode==='vi')return['vi'];if(mode==='ko')return['ko'];if(mode==='vi-ko-vi')return['vi','ko','vi'];return['vi','ko']}
async function smart(){let token=++tok;flow=true;if(isIOS()&&!unlocked){let ok=await unlockAudio(false);if(!ok){alert('Trên iPhone, hãy bấm Unlock iPhone Audio trước, sau đó bấm Smart Flow.');flow=false;return}}let mode=$('mode').value, seq=sequenceFor(mode);for(let i=cur;i<blocks.length&&token===tok&&flow;i++){cur=i;render();document.querySelector('.seg.active')?.scrollIntoView({block:'center'});for(const k of seq){if(token!==tok||!flow)break;await play(k,i,token)}}if(token===tok)setMsg('Smart Flow đã dừng/kết thúc')}
function stopAll(inc=true){if(inc)tok++;flow=false;via.pause();koa.pause();engine.pause();setMsg('Đã stop')}
function next(){cur=Math.min(blocks.length-1,cur+1);render()}function prev(){cur=Math.max(0,cur-1);render()}
$('viaf').onchange=e=>{let f=e.target.files[0];if(f){via.src=URL.createObjectURL(f);applyVisibleVolume('vi');if(!engine.src){engine.src=via.src;engineKind='vi';applyEngineVolume('vi')}unlocked=false;setMsg('Đã chọn VI audio. Nếu dùng iPhone, bấm Unlock.')}};
$('koaf').onchange=e=>{let f=e.target.files[0];if(f){koa.src=URL.createObjectURL(f);applyVisibleVolume('ko');unlocked=false;setMsg('Đã chọn KO audio. Nếu dùng iPhone, bấm Unlock.')}};
function tryAuto(){let vu=candidateUrls('vi')[0], ku=candidateUrls('ko')[0]; if(vu)via.src=vu; if(ku)koa.src=ku; applyVisibleVolume('vi');applyVisibleVolume('ko'); try{via.load();koa.load();}catch(e){} setMsg('Đã khai báo audio từ GitHub. Nếu iPhone chưa nghe, chờ vài giây rồi bấm Unlock/Smart Flow.')}initReaderVolumeControls();tryAuto();
(function addIphoneButtons(){let row=document.querySelector('.float .row');if(row){let b=document.createElement('button');b.textContent='Unlock iPhone Audio';b.className='warn';b.onclick=()=>unlockAudio(true);row.insertBefore(b,row.children[3]||null);let d=document.createElement('button');d.textContent='Audio paths';d.onclick=()=>showAudioPaths();row.appendChild(d);}})();
render();</script></body></html>
