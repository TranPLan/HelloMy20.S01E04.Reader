="wrap"><div id="list"></div></div><div class="float"><div class="row"><button class="good" onclick="playCurrent('vi')">VI Dub</button><button class="violet" onclick="playCurrent('ko')">KO Live</button><button class="warn" onclick="smart()">Smart</button><button class="stop" onclick="stopAll()">Stop</button></div></div><script>const project={"version":"READER_V6_DUB_VI_KO_LIVE_PROJECT","title":"HelloMy20 S01E04","movieTitle":"HelloMy20","episodeTitle":"S01E04","githubSlug":"hellomy20_s01e04","audioFolder":"../audio","viAudioFile":"hellomy20_s01e04_VI_Dub.mp3","koAudioFile":"hellomy20_s01e04_KO_Live.mp3","source":"Subtitle Dub VI + KO Live Cut Studio","blocks":[{"id":0,"readerNo":1,"displayNo":"N1","n":"N1","type":"narration","vi":"Xin Chào Tuổi 20 S01E04","ko":"청춘시대 S01E04","en":"Hello My Twenties S01E04","text":"Xin Chào Tuổi 20 S01E04\n청춘시대 S01E04\nHello My Twenties S01E04","sourceUid":"nar-mrobd9ts-bim14e","sourceNo":"N1"},{"id":1,"readerNo":2,"displayNo":1,"n":1,"type":"narration","vi":"NỘI QUY CỦA BELLE EPOQUE CẤM ĐƯA ĐÀN ÔNG VÀO NHÀ","ko":"","en":"","text":"NỘI QUY CỦA BELLE EPOQUE CẤM ĐƯA ĐÀN ÔNG VÀO NHÀ","sourceUid":"vi-mrob2idt-1","sourceNo":1},{"id":2,"readerNo":3,"displayNo":4,"n":4,"type":"narration","vi":"[Nhạc chủ đề chính bắt đầu]\n[Tiếng máy nướng bánh mì nhổ bánh mì]\n[Nhạc chủ đề chính kết thúc]\n[Nhạc nền bắt đầu]","ko":"[메인 주제 음악 시작] [토스터기 빵 뱉는 소리] [메인 주제 음악 끝] [배경 음악 시작]","en":"[Main theme music starts]\n[Sound of toaster spitting bread]\n[Main theme music ends]\n[Background music starts]","text":"[Nhạc chủ đề chính bắt đầu]\n[Tiếng máy nướng bánh mì nhổ bánh mì]\n[Nhạc chủ đề chính kết thúc]\n[Nhạc nền bắt đầu]\n[메인 주제 음악 시작] [토스터기 빵 뱉는 소리] [메인 주제 음악 끝] [배경 음악 시작]\n[Main theme music starts]\n[Sound of toaster spitting bread]\n[Main theme music ends]\n[Background music starts]","sourceUid":"merged-mrob763m-1802","sourceNo":4},{"id":3,"readerNo":4,"displayNo":3,"n":3,"type":"narration","vi":"Đã có lúc tôi khát khao được đặc biệt…\nvì tin mình được sinh ra với vận mệnh đặc biệt,\nvà sẽ sống một cuộc đời khác biệt.","ko":"(윤진명) 특별한 것에 동경하던 때가 있었다\n나는 특별한 운명을 타고났다고\n남다른 삶을 살 거라 믿었다","en":"There was a time I wanted to be special... thinking I was born special, believing that I would have a special life.","text":"Đã có lúc tôi khát khao được đặc biệt…\nvì tin mình được sinh ra với vận mệnh đặc biệt,\nvà sẽ sống một cuộc đời khác biệt.\n(윤진명) 특별한 것에 동경하던 때가 있었다\n나는 특별한 운명을 타고났다고\n남다른 삶을 살 거라 믿었다\nThere was a time I wanted to be special... thinking I was born special, believing that I would have a special life.","sourceUid":"merged-mrovsoxc-2","sourceNo":3},{"id":4,"readerNo":5,"displayNo":10,"n":10,"type":"narration","vi":"Tôi đã tự hứa rằng dù có chết…\ncũng không được tầm thường.\nTầm thường là thứ dễ nhìn thấy…\nlà thứ không nổi bật.\nTầm thường có nghĩa là…\nrất nhàm chán.","ko":"죽어도 평범해지진 않을 거라\n다짐했었다\n평범하다는 것은 흔한 것\n평범하다는 것은... 눈에 띄지 않는 것\n평범하다는 것은... 지루하다는 의미였다","en":"I thought to myself that...\nI won't have an ordinary life.\nBeing ordinary was being moderate...\nnot standing out.\nOrdinary meant...\nbeing boring.","text":"Tôi đã tự hứa rằng dù có chết…\ncũng không được tầm thường.\nTầm thường là thứ dễ nhìn thấy…\nlà thứ không nổi bật.\nTầm thường có nghĩa là…\nrất nhàm chán.\n죽어도 평범해지진 않을 거라\n다짐했었다\n평범하다는 것은 흔한 것\n평범하다는 것은... 눈에 띄지 않는 것\n평범하다는 것은... 지루하다는 의미였다\nI thought to myself that...\nI won't have an ordinary life.\nBeing ordinary was being moderate...\nnot standing out.\nOrdinary meant...\nbeing boring.","sourceUid":"merged-mrovumt5-3","sourceNo":10},{"id":5,"readerNo":6,"displayNo":16,"n":16,"type":"narration","vi":"[tiếng chim] [tiếng bíp của máy đo nhịp tim bệnh viện]\n[Tiếng đóng cửa] [Tiếng giày]","ko":"[새 소리] [병원 맥박계 삑삑 소리] [문 닫는 소리] [신발 소리]","en":"[bird sound] [hospital pulsometer beeping]\n[Sound of door closing] [Sound of shoes]","text":"[tiếng chim] [tiếng bíp của máy đo nhịp tim bệnh viện]\n[Tiếng đóng cửa] [Tiếng giày]\n[새 소리] [병원 맥박계 삑삑 소리] [문 닫는 소리] [신발 소리]\n[bird sound] [hospital pulsometer beeping]\n[Sound of door closing] [Sound of shoes]","sourceUid":"merged-mrovvt35-4","sourceNo":16},{"id":6,"readerNo":7,"displayNo":12,"n":12,"type":"narration","vi":"Khi ấy, đối với tôi,\ntrở nên tầm thường là một sự sỉ nhục.","ko":"그때의 나에게... 평범하다는 것은... 모욕이었다","en":"At that time, to me, being ordinary was an insult.","text":"Khi ấy, đối với tôi,\ntrở nên tầm thường là một sự sỉ nhục.\n그때의 나에게... 평범하다는 것은... 모욕이었다\nAt that time, to me, being ordinary was an insult.","sourceUid":"merged-mrovwx21-5","sourceNo":12},{"id":7,"readerNo":8,"displayNo":12,"n":12,"type":"narration","vi":"Em chỉ tò mò chị bán mạng như vậy chỉ để làm nhân viên văn phòng thôi sao.","ko":"그렇게까지 열심히 해서 되고 싶은 게...\n겨우 회사원인가 궁금해서...","en":"I wondered why you were working so hard just to become a salary man.","text":"Em chỉ tò mò chị bán mạng như vậy chỉ để làm nhân viên văn phòng thôi sao.\n그렇게까지 열심히 해서 되고 싶은 게...\n겨우 회사원인가 궁금해서...\nI wondered why you were working so hard just to become a salary man.","sourceUid":"merged-mrovzgej-6","sourceNo":12},{"id":8,"readerNo":9,"displayNo":13,"n":13,"type":"narration","vi":"Ừ, tôi muốn làm nhân viên văn phòng.","ko":"(윤진명) 응\n회사원이 될 거야","en":"Yes, that's what I want.","text":"Ừ, tôi muốn làm nhân viên văn phòng.\n(윤진명) 응\n회사원이 될 거야\nYes, that's what I want.","sourceUid":"merged-mrow02se-7","sourceNo":13},{"id":9,"readerNo":10,"displayNo":15,"n":15,"type":"narration","vi":"Tôi sẽ nỗ lực đến chết\nchỉ để trở nên tầm thường.","ko":"죽을 만큼 노력해서...\n평범해질 거야","en":"I will try with all I have...\nto be ordinary.","text":"Tôi sẽ nỗ lực đến chết\nchỉ để trở nên tầm thường.\n죽을 만큼 노력해서...\n평범해질 거야\nI will try with all I have...\nto be ordinary.","sourceUid":"merged-mrow0tdf-8","sourceNo":15},{"id":10,"readerNo":11,"displayNo":26,"n":26,"type":"narration","vi":"[Tiếng đặt chậu nhựa]","ko":"[플라스틱 대야 놓는 소리]","en":"[Sound of placing plastic basin]","text":"[Tiếng đặt chậu nhựa]\n[플라스틱 대야 놓는 소리]\n[Sound of placing plastic basin]","sourceUid":"ko-mrob2li7-550","sourceNo":26},{"id":11,"readerNo":12,"displayNo":17,"n":17,"type":"narration","vi":"Mẹ bảo con chờ ở sảnh mà.","ko":"로비에서 기다리라고 했잖아","en":"I told you to wait in the lobby.","text":"Mẹ bảo con chờ ở sảnh mà.\n로비에서 기다리라고 했잖아\nI told you to wait in the lobby.","sourceUid":"merged-mrow1mia-9","sourceNo":17},{"id":12,"readerNo":13,"displayNo":28,"n":28,"type":"narration","vi":"[Tiếng mở dây kéo túi]","ko":"[가방 지퍼 여는 소리]","en":"[Sound of opening bag zipper]","text":"[Tiếng mở dây kéo túi]\n[가방 지퍼 여는 소리]\n[Sound of opening bag zipper]","sourceUid":"ko-mrob2li7-552","sourceNo":28},{"id":13,"readerNo":14,"displayNo":30,"n":30,"type":"narration","vi":"[Đóng dây kéo túi]","ko":"[가방 지퍼 닫는다]","en":"[Closes the bag zipper]","text":"[Đóng dây kéo túi]\n[가방 지퍼 닫는다]\n[Closes the bag zipper]","sourceUid":"ko-mrob2li7-554","sourceNo":30},{"id":14,"readerNo":15,"displayNo":19,"n":19,"type":"narration","vi":"Đây.\nMẹ xin lỗi vì làm phiền con.","ko":"여깄어요 귀찮게 해서 미안하다","en":"Here it is.\nSorry for bothering you.","text":"Đây.\nMẹ xin lỗi vì làm phiền con.\n여깄어요 귀찮게 해서 미안하다\nHere it is.\nSorry for bothering you.","sourceUid":"merged-mrow3lh2-10","sourceNo":19},{"id":15,"readerNo":16,"displayNo":32,"n":32,"type":"narration","vi":"Thôi con đi đi.\nVâng.","ko":"그만 가봐\n네...","en":"You can go now. Yeah.","text":"Thôi con đi đi.\nVâng.\n그만 가봐\n네...\nYou can go now. Yeah.","sourceUid":"merged-mrow6b6a-11","sourceNo":32},{"id":16,"readerNo":17,"displayNo":21,"n":21,"type":"narration","vi":"Giờ đây, tôi đang ở mức dưới tầm thường.","ko":"(윤진명) 나는 지금 평범 이하다","en":"At this moment, I am less ordinary.","text":"Giờ đây, tôi đang ở mức dưới tầm thường.\n(윤진명) 나는 지금 평범 이하다\nAt this moment, I am less ordinary.","sourceUid":"merged-mrow7sho-12","sourceNo":21},{"id":17,"readerNo":18,"displayNo":37,"n":37,"type":"narration","vi":"TẬP 4, GIẤY MƠ CỦA TÔI LÀ LÀM VIỆC Ở CÔNG TY\n[Nhạc nền kết thúc] [Nhạc nền thô ráp bắt đầu]\n[Nhạc nền thô ráp kết thúc]","ko":"[배경 음악 끝] [거친 배경 음악 시작]\n[거친 배경 음악 끝]","en":"[Background music ends] [Rough background music starts] [Rough background music ends]","text":"TẬP 4, GIẤY MƠ CỦA TÔI LÀ LÀM VIỆC Ở CÔNG TY\n[Nhạc nền kết thúc] [Nhạc nền thô ráp bắt đầu]\n[Nhạc nền thô ráp kết thúc]\n[배경 음악 끝] [거친 배경 음악 시작]\n[거친 배경 음악 끝]\n[Background music ends] [Rough background music starts] [Rough background music ends]","sourceUid":"merged-mrow9far-13","sourceNo":37},{"id":18,"readerNo":19,"displayNo":25,"n":25,"type":"narration","vi":"Chị đi đây.\n- Tạm biệt chị. - Tiền bối đi cẩn thận.\nTạm biệt.","ko":"다녀올게 다녀오세요 선배 다녀와 잘 갔다 와","en":"I will be back. -Bye. -See you. Bye.","text":"Chị đi đây.\n- Tạm biệt chị. - Tiền bối đi cẩn thận.\nTạm biệt.\n다녀올게 다녀오세요 선배 다녀와 잘 갔다 와\nI will be back. -Bye. -See you. Bye.","sourceUid":"merged-mrowa7zl-14","sourceNo":25},{"id":19,"readerNo":20,"displayNo":30,"n":30,"type":"narration","vi":"Lại là thứ Sáu rồi, ngày mà tiếng sáo phát ra từ mông chị ấy.\nTrời ạ, cậu ăn nói kiểu gì thế?\nNghe cao cấp không?\nTiền bối Yoon…\nlàm thêm đến mấy việc ạ?","ko":"아휴... 금요일이구먼\n윤 선배 엉덩이에서 피리 소리 나는 날\n에헤이... 진짜 말 한마디를 해도\n고급지지?\n윤 선배요...\n아르바이트 몇 개나 해요?","en":"It's Friday, the day her bottom blows flute.\nLanguage, please.\nHigh class, right?\nYoon...\nhow many jobs does she have?","text":"Lại là thứ Sáu rồi, ngày mà tiếng sáo phát ra từ mông chị ấy.\nTrời ạ, cậu ăn nói kiểu gì thế?\nNghe cao cấp không?\nTiền bối Yoon…\nlàm thêm đến mấy việc ạ?\n아휴... 금요일이구먼\n윤 선배 엉덩이에서 피리 소리 나는 날\n에헤이... 진짜 말 한마디를 해도\n고급지지?\n윤 선배요...\n아르바이트 몇 개나 해요?\nIt's Friday, the day her bottom blows flute.\nLanguage, please.\nHigh class, right?\nYoon...\nhow many jobs does she have?","sourceUid":"merged-mrowe8mu-16","sourceNo":30},{"id":20,"readerNo":21,"displayNo":30,"n":30,"type":"narration","vi":"Chắc là làm đều đặn ba việc,","ko":"정기적으로 하는 건 세 갤걸","en":"Three regular ones","text":"Chắc là làm đều đặn ba việc,\n정기적으로 하는 건 세 갤걸\nThree regular ones","sourceUid":"merged-mrowewxu-17","sourceNo":30},{"id":21,"readerNo":22,"displayNo":32,"n":32,"type":"narration","vi":"trừ những việc làm ngắn ngày ra.","ko":"그때그때 하는 건 빼고...","en":"without contingent ones.","text":"trừ những việc làm ngắn ngày ra.\n그때그때 하는 건 빼고...\nwithout contingent ones.","sourceUid":"merged-mrowfalv-18","sourceNo":32},{"id":22,"readerNo":23,"displayNo":56,"n":56,"type":"narration","vi":"[Tiếng đóng cửa] [Cười]","ko":"[문 닫는 소리] [웃는다]","en":"[Sound of door closing] [Laughing]","text":"[Tiếng đóng cửa] [Cười]\n[문 닫는 소리] [웃는다]\n[Sound of door closing] [Laughing]","sourceUid":"merged-mrowggn6-20","sourceNo":56},{"id":23,"readerNo":24,"displayNo":39,"n":39,"type":"narration","vi":"Tạm biệt cô giáo ạ. Tạm biệt. Chị ơi… Chưa gì đã xong rồi ư? Cô giáo kết thúc đúng giờ quá.\nVậy tôi xin phép.\nChờ lát.","ko":"(남학생) 샘, 안녕히 가세요\n응, 안녕\n저기...\n벌써 끝났어요?\n칼같이 끝내네...\n그럼...\n아이, 잠깐만, 잠깐만","en":"Bye.\nWe are done.\nAlready?\nRight at the exact time.\nWait for a minute.","text":"Tạm biệt cô giáo ạ. Tạm biệt. Chị ơi… Chưa gì đã xong rồi ư? Cô giáo kết thúc đúng giờ quá.\nVậy tôi xin phép.\nChờ lát.\n(남학생) 샘, 안녕히 가세요\n응, 안녕\n저기...\n벌써 끝났어요?\n칼같이 끝내네...\n그럼...\n아이, 잠깐만, 잠깐만\nBye.\nWe are done.\nAlready?\nRight at the exact time.\nWait for a minute.","sourceUid":"merged-mrowhrm0-21","sourceNo":39},{"id":24,"readerNo":25,"displayNo":41,"n":41,"type":"narration","vi":"Sao lúc nào cô giáo cũng bận thế?\nCái này…\ntôi làm để đưa cô.","ko":"아휴, 뭐가 그렇게 맨날 바빠요?\n아...\n이거 선생님 주려고 만든 건데...","en":"You are always busy.\nThis...\nI made this for you.","text":"Sao lúc nào cô giáo cũng bận thế?\nCái này…\ntôi làm để đưa cô.\n아휴, 뭐가 그렇게 맨날 바빠요?\n아...\n이거 선생님 주려고 만든 건데...\nYou are always busy.\nThis...\nI made this for you.","sourceUid":"merged-mrowivvu-22","sourceNo":41},{"id":25,"readerNo":26,"displayNo":46,"n":46,"type":"narration","vi":"Bỏ vào đâu để đựng đây?\nCô giáo đang ở trọ nhỉ?\nChắc ăn uống không được đầy đủ.\nCô cầm đi.\nNhanh lên.\nCảm ơn nhiều ạ.","ko":"어디다 담아주나...\n어...\n여기...\n자취한다고 했죠?\n아휴... 먹는 게 오죽하겠어요\n자! 받아요\n얼른!\n잘 먹겠습니다","en":"Which container should I use?\nYou live by yourself, right?\nIt must be difficult for you to cook.\nPlease take this.\nCome on.\nThank you.","text":"Bỏ vào đâu để đựng đây?\nCô giáo đang ở trọ nhỉ?\nChắc ăn uống không được đầy đủ.\nCô cầm đi.\nNhanh lên.\nCảm ơn nhiều ạ.\n어디다 담아주나...\n어...\n여기...\n자취한다고 했죠?\n아휴... 먹는 게 오죽하겠어요\n자! 받아요\n얼른!\n잘 먹겠습니다\nWhich container should I use?\nYou live by yourself, right?\nIt must be difficult for you to cook.\nPlease take this.\nCome on.\nThank you.","sourceUid":"merged-mrowlv71-25","sourceNo":46},{"id":26,"readerNo":27,"displayNo":73,"n":73,"type":"narration","vi":"[Tiếng túi xào xạc] [Tiếng mưa tầm tã]\n[Nhạc chủ đề bắt đầu] [Âm thanh của bánh kếp]","ko":"[봉지 부스럭 거리는 소리][비 쏟아지는 소리]\n[테마 음악 시작] [부침개 치 소리]","en":"[Sound of rustling bags] [Sound of pouring rain]\n[Theme music starts] [Sound of pancakes]","text":"[Tiếng túi xào xạc] [Tiếng mưa tầm tã]\n[Nhạc chủ đề bắt đầu] [Âm thanh của bánh kếp]\n[봉지 부스럭 거리는 소리][비 쏟아지는 소리]\n[테마 음악 시작] [부침개 치 소리]\n[Sound of rustling bags] [Sound of pouring rain]\n[Theme music starts] [Sound of pancakes]","sourceUid":"merged-mrowmmbc-26","sourceNo":73},{"id":27,"readerNo":28,"displayNo":51,"n":51,"type":"narration","vi":"Còn nhà hàng?\nChỉ làm cuối tuần ạ?\nTuần ba buổi. Thứ Sáu, thứ Bảy, Chủ Nhật.\nĂn thôi nào.\nBát đĩa đây nào.","ko":"레스토랑은?\n주말에만 가요?\n아니! 금, 토, 일. 주 3회\n자 먹자...\n그릇! 그릇! 그릇...","en":"Restaurant?\nOnly on weekends?\nNo, Friday, Saturday, and Sunday.\nLet's eat.\nPlate, plate.","text":"Còn nhà hàng?\nChỉ làm cuối tuần ạ?\nTuần ba buổi. Thứ Sáu, thứ Bảy, Chủ Nhật.\nĂn thôi nào.\nBát đĩa đây nào.\n레스토랑은?\n주말에만 가요?\n아니! 금, 토, 일. 주 3회\n자 먹자...\n그릇! 그릇! 그릇...\nRestaurant?\nOnly on weekends?\nNo, Friday, Saturday, and Sunday.\nLet's eat.\nPlate, plate.","sourceUid":"merged-mrowphjn-29","sourceNo":51},{"id":28,"readerNo":29,"displayNo":81,"n":81,"type":"narration","vi":"[Tiếng mưa rơi] [Hít một hơi thật sâu]\n[Nhân viên nói to]","ko":"[비 쏟아지는 소리] [심호흡 한다] [종업원들 크게 얘기한다]","en":"[Sound of pouring rain] [Takes a deep breath]\n[Employees talk loudly]","text":"[Tiếng mưa rơi] [Hít một hơi thật sâu]\n[Nhân viên nói to]\n[비 쏟아지는 소리] [심호흡 한다] [종업원들 크게 얘기한다]\n[Sound of pouring rain] [Takes a deep breath]\n[Employees talk loudly]","sourceUid":"merged-mrowqbsw-30","sourceNo":81},{"id":29,"readerNo":30,"displayNo":54,"n":54,"type":"narration","vi":"Thứ Sáu, thứ Bảy, Chủ Nhật là lúc bận nhất.\nChị cũng có đứa bạn làm nhà hàng vào giờ ấy,","ko":"(송지원) 금, 토, 일 그 시간이 제일 바쁜 시간인데 나 아는 애도 그 시간대에 레스토랑 알바한 적 있거든","en":"Friday, Saturday, and Sunday are the most busy days. One of my friends did part time during the weekends,","text":"Thứ Sáu, thứ Bảy, Chủ Nhật là lúc bận nhất.\nChị cũng có đứa bạn làm nhà hàng vào giờ ấy,\n(송지원) 금, 토, 일 그 시간이 제일 바쁜 시간인데 나 아는 애도 그 시간대에 레스토랑 알바한 적 있거든\nFriday, Saturday, and Sunday are the most busy days. One of my friends did part time during the weekends,","sourceUid":"merged-mrowr5m1-31","sourceNo":54},{"id":30,"readerNo":31,"displayNo":87,"n":87,"type":"narration","vi":"nhưng không chịu được đến một tháng vì đau cổ tay.\nHọc khoa thể chất cơ đấy.\nNhưng tiền bối Yoon làm được hai năm, đúng là người đàn bà thép.\nCùng hạng với Margaret Thatcher.","ko":"한 달도 못 버텼어 손목 힘줄 늘어나서\n그것도 체육과 남자가\n근데, 윤 선배는 2년째!\n철의 여인이지\n대처, 메르켈하고 동급","en":"she didn't even make it for a month,\nwith muscle aches every where.\nBut Yoon's been working for two years, she is an iron lady.\nTruly extraordinary.","text":"nhưng không chịu được đến một tháng vì đau cổ tay.\nHọc khoa thể chất cơ đấy.\nNhưng tiền bối Yoon làm được hai năm, đúng là người đàn bà thép.\nCùng hạng với Margaret Thatcher.\n한 달도 못 버텼어 손목 힘줄 늘어나서\n그것도 체육과 남자가\n근데, 윤 선배는 2년째!\n철의 여인이지\n대처, 메르켈하고 동급\nshe didn't even make it for a month,\nwith muscle aches every where.\nBut Yoon's been working for two years, she is an iron lady.\nTruly extraordinary.","sourceUid":"merged-mrowxv5u-35","sourceNo":87},{"id":31,"readerNo":32,"displayNo":61,"n":61,"type":"narration","vi":"Cái này thú vị ghê.\nMuốn giết thời gian thì cái này là nhất.\nĐưa chị màu vàng với.","ko":"야, 이거 재밌다\n시간 때우는 데는 최고라니까\n노란색 줘봐 봐","en":"It's quite fun.\nIt is the best for killing time.\nGive me yellow.","text":"Cái này thú vị ghê.\nMuốn giết thời gian thì cái này là nhất.\nĐưa chị màu vàng với.\n야, 이거 재밌다\n시간 때우는 데는 최고라니까\n노란색 줘봐 봐\nIt's quite fun.\nIt is the best for killing time.\nGive me yellow.","sourceUid":"merged-mrowz2pe-36","sourceNo":61},{"id":32,"readerNo":33,"displayNo":63,"n":63,"type":"narration","vi":"Mà sao chị ấy làm ca đêm ở cửa hàng tiện lợi?\nGiờ đấy nguy hiểm mà.","ko":"근데요, 편의점 알바는 왜 새벽에 해요?\n새벽은 위험하잖아요 사람도 없고...","en":"Why does she work overnight at a convenience store?\nIsn't it dangerous?","text":"Mà sao chị ấy làm ca đêm ở cửa hàng tiện lợi?\nGiờ đấy nguy hiểm mà.\n근데요, 편의점 알바는 왜 새벽에 해요?\n새벽은 위험하잖아요 사람도 없고...\nWhy does she work overnight at a convenience store?\nIsn't it dangerous?","sourceUid":"merged-mrowzteq-37","sourceNo":63},{"id":33,"readerNo":34,"displayNo":65,"n":65,"type":"narration","vi":"Còn không có khách.\nÀ, hay lương cao hơn ạ?\nTiền lương vẫn vậy.\nChị ấy muốn học nên mới làm, vì tầm ấy không có khách.","ko":"아... 시급을 더 줘요?\n시급은 똑같아\n공부하려고 새벽에 하는 거야 그 시간에 손님이 없으니까","en":"Not many customers.\nDoes it pay you more?\nIt's the same rate.\nShe is trying to study there because there aren't many customers.","text":"Còn không có khách.\nÀ, hay lương cao hơn ạ?\nTiền lương vẫn vậy.\nChị ấy muốn học nên mới làm, vì tầm ấy không có khách.\n아... 시급을 더 줘요?\n시급은 똑같아\n공부하려고 새벽에 하는 거야 그 시간에 손님이 없으니까\nNot many customers.\nDoes it pay you more?\nIt's the same rate.\nShe is trying to study there because there aren't many customers.","sourceUid":"merged-mrox1p2i-41","sourceNo":65},{"id":34,"readerNo":35,"displayNo":68,"n":68,"type":"narration","vi":"Một tháng chị ấy kiếm được bao nhiêu nhỉ?","ko":"윤 선배 한 달 수입이 얼마나 될까?","en":"How much would she make a month?","text":"Một tháng chị ấy kiếm được bao nhiêu nhỉ?\n윤 선배 한 달 수입이 얼마나 될까?\nHow much would she make a month?","sourceUid":"merged-mroyiz8v-42","sourceNo":68},{"id":35,"readerNo":36,"displayNo":69,"n":69,"type":"narration","vi":"Cứ cho là dạy thêm 300.000 won.","ko":"(송지원) 과외가 30만 원이라 치고","en":"Let's say 300,000 won for private tutoring.","text":"Cứ cho là dạy thêm 300.000 won.\n(송지원) 과외가 30만 원이라 치고\nLet's say 300,000 won for private tutoring.","sourceUid":"merged-mroyjox4-43","sourceNo":69},{"id":36,"readerNo":37,"displayNo":71,"n":71,"type":"narration","vi":"Dạy thêm mà chỉ được có vậy ạ?\nEm còn tưởng được nhiều lắm cơ.","ko":"(유은재) 으흥? 과외가 그것밖에 안 돼요?\n되게 많이 받는 줄 알았는데...","en":"Just that for a private lesson?\nI thought it was much more.","text":"Dạy thêm mà chỉ được có vậy ạ?\nEm còn tưởng được nhiều lắm cơ.\n(유은재) 으흥? 과외가 그것밖에 안 돼요?\n되게 많이 받는 줄 알았는데...\nJust that for a private lesson?\nI thought it was much more.","sourceUid":"merged-mroykltr-44","sourceNo":71},{"id":37,"readerNo":38,"displayNo":75,"n":75,"type":"narration","vi":"Dạo này lương dạy thêm bèo lắm.\nDạy thêm 300.000 won,\nlàm ở nhà hàng 7.000 won một giờ.\nVậy tầm 400.000 won.","ko":"(송지원) 요새 과외 얼마 안 줘\n과외가 30만 원\n레스토랑 시급이 7천 원 정도니까...\n만 원","en":"Not a lot nowadays.\n,000 for tutoring,\nand her hourly pay at the restaurant is 7,000 won.\nSo, 400,000 won.","text":"Dạo này lương dạy thêm bèo lắm.\nDạy thêm 300.000 won,\nlàm ở nhà hàng 7.000 won một giờ.\nVậy tầm 400.000 won.\n(송지원) 요새 과외 얼마 안 줘\n과외가 30만 원\n레스토랑 시급이 7천 원 정도니까...\n만 원\nNot a lot nowadays.\n,000 for tutoring,\nand her hourly pay at the restaurant is 7,000 won.\nSo, 400,000 won.","sourceUid":"merged-mroylxwu-47","sourceNo":75},{"id":38,"readerNo":39,"displayNo":76,"n":76,"type":"narration","vi":"Cửa hàng tiện lợi sáu tiếng một ngày, năm ngày một tuần, là 30 giờ.","ko":"편의점이 주중 오일에 여섯 시간씩 30시간","en":"Convenience store is six hours a day, five days a week. 30 hours,","text":"Cửa hàng tiện lợi sáu tiếng một ngày, năm ngày một tuần, là 30 giờ.\n편의점이 주중 오일에 여섯 시간씩 30시간\nConvenience store is six hours a day, five days a week. 30 hours,","sourceUid":"merged-mroznhi5-48","sourceNo":76},{"id":39,"readerNo":40,"displayNo":81,"n":81,"type":"narration","vi":"Coi như lương ở mức tối thiểu\nthì là 720.000 won.\n,000.\nVậy tầm 1.400.000 won.\nChà, 1.400.000 won?","ko":"최저임금이라고 치면...\n만 원\n만 원쯤 되네...\n우와... 140?","en":"if she gets paid minimum wage,\n,000.\nSo, about 1,400,000 won.\nWow, 1,400,000 won?","text":"Coi như lương ở mức tối thiểu\nthì là 720.000 won.\n,000.\nVậy tầm 1.400.000 won.\nChà, 1.400.000 won?\n최저임금이라고 치면...\n만 원\n만 원쯤 되네...\n우와... 140?\nif she gets paid minimum wage,\n,000.\nSo, about 1,400,000 won.\nWow, 1,400,000 won?","sourceUid":"merged-mrozpf8m-49","sourceNo":81},{"id":40,"readerNo":41,"displayNo":82,"n":82,"type":"narration","vi":"Có khi còn ít hơn số tiền chị Kang nhận được từ một người tình.\nThật ấy ạ?\nThế chị Kang nhận bao nhiêu?","ko":"그래 봤자 강 언니가\n애인 한 명한테 받는 용돈보다 적을걸\n진짜요?\n강 언니는 얼마 받는데?","en":"Probably still less than what Kang gets from one lover.\nReally?\nHow much does she get?","text":"Có khi còn ít hơn số tiền chị Kang nhận được từ một người tình.\nThật ấy ạ?\nThế chị Kang nhận bao nhiêu?\n그래 봤자 강 언니가\n애인 한 명한테 받는 용돈보다 적을걸\n진짜요?\n강 언니는 얼마 받는데?\nProbably still less than what Kang gets from one lover.\nReally?\nHow much does she get?","sourceUid":"merged-mrozr8il-51","sourceNo":82},{"id":41,"readerNo":42,"displayNo":86,"n":86,"type":"narration","vi":"Tổng biên tập bọn tớ bảo tầm chị ấy thì phải được khoảng hai đến ba triệu.\nĐiên rồi, điên mất rồi.\nThế giới này thật sự điên mất rồi.","ko":"강 언니 정도면 2, 3백 받을 거라던데 우리 편집장이... 미쳤네, 미쳤어... 세상은 완전 미쳤어","en":"I heard it could be around 2-3 million won from our editor.\nCrazy.\nThis world is crazy.","text":"Tổng biên tập bọn tớ bảo tầm chị ấy thì phải được khoảng hai đến ba triệu.\nĐiên rồi, điên mất rồi.\nThế giới này thật sự điên mất rồi.\n강 언니 정도면 2, 3백 받을 거라던데 우리 편집장이... 미쳤네, 미쳤어... 세상은 완전 미쳤어\nI heard it could be around 2-3 million won from our editor.\nCrazy.\nThis world is crazy.","sourceUid":"merged-mrozsuce-53","sourceNo":86},{"id":42,"readerNo":43,"displayNo":118,"n":118,"type":"narration","vi":"[Nhạc chủ đề kết thúc]","ko":"[테마 음악 끝]","en":"[Theme music ends]","text":"[Nhạc chủ đề kết thúc]\n[테마 음악 끝]\n[Theme music ends]","sourceUid":"ko-mrob2li7-642","sourceNo":118},{"id":43,"readerNo":44,"displayNo":89,"n":89,"type":"narration","vi":"Quản lý, chúng tôi xin phép về trước ạ. Mọi người vất vả rồi. - Tạm biệt ạ. - Tạm biệt mọi người.","ko":"매니저님, 저희 먼저 퇴근하겠습니다\n네, 들어가세요\n- 안녕히 계세요 - 네, 수고하셨습니다","en":"Manager, we are leaving now.\nBye.\n-Bye. -Thank you.","text":"Quản lý, chúng tôi xin phép về trước ạ. Mọi người vất vả rồi. - Tạm biệt ạ. - Tạm biệt mọi người.\n매니저님, 저희 먼저 퇴근하겠습니다\n네, 들어가세요\n- 안녕히 계세요 - 네, 수고하셨습니다\nManager, we are leaving now.\nBye.\n-Bye. -Thank you.","sourceUid":"merged-mrozu7ls-54","sourceNo":89},{"id":44,"readerNo":45,"displayNo":92,"n":92,"type":"narration","vi":"Tôi xin lỗi đã đến muộn.\nSao lại muộn?\nTôi xin lỗi ạ.","ko":"늦어서 죄송합니다\n왜 늦었지?\n죄송합니다","en":"I'm sorry for being late today.\nWhy were you late?\nSorry.","text":"Tôi xin lỗi đã đến muộn.\nSao lại muộn?\nTôi xin lỗi ạ.\n늦어서 죄송합니다\n왜 늦었지?\n죄송합니다\nI'm sorry for being late today.\nWhy were you late?\nSorry.","sourceUid":"merged-mrozvuip-55","sourceNo":92},{"id":45,"readerNo":46,"displayNo":94,"n":94,"type":"narration","vi":"Lần sau đừng muộn nữa.\nVâng.","ko":"다음엔 그런 일 없도록\n네","en":"Don't be late any more.\nI won't.","text":"Lần sau đừng muộn nữa.\nVâng.\n다음엔 그런 일 없도록\n네\nDon't be late any more.\nI won't.","sourceUid":"merged-mrozwzpp-56","sourceNo":94},{"id":46,"readerNo":47,"displayNo":128,"n":128,"type":"narration","vi":"[Tiếng mưa rơi] [Nhạc chủ đề bắt đầu]","ko":"[비 쏟아지는 소리] [테마 음악 시작]","en":"[Sound of pouring rain] [Theme music starts]","text":"[Tiếng mưa rơi] [Nhạc chủ đề bắt đầu]\n[비 쏟아지는 소리] [테마 음악 시작]\n[Sound of pouring rain] [Theme music starts]","sourceUid":"merged-mrozyt1i-57","sourceNo":128},{"id":47,"readerNo":48,"displayNo":97,"n":97,"type":"narration","vi":"Đi thôi, không lỡ mất xe buýt đấy.\nVâng.","ko":"가요, 버스 놓쳐요\n네\n으!","en":"Let's go, you will miss the bus.\nOkay.","text":"Đi thôi, không lỡ mất xe buýt đấy.\nVâng.\n가요, 버스 놓쳐요\n네\n으!\nLet's go, you will miss the bus.\nOkay.","sourceUid":"merged-mrozzhjy-58","sourceNo":97},{"id":48,"readerNo":49,"displayNo":99,"n":99,"type":"narration","vi":"Anh đừng có đối tốt với tôi. Đang đối tốt mà dừng lại thì…\nchỉ càng mệt mỏi thôi.","ko":"나한테 잘해주지 마요\n잘해주다가 그만두면...\n더 힘들어져요","en":"Don't be nice to me.\nIf you stop being nice to me, then...\nit's going to hurt.","text":"Anh đừng có đối tốt với tôi. Đang đối tốt mà dừng lại thì…\nchỉ càng mệt mỏi thôi.\n나한테 잘해주지 마요\n잘해주다가 그만두면...\n더 힘들어져요\nDon't be nice to me.\nIf you stop being nice to me, then...\nit's going to hurt.","sourceUid":"merged-mrp02gkf-59","sourceNo":99},{"id":49,"readerNo":50,"displayNo":135,"n":135,"type":"narration","vi":"[Tiếng xe buýt dừng]","ko":"[버스 서는 소리]","en":"[Sound of bus stopping]","text":"[Tiếng xe buýt dừng]\n[버스 서는 소리]\n[Sound of bus stopping]","sourceUid":"ko-mrob2li7-659","sourceNo":135},{"id":50,"readerNo":51,"displayNo":104,"n":104,"type":"narration","vi":"Cứ đối tốt mãi là được mà.\nVậy cũng được chứ?\nỞ đây.\nEm vào nhà đi.","ko":"계속 잘해주면 되지 않나?\n잘해줘도 되죠?\n저기...\n들어가요","en":"What if I keep being nice to you? Can I be nice to you then? Here. Get inside.","text":"Cứ đối tốt mãi là được mà.\nVậy cũng được chứ?\nỞ đây.\nEm vào nhà đi.\n계속 잘해주면 되지 않나?\n잘해줘도 되죠?\n저기...\n들어가요\nWhat if I keep being nice to you? Can I be nice to you then? Here. Get inside.","sourceUid":"merged-mrp06tq4-60","sourceNo":104},{"id":51,"readerNo":52,"displayNo":108,"n":108,"type":"narration","vi":"Anh định về thế nào? - Giờ xe buýt cũng không còn. - Thì… Đến phòng tắm hơi gần đây vậy.\nEm đi vào đi.","ko":"어떻게 갈 거예요?\n막차 끊겼는데...\n뭐... 요 앞에 찜질방 가면 되죠\n들어가요...","en":"How are you going home?\n-There are no buses at this time. -Well...\nI can go to Jjimjilbang nearby.\nGet inside now.","text":"Anh định về thế nào? - Giờ xe buýt cũng không còn. - Thì… Đến phòng tắm hơi gần đây vậy.\nEm đi vào đi.\n어떻게 갈 거예요?\n막차 끊겼는데...\n뭐... 요 앞에 찜질방 가면 되죠\n들어가요...\nHow are you going home?\n-There are no buses at this time. -Well...\nI can go to Jjimjilbang nearby.\nGet inside now.","sourceUid":"merged-mrp0gve0-63","sourceNo":108},{"id":52,"readerNo":53,"displayNo":111,"n":111,"type":"narration","vi":"Anh giống đồ ngốc vậy.\nEm chỉ cần nói cảm ơn là được mà.\nNhanh đi vào đi.","ko":"바보 같아요...\n치... 그냥 고맙다고 한마디 하면 될 걸 가지고\n어서 들어가요","en":"You are foolish.\nYou can just say \"Thank you.\"\nCome on, get in.","text":"Anh giống đồ ngốc vậy.\nEm chỉ cần nói cảm ơn là được mà.\nNhanh đi vào đi.\n바보 같아요...\n치... 그냥 고맙다고 한마디 하면 될 걸 가지고\n어서 들어가요\nYou are foolish.\nYou can just say \"Thank you.\"\nCome on, get in.","sourceUid":"merged-mrp0hk5i-64","sourceNo":111},{"id":53,"readerNo":54,"displayNo":148,"n":148,"type":"narration","vi":"[Bíp bíp bíp] [Nhạc chủ đề kết thúc]","ko":"[삑삑삑 문소리] [테마 음악 끝]","en":"[Beep beep beep sound] [Theme music ends]","text":"[Bíp bíp bíp] [Nhạc chủ đề kết thúc]\n[삑삑삑 문소리] [테마 음악 끝]\n[Beep beep beep sound] [Theme music ends]","sourceUid":"merged-mrp0i72u-65","sourceNo":148},{"id":54,"readerNo":55,"displayNo":117,"n":117,"type":"narration","vi":"Chị về rồi ạ?\nTiền bối Yoon về rồi hả?\nGì vậy chị?\nKhông có gì.\nÔi, chị có sao không?\nKhông sao.","ko":"(유은재) 오셨어요?\n어, 윤 선배 왔어?\n왜요?\n아니야, 아무것도...\n아! 아...\n어떡해... 괜찮아요?\n어, 괜찮아...","en":"Hi.\nYou are back.\nWhat is it?\nNothing.\nAre you okay?\nI'm fine.","text":"Chị về rồi ạ?\nTiền bối Yoon về rồi hả?\nGì vậy chị?\nKhông có gì.\nÔi, chị có sao không?\nKhông sao.\n(유은재) 오셨어요?\n어, 윤 선배 왔어?\n왜요?\n아니야, 아무것도...\n아! 아...\n어떡해... 괜찮아요?\n어, 괜찮아...\nHi.\nYou are back.\nWhat is it?\nNothing.\nAre you okay?\nI'm fine.","sourceUid":"merged-mrp0j372-66","sourceNo":117},{"id":55,"readerNo":56,"displayNo":159,"n":159,"type":"narration","vi":"Không biết…\nbạn có thể cho bọn tôi xem thẻ sinh viên hay chứng minh thư không?","ko":"그...\n학생증이나 재학증명서나...\n뭐 신분확인 할 수 있는 것 좀 볼 수 있을까요?","en":"Well...\ndo you have any ID we can see, like a student ID?","text":"Không biết…\nbạn có thể cho bọn tôi xem thẻ sinh viên hay chứng minh thư không?\n그...\n학생증이나 재학증명서나...\n뭐 신분확인 할 수 있는 것 좀 볼 수 있을까요?\nWell...\ndo you have any ID we can see, like a student ID?","sourceUid":"merged-mrp0m4cu-68","sourceNo":159},{"id":56,"readerNo":57,"displayNo":122,"n":122,"type":"narration","vi":"Vì trước đây có người nói dối là sinh viên.\nRõ ràng cũng tốt mà.\nCảm ơn nhé.","ko":"아...\n전에 대학생이라고 거짓말한 사람이 있어서...\n정확한 게 좋죠\n감사합니다","en":"We had someone lying about being a student.\nIt's good to be clear.\nThank you.","text":"Vì trước đây có người nói dối là sinh viên.\nRõ ràng cũng tốt mà.\nCảm ơn nhé.\n아...\n전에 대학생이라고 거짓말한 사람이 있어서...\n정확한 게 좋죠\n감사합니다\nWe had someone lying about being a student.\nIt's good to be clear.\nThank you.","sourceUid":"merged-mrp0o703-69","sourceNo":122},{"id":57,"readerNo":58,"displayNo":123,"n":123,"type":"narration","vi":"Nghe nói giờ bạn cũng đang ở nhà chung,\nkhông biết tại sao bạn lại dọn ra?","ko":"지금도 셰어하우스를 하고 계시다고 들었는데...\n거기서는 왜 나오시려는 거예요?","en":"You said you are living in a shared house now,\nwhy are you leaving that place?","text":"Nghe nói giờ bạn cũng đang ở nhà chung,\nkhông biết tại sao bạn lại dọn ra?\n지금도 셰어하우스를 하고 계시다고 들었는데...\n거기서는 왜 나오시려는 거예요?\nYou said you are living in a shared house now,\nwhy are you leaving that place?","sourceUid":"merged-mrp0phrt-70","sourceNo":123},{"id":58,"readerNo":59,"displayNo":128,"n":128,"type":"narration","vi":"Thì cũng…\nMọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà.\nnhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.","ko":"뭐 그냥...\n사람들은 다 좋은데...\n청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요","en":"It's just...\nthey are all good people,\njust not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","text":"Thì cũng…\nMọi người thì đều tốt cả,\nĐúng rồi. Vấn đề lớn nhất khi ở chung là việc dọn dẹp mà.\nnhưng việc dọn dẹp…\nTôi thì chăm dọn, nhưng có người chỉ làm qua loa thôi.\n뭐 그냥...\n사람들은 다 좋은데...\n청소를 좀...\n하긴... 셰어하우스 하면서 가장 부딪치는 게 청소죠\n난 열심히 하는데... 대충하는 사람 보면\n진짜 짜증 나요\nIt's just...\nthey are all good people,\njust not as clean.\nBiggest problem in a shared house is usually cleaning.\nAlthough I do my best, some people just don't care.","sourceUid":"merged-mrp0tfmc-74","sourceNo":128},{"id":59,"readerNo":60,"displayNo":177,"n":177,"type":"narration","vi":"- Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà.\nChính xác.\nChỗ tôi sống trước đây,\nhọ chỉ dọn vệ sinh đúng một lần một tuần thôi.","ko":"맞아요 화장실, 거실... 이런 데는... 깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요\n전에 살던 데는요...\n화장실 청소를 일주일에 한 번밖에 안 해요","en":"-It's really irritating. -You are right.\nPlaces like bathroom and living room\nshould be looked after properly because these are common spaces.\nThat's what I mean.\nIn my previous shared house,\nthey clean the bathroom only once a week.","text":"- Nên bực mình lắm. - Đúng rồi.\nNhững nơi như phòng tắm, phòng khách\nthì phải giữ sạch sẽ vì là không gian chung mà.\nChính xác.\nChỗ tôi sống trước đây,\nhọ chỉ dọn vệ sinh đúng một lần một tuần thôi.\n맞아요 화장실, 거실... 이런 데는... 깨끗이 써야 되잖아요 다 같이 쓰는 데니까...\n어우, 내 말이요\n전에 살던 데는요...\n화장실 청소를 일주일에 한 번밖에 안 해요\n-It's really irritating. -You are right.\nPlaces like bathroom and living room\nshould be looked after properly because these are common spaces.\nThat's what I mean.\nIn my previous shared house,\nthey clean the bathroom only once a week.","sourceUid":"merged-mrp0vvnx-77","sourceNo":177},{"id":60,"readerNo":61,"displayNo":178,"n":178,"type":"narration","vi":"","ko":"네?","en":"","text":"네?","sourceUid":"ko-mrob2li7-702","sourceNo":178},{"id":61,"readerNo":62,"displayNo":180,"n":180,"type":"narration","vi":"Đã thế lại còn làm có 30 phút. Đấy là dội nước chứ vệ sinh gì đâu.","ko":"그것도 삼십 분밖에 안 해요\n그게 청소하는 거예요? 물 한 번 찍 뿌리고 마는 거지","en":"For 30 minutes, is it cleaning? It's just splashing water around.","text":"Đã thế lại còn làm có 30 phút. Đấy là dội nước chứ vệ sinh gì đâu.\n그것도 삼십 분밖에 안 해요\n그게 청소하는 거예요? 물 한 번 찍 뿌리고 마는 거지\nFor 30 minutes, is it cleaning? It's just splashing water around.","sourceUid":"merged-mrp0wqos-79","sourceNo":180},{"id":62,"readerNo":63,"displayNo":137,"n":137,"type":"narration","vi":"Cũng phải, trông chờ gì ở những người giặt đồ lót chung với đồ thường chứ.","ko":"하긴...\n겉옷이랑 속옷이랑 같이 빠는 사람들한테\n제가 뭘 바라겠어요...","en":"Of course, what can I expect from people who wash their outers and undies together.","text":"Cũng phải, trông chờ gì ở những người giặt đồ lót chung với đồ thường chứ.\n하긴...\n겉옷이랑 속옷이랑 같이 빠는 사람들한테\n제가 뭘 바라겠어요...\nOf course, what can I expect from people who wash their outers and undies together.","sourceUid":"merged-mrp0y3jh-81","sourceNo":137},{"id":63,"readerNo":64,"displayNo":190,"n":190,"type":"narration","vi":"[Tiếng giày] [Tiếng cửa cọt kẹt] [Tiếng đóng cửa] Mmm, mmm, mmm! Ừm... ừm!\n[Tiếng cửa kêu cót két] [Tiếng đóng cửa]","ko":"[신발 소리] [삑삑삑 문소리] [문 닫는 소리] 음, 음, 음! 음... 음!\n[삑삑삑 문소리] [문 닫는 소리]","en":"[Sound of shoes] [Sound of door squeaking] [Sound of door closing] Mmm, mmm, mmm! Um... um! [Sound of door squeaking] [Sound of door closing]","text":"[Tiếng giày] [Tiếng cửa cọt kẹt] [Tiếng đóng cửa] Mmm, mmm, mmm! Ừm... ừm!\n[Tiếng cửa kêu cót két] [Tiếng đóng cửa]\n[신발 소리] [삑삑삑 문소리] [문 닫는 소리] 음, 음, 음! 음... 음!\n[삑삑삑 문소리] [문 닫는 소리]\n[Sound of shoes] [Sound of door squeaking] [Sound of door closing] Mmm, mmm, mmm! Um... um! [Sound of door squeaking] [Sound of door closing]","sourceUid":"merged-mrp0z94d-83","sourceNo":190},{"id":64,"readerNo":65,"displayNo":195,"n":195,"type":"narration","vi":"Bật nó lên đi! [Hát] ♪ Quyến rũ, anh là người đàn ông của em ♪ ♪ Đẹp trai, anh là người đàn ông của em ♪ ♪ Ngay cả khi ngày tận thế này đến ♪\n♪ Anh muốn chìm vào ảo tưởng mãi mãi ♪ [Nhạc chủ đề bắt đầu] ♪ Anh chỉ yêu em cho đến khi anh chết ♪ ♪ Tại sao em không thể để anh đi ♪ ♪ Cho đến khi anh chết ♪ ♪ Anh yêu em ♪","ko":"켜져라 얍! [노래 부른다] ♪ 섹시한 당신은 나의 남자 ♪ ♪ 잘 생긴 당신은 나의 남자 ♪ ♪ 이 세상 마지막이 온대도 ♪\n♪ 영원히 환상에 젖을래 ♪ [테마 음악 시작] ♪ 죽도록 너만을 사랑하는데 ♪ ♪ 왜 날 놓지 못하니 ♪ ♪ 나는 죽을 때까지 ♪ ♪ 사랑해 ♪","en":"Turn it on yap! [Sings] ♪ Sexy you are my man ♪ ♪ Handsome you are my man ♪ ♪ Even if the end of this world comes ♪\n♪ I want to be in a fantasy forever ♪ [Theme music starts] ♪ I love only you until I die ♪ ♪ Why can't you let me go ♪ ♪ Until I die ♪ ♪ I love you ♪","text":"Bật nó lên đi! [Hát] ♪ Quyến rũ, anh là người đàn ông của em ♪ ♪ Đẹp trai, anh là người đàn ông của em ♪ ♪ Ngay cả khi ngày tận thế này đến ♪\n♪ Anh muốn chìm vào ảo tưởng mãi mãi ♪ [Nhạc chủ đề bắt đầu] ♪ Anh chỉ yêu em cho đến khi anh chết ♪ ♪ Tại sao em không thể để anh đi ♪ ♪ Cho đến khi anh chết ♪ ♪ Anh yêu em ♪\n켜져라 얍! [노래 부른다] ♪ 섹시한 당신은 나의 남자 ♪ ♪ 잘 생긴 당신은 나의 남자 ♪ ♪ 이 세상 마지막이 온대도 ♪\n♪ 영원히 환상에 젖을래 ♪ [테마 음악 시작] ♪ 죽도록 너만을 사랑하는데 ♪ ♪ 왜 날 놓지 못하니 ♪ ♪ 나는 죽을 때까지 ♪ ♪ 사랑해 ♪\nTurn it on yap! [Sings] ♪ Sexy you are my man ♪ ♪ Handsome you are my man ♪ ♪ Even if the end of this world comes ♪\n♪ I want to be in a fantasy forever ♪ [Theme music starts] ♪ I love only you until I die ♪ ♪ Why can't you let me go ♪ ♪ Until I die ♪ ♪ I love you ♪","sourceUid":"merged-mrp1028c-84","sourceNo":195},{"id":65,"readerNo":66,"displayNo":201,"n":201,"type":"narration","vi":"Hình như tiền bối Yoon có chuyện gì đó. - Sao thế? - Chị ấy uống bia một mình ở ban công. Tưởng gì chứ. Thì là tối Chủ Nhật mà, ngày chị ấy uống bia, em không biết hả?","ko":"윤 선배요, 무슨 일 있나 봐요\n왜?\n혼자 맥주 마셔요. 베란다에서\n난 또...\n일요일 밤이잖아\n윤 선배 맥주 마시는 날. 몰랐어?\n아...","en":"Something must have happened to Yoon.\n-Why? -She is drinking beer by herself.\nSo what?\nIt's Sunday night, her beer night, didn't you know?","text":"Hình như tiền bối Yoon có chuyện gì đó. - Sao thế? - Chị ấy uống bia một mình ở ban công. Tưởng gì chứ. Thì là tối Chủ Nhật mà, ngày chị ấy uống bia, em không biết hả?\n윤 선배요, 무슨 일 있나 봐요\n왜?\n혼자 맥주 마셔요. 베란다에서\n난 또...\n일요일 밤이잖아\n윤 선배 맥주 마시는 날. 몰랐어?\n아...\nSomething must have happened to Yoon.\n-Why? -She is drinking beer by herself.\nSo what?\nIt's Sunday night, her beer night, didn't you know?","sourceUid":"merged-mrp1n8fj-98","sourceNo":201},{"id":66,"readerNo":67,"displayNo":206,"n":206,"type":"narration","vi":"[Thở dài] [Tiếng rót bia xuống] [Nhạc chủ đề kết thúc] [Tiếng đóng cửa] [Tiếng giày] [Tiếng đóng cửa]","ko":"[한숨 쉰다] [맥주 목 넘기는 소리] [테마 음악 끝] [문 닫는 소리] [신발 소리] [문 닫는 소리]","en":"[Sighs] [Sound of pouring beer down] [Theme music ends] [Sound of door closing] [Sound of shoes] [Sound of door closing]","text":"[Thở dài] [Tiếng rót bia xuống] [Nhạc chủ đề kết thúc] [Tiếng đóng cửa] [Tiếng giày] [Tiếng đóng cửa]\n[한숨 쉰다] [맥주 목 넘기는 소리] [테마 음악 끝] [문 닫는 소리] [신발 소리] [문 닫는 소리]\n[Sighs] [Sound of pouring beer down] [Theme music ends] [Sound of door closing] [Sound of shoes] [Sound of door closing]","sourceUid":"merged-mrp16ns6-87","sourceNo":206},{"id":67,"readerNo":68,"displayNo":146,"n":146,"type":"narration","vi":"Đi ngoại khóa thì phải tập trung vào việc chính, sao em lại dám liếc mắt với trai hả? Không phải em liếc mắt gì hết.","ko":"엠티를 갔으면 멤버십이나 기를 것이지\n어딜 외간남자랑 눈이 맞아서\n눈이 맞은 게 아니고요","en":"When you should be focusing on school, how can you meet a guy? It's not that we did anything--","text":"Đi ngoại khóa thì phải tập trung vào việc chính, sao em lại dám liếc mắt với trai hả? Không phải em liếc mắt gì hết.\n엠티를 갔으면 멤버십이나 기를 것이지\n어딜 외간남자랑 눈이 맞아서\n눈이 맞은 게 아니고요\nWhen you should be focusing on school, how can you meet a guy? It's not that we did anything--","sourceUid":"merged-mrp3fqvq-110","sourceNo":146},{"id":68,"readerNo":69,"displayNo":151,"n":151,"type":"narration","vi":"Tiền bối Yoon, cản họ lại đi! Cậu ta thế nào? Chị ấy hỏi là người thế nào kìa!","ko":"윤 선배 좀 말려줘요 어떤 남잔데? 어떤 남자냐고 물으신다!","en":"Yoon, please stop them! Who is he? The lady is asking you to tell us who he is!","text":"Tiền bối Yoon, cản họ lại đi! Cậu ta thế nào? Chị ấy hỏi là người thế nào kìa!\n윤 선배 좀 말려줘요 어떤 남잔데? 어떤 남자냐고 물으신다!\nYoon, please s 어, 네가 들어. 어? 야... 다 들어! 둔탱이...","en":"Can't really trust you.\nOkay, you carry it.\nCarry them all.","text":"Sau này anh lại kể công.\nBiết rồi, thế em cầm đi.\nCầm hết luôn đi.\n나중에 무슨 소릴 하려고 알았어, 네가 들어. 어? 야... 다 들어! 둔탱이...\nCan't really trust you.\nOkay, you carry it.\nCarry them all.","sourceUid":"merged-mrp410ok-127","sourceNo":248},{"id":81,"readerNo":82,"displayNo":251,"n":251,"type":"narration","vi":"[Nhạc nền sôi động kết thúc]","ko":"[경쾌한 배경 음악 끝]","en":"[Upbeat background music ends]","text":"[Nhạc nền sôi động kết thúc]\n[경쾌한 배경 음악 끝]\n[Upbeat background music ends]","sourceUid":"ko-mrob2li8-775","sourceNo":251},{"id":82,"readerNo":83,"displayNo":255,"n":255,"type":"narration","vi":"Vâng. Anh ấy cứ nhìn thấy em là trêu chọc, kêu là con bé xấu xí. Nên em phải cẩn thận tiền bối ấy. Là vậy sao?","ko":"네...\n맨날 나만 보면 놀리고 괴롭히고\n못난이라 그러고\n그러니까, 그 선배는 조심해야 돼요\n그런 거냐?","en":"Yes. He always teases me and bothers me... calls me ugly. I need to watch out. Is that so?","text":"Vâng. Anh ấy cứ nhìn thấy em là trêu chọc, kêu là con bé xấu xí. Nên em phải cẩn thận tiền bối ấy. Là vậy sao?\n네...\n맨날 나만 보면 놀리고 괴롭히고\n못난이라 그러고\n그러니까, 그 선배는 조심해야 돼요\n그런 거냐?\nYes. He always teases me and bothers me... calls me ugly. I need to watch out. Is that so?","sourceUid":"merged-mrp43uzw-132","sourceNo":255},{"id":83,"readerNo":84,"displayNo":257,"n":257,"type":"narration","vi":"[Nhạc nền sôi động bắt đầu]","ko":"[경쾌한 배경 음악 시작]","en":"[Upbeat background music starts]","text":"[Nhạc nền sôi động bắt đầu]\n[경쾌한 배경 음악 시작]\n[Upbeat background music starts]","sourceUid":"ko-mrob2li8-781","sourceNo":257},{"id":84,"readerNo":85,"displayNo":260,"n":260,"type":"narration","vi":"Nếu không phải cậu ta thì là ai?\nTrời ạ… Để đôi tay mảnh khảnh kia phải bưng bê thì hổ thẹn cho đấng mày râu quá.","ko":"그 남자 아니면 누구야?\n(남학생) 이런, 이런...\n그 가녀린 팔로 짐을 들다니\n이거 우리 남자들의 수치인걸...","en":"If it's not him, who is it then?\nCome on...\ncarrying so much in such slender arms...\nthat's a disgrace for men.","text":"Nếu không phải cậu ta thì là ai?\nTrời ạ… Để đôi tay mảnh khảnh kia phải bưng bê thì hổ thẹn cho đấng mày râu quá.\n그 남자 아니면 누구야?\n(남학생) 이런, 이런...\n그 가녀린 팔로 짐을 들다니\n이거 우리 남자들의 수치인걸...\nIf it's not him, who is it then?\nCome on...\ncarrying so much in such slender arms...\nthat's a disgrace for men.","sourceUid":"merged-mrpqutqf-35","sourceNo":260},{"id":85,"readerNo":86,"displayNo":262,"n":262,"type":"narration","vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc nền tuyệt vời bắt đầu]","ko":"[경쾌한 배경 음악 끝]\n[환상적인 배경 음악 시작]","en":"[Upbeat background music ends]\n[Fantastic background music starts]","text":"[Nhạc nền sôi động kết thúc]\n[Nhạc nền tuyệt vời bắt đầu]\n[경쾌한 배경 음악 끝]\n[환상적인 배경 음악 시작]\n[Upbeat background music ends]\n[Fantastic background music starts]","sourceUid":"merged-mrp48i72-139","sourceNo":262},{"id":86,"readerNo":87,"displayNo":266,"n":266,"type":"narration","vi":"Bạn nữ đến đây đã phải cảm ơn lắm rồi.\nSao lại để em bê đồ được.\nĐưa cho anh.","ko":"여학우들은 와 준 것만 해도 고마운데... 짐을 들게 할 순 없지 하... 이리 줘","en":"It's a pleasure having you here,\nI can't let you carry bags.\nGive them to me.","text":"Bạn nữ đến đây đã phải cảm ơn lắm rồi.\nSao lại để em bê đồ được.\nĐưa cho anh.\n여학우들은 와 준 것만 해도 고마운데... 짐을 들게 할 순 없지 하... 이리 줘\nIt's a pleasure having you here,\nI can't let you carry bags.\nGive them to me.","sourceUid":"merged-mrp47qzx-137","sourceNo":266},{"id":87,"readerNo":88,"displayNo":269,"n":269,"type":"narration","vi":"[Kết thúc nhạc nền tuyệt vời]\n[Thở dài] [Nhạc nền tuyệt vời]","ko":"[환상적인 배경 음악 끝]\n[한숨 쉰다] [환상적인 배경 음악]","en":"[End of fantastic background music]\n[Sighs] [Fantastic background music]","text":"[Kết thúc nhạc nền tuyệt vời]\n[Thở dài] [Nhạc nền tuyệt vời]\n[환상적인 배경 음악 끝]\n[한숨 쉰다] [환상적인 배경 음악]\n[End of fantastic background music]\n[Sighs] [Fantastic background music]","sourceUid":"merged-mrp4dqnh-145","sourceNo":269},{"id":88,"readerNo":89,"displayNo":272,"n":272,"type":"narration","vi":"Chờ lát.\nVậy người em thích không phải là người đầu tiên?","ko":"(송지원) 아이, 잠시만...\n그러니까 은순이 마음에 들어온 남자가...\n첫 번째 남자가 아니고?","en":"Wait.\nSo, it's not that first guy you are into?","text":"Chờ lát.\nVậy người em thích không phải là người đầu tiên?\n(송지원) 아이, 잠시만...\n그러니까 은순이 마음에 들어온 남자가...\n첫 번째 남자가 아니고?\nWait.\nSo, it's not that first guy you are into?","sourceUid":"merged-mrp4b47r-141","sourceNo":272},{"id":89,"readerNo":90,"displayNo":276,"n":276,"type":"narration","vi":"Mà là người con trai thứ hai?\nAi lại để con gái bê đồ thế này,\ncòn đâu là mặt mũi đấng nam nhi.\nLà người đó sao?","ko":"으응! 두 번째 남자란 말이지? '이런 이런... 여학우에게 짐을 들게 하다니...' '이거 사나이 체면이 말이 아니군’ 이 남자?","en":"It is a second guy? I can't let girls carry things, my dignity doesn't allow this. This guy?","text":"Mà là người con trai thứ hai?\nAi lại để con gái bê đồ thế này,\ncòn đâu là mặt mũi đấng nam nhi.\nLà người đó sao?\n으응! 두 번째 남자란 말이지? '이런 이런... 여학우에게 짐을 들게 하다니...' '이거 사나이 체면이 말이 아니군’ 이 남자?\nIt is a second guy? I can't let girls carry things, my dignity doesn't allow this. This guy?","sourceUid":"merged-mrp4bq24-142","sourceNo":276},{"id":90,"readerNo":91,"displayNo":281,"n":281,"type":"narration","vi":"Dạo này còn người như thế à?\nTóm lại thì…\nai đi nữa cũng phải cẩn thận.\nGì ạ?","ko":"요새도 그런 사람 있냐?\n어우... 어우...\n뭐...\n이놈이든 저놈이든 명심해\n뭐요?","en":"Those people are still around? Well... regardless, remember... What?","text":"Dạo này còn người như thế à?\nTóm lại thì…\nai đi nữa cũng phải cẩn thận.\nGì ạ?\n요새도 그런 사람 있냐?\n어우... 어우...\n뭐...\n이놈이든 저놈이든 명심해\n뭐요?\nThose people are still around? Well... regardless, remember... What?","sourceUid":"merged-mrp4cilp-143","sourceNo":281},{"id":91,"readerNo":92,"displayNo":287,"n":287,"type":"narration","vi":"Phải đeo bao cao su khi quan hệ.\nChị làm em tưởng tượng.\nChị phải đi tắm đây.","ko":"섹스할 땐 콘돔 장착 아우, 쫌... 아우... 상상했잖아요... 오... 씻어야겠다","en":"...to use a condom when having sex.\nYou made me imagine it.\nI need to wash myself.","text":"Phải đeo bao cao su khi quan hệ.\nChị làm em tưởng tượng.\nChị phải đi tắm đâ
